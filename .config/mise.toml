# Minimum mise version. CI installs mise via jdx/mise-action (.github/workflows).
min_version = "2026.4.5"

[tools]
buf = "1.73.0"
taplo = "0.10.0"
jq = "1.8.2"

[tasks.format]
description = "Format proto and TOML files"
run = ["buf format -w", "taplo fmt"]

[tasks.next-id]
description = "Print the next available component type ID (max assigned + 1)"
dir = "{{ config_root }}"
run = "buf build -o -#format=json | jq -f tools/next-component-id.jq"

[tasks.check-id-gaps]
description = "Fail if any gap between component type IDs exceeds the threshold"
dir = "{{ config_root }}"
run = "buf build -o -#format=json | jq -r --argjson max 15 -f tools/check-component-id-gaps.jq"

[tasks.lint]
description = "Run all linting checks locally (CI uses bufbuild/buf-action)"
run = [
  "buf format -d --exit-code",
  "buf lint",
  "buf breaking --against .git#ref=refs/remotes/origin/main",
  "taplo fmt --check",
  "mise run check-id-gaps",
  "mise run test-model-unit-settings",
]

[tasks.test-model-unit-settings]
description = "Check the compiled model unit symbol wire contract"
dir = "{{ config_root }}"
run = "buf build -o -#format=json | jq -e -f tools/test-model-unit-settings.jq"

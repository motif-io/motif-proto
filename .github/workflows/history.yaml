# Checks that a pull request is built on this repository's own history.
#
# Every root commit (a commit with no parents) reachable from the pull request
# head must also be a root of the base branch. A branch that carries unrelated
# history fails, whether it was pushed to this repository or opened from a
# fork. This keeps commits that never passed through this repository's
# rulesets, including their author emails, out of main.
name: Commit history

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      # The pull request head, not the merge ref: GitHub cannot build a merge
      # ref for unrelated histories. fetch-depth 0 also fetches every branch,
      # so the base commit is available without a second fetch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check root commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_roots=$(git rev-list --max-parents=0 "$BASE_SHA" | sort)
          head_roots=$(git rev-list --max-parents=0 HEAD | sort)
          unrelated=$(comm -13 <(echo "$base_roots") <(echo "$head_roots"))
          if [ -n "$unrelated" ]; then
            echo "::error::This branch contains history that is not part of the base branch. Rebase only your own commits onto the current base branch and push again."
            echo "Root commits not in the base branch:"
            echo "$unrelated"
            exit 1
          fi
          echo "All root commits are part of the base branch."

# Buf CI/CD, following https://buf.build/docs/bsr/ci-cd/github-actions/
#
# bufbuild/buf-action runs the right checks per event automatically:
#   - pull_request: build, lint, format, and breaking-change detection
#     (against the PR base branch), with results posted as annotations and a
#     summary comment. The `buf skip breaking` PR label opts out of breaking.
#   - push to main: publishes named modules to the BSR (buf push), tagged with
#     git metadata. Scoped to main so only merged changes are published.
#   - delete: archives the BSR label for the deleted branch/tag.
#
# BUF_TOKEN is an environment secret on the `bsr-publish` environment, which is
# restricted to the main branch. Only the publish job references that
# environment, so the token is never present in pull_request runs and cannot be
# exfiltrated by an untrusted fork PR.
name: Buf CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  delete:

jobs:
  # PR checks: build, lint, format, and breaking-change detection. Runs without
  # BSR credentials so untrusted fork PRs never have access to BUF_TOKEN.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: mise run test:dimension-source-evolution

  # Publish named modules to the BSR (push to main) and archive labels for
  # deleted branches/tags (delete). Requires BUF_TOKEN, sourced from the
  # main-restricted `bsr-publish` environment.
  publish:
    if: github.event_name == 'push' || github.event_name == 'delete'
    runs-on: ubuntu-latest
    environment: bsr-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          token: ${{ secrets.BUF_TOKEN }}

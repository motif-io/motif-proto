# Checks on Motif component type IDs (see CONTRIBUTING.md "Choosing a Component ID").
#
# Gaps in component ID allocations make it difficult to choose new IDs based
# on the maximum allocated value without wasting IDs in the ID space. This
# check guards against significant gaps between allocated IDs.
name: Component IDs

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  component-id-gap-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: mise run check-id-gaps

# Checks on Motif component type IDs (see CONTRIBUTING.md "Choosing a Component ID").
#
# Gaps in component ID allocations make it difficult to choose new IDs based
# on the maximum allocated value without wasting IDs in the ID space. The gap
# check guards against significant gaps between allocated IDs. The reserved-ID
# check rejects types using IDs reserved for types developed in a model, which
# are never committed.
name: Component IDs

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  component-id-gap-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: mise run check-id-gaps
      - run: mise run check-reserved-ids

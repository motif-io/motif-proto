# Checks on Motif component type IDs (see README "Choosing a component ID").
#
# Gaps in component ID allocations make it difficult to choose new IDs based
# on the maximum allocated value without wasting IDs in the ID space. This
# check guards against significant gaps between allocated IDs.
name: Component IDs

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  component-id-gap-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - run: mise run check-id-gaps

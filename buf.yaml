# For details on buf.yaml configuration, visit https://buf.build/docs/configuration/v2/buf-yaml
version: v2
modules:
  - path: proto
    name: buf.build/motif/platform
deps:
  - buf.build/bufbuild/protovalidate
plugins:
  - plugin: buf.build/motif/motif-options
lint:
  use:
    - STANDARD
    - MOTIF
  # Partner-owned packages (bhom.data.*, …) live under proto/3p/<partner>/<domain>/v1/
  # rather than <partner>/data/<domain>/v1/, so PACKAGE_DIRECTORY_MATCH cannot apply.
  ignore_only:
    PACKAGE_DIRECTORY_MATCH:
      - proto/3p
breaking:
  use:
    - FILE
    - MOTIF

syntax = "proto3";

package thirdparty.bhom.data.base.v1;

import "motif/extension/v1/options.proto";

message BHoMBase {
  option (motif.extension.v1.message).component = 133;

  // Upstream BHoM oM full type name (for example, `BH.oM.Physical.Elements.Beam`).
  string bhom_type_full_name = 1;

  // Optional assembly disambiguator (for example, `Physical_oM`).
  string bhom_assembly = 2;

  // Display name from `BHoMObject.Name`.
  string name = 3;
}

// Source-fidelity BHoM payload for round-tripping imported BHoM JSON Objects.
message BHoMSource {
  option (motif.extension.v1.message).component = 155;

  // Source BHoM object GUID (`BHoM_Guid`).
  string bhom_guid = 1;

  // BHoM concrete type discriminator (`_t`), for example
  // `BH.oM.Structure.Elements.Bar`.
  string bhom_type = 2;

  // Source BHoM version metadata (`_bhomVersion`).
  string bhom_version = 3;

  // Canonically-normalized source JSON payload used as the export base.
  string source_payload_json = 4;

  // Payload encoding/shape identifier, for example `bhom-json`.
  string payload_format = 5;

  // Version of the payload encoding/normalization contract.
  string payload_format_version = 6;

  // SHA-256 hash of `source_payload_json` bytes after normalization.
  bytes payload_sha256 = 7;
}

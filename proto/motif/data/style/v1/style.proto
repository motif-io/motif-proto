syntax = "proto3";

// Styling components: color, opacity, line, and font styling applied to
// entities.
package motif.data.style.v1;

import "buf/validate/validate.proto";
import "motif/extension/v1/options.proto";

// A color, expressed in either the sRGB or linear-RGB color space.
message Color {
  option (motif.extension.v1.message).component = 33;

  // The color value. Exactly one color space must be set.
  oneof data {
    option (buf.validate.oneof).required = true;

    // sRGB-encoded color. See https://webstore.iec.ch/en/publication/6169.
    Srgb srgb = 1;
    // Linear-RGB color.
    LinearRgb linear_rgb = 2;
  }

  // An sRGB color with integer channels.
  message Srgb {
    // Red channel.
    uint32 red = 1;
    // Green channel.
    uint32 green = 2;
    // Blue channel.
    uint32 blue = 3;
  }

  // A linear-RGB color with floating-point channels.
  message LinearRgb {
    // Red channel.
    float red = 1;
    // Green channel.
    float green = 2;
    // Blue channel.
    float blue = 3;
  }
}

// The opacity (alpha) applied to an entity, from 0 (transparent) to 1 (opaque).
message Opacity {
  option (motif.extension.v1.message).component = 34;

  // Opacity in the range [0, 1].
  float value = 1 [(buf.validate.field).float = {
    gte: 0
    lte: 1
  }];
}

// The line styling applied to an entity.
message LineStyle {
  option (motif.extension.v1.message).component = 57;

  // On-paper line width, in millimeters.
  float width = 1;

  // Optional integer pen index (Revit-style). When set, the renderer resolves
  // the on-paper width in mm from the project's pen-width table for the
  // active view's scale and ignores `width`.
  optional uint32 pen_size = 2;

  // The line pattern applied to the entity's strokes: dashes, spaces, and dots.
  // Unset means a continuous solid stroke. An entity either references a pattern
  // by name or carries its own inline definition. Pattern lengths are fixed
  // printed-paper sizes, so a pattern renders at a constant printed size
  // regardless of view scale.
  oneof pattern {
    // Reference to a pattern by name. An unqualified name (e.g. "Hidden",
    // "Grid Line") resolves against the built-in patterns shipped with the
    // product. A catalog-qualified form "<catalog>:<pattern>" (split on the
    // first ":") is reserved so user- or third-party-defined pattern catalogs
    // can namespace their own patterns without colliding with the built-ins; an
    // unqualified name is equivalent to the reserved "motif" catalog.
    string pattern_ref = 3;

    // An inline pattern definition carried by this entity instead of a named
    // reference — the same shape as the built-in catalog patterns, letting a
    // line be its own pattern.
    LinePattern pattern_def = 4;
  }
}

// Default appearance of level, section, and elevation tag foregrounds.
// Stored on a model for defaults, or on a host view for field-wise exceptions.
// Absent fields inherit the model value, then the built-in role appearance.
// Paper interiors and level datum lines retain their existing appearance.
message TagInk {
  option (motif.extension.v1.message).component = 188;

  // Foreground ink, including tag labels. Unset retains the role's color.
  Color color = 1;

  // Pen-table index. Unset retains the role's screen-pixel fallback weight.
  optional uint32 pen_size = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 16
  }];

  // Future graphic-style identity. Retained but not resolved by this stand-in.
  optional string style_id = 3 [(buf.validate.field).string.uuid = true];
}

// A line pattern definition: one repeating cycle of dashes, spaces, and dots.
// Shared by the built-in catalog and by inline definitions on an entity (see
// LineStyle.pattern_def). An empty cycle is a continuous solid stroke.
message LinePattern {
  // The elements of one repeat, in order.
  repeated LinePatternElement elements = 1;
}

// One element of a line pattern's repeating cycle. Exactly one kind is set.
message LinePatternElement {
  oneof element {
    option (buf.validate.oneof).required = true;

    // A drawn (on) segment; printed-paper length in millimeters.
    float dash = 1 [(buf.validate.field).float = {gt: 0}];
    // An undrawn (off) segment; printed-paper length in millimeters.
    float space = 2 [(buf.validate.field).float = {gt: 0}];
    // A dot marker. Carries no length; drawn at the line's width.
    Dot dot = 3;
  }

  // A dot marker (no fields).
  message Dot {}
}

// A named, reusable set of line properties: a line style asset. Lives on an
// asset entity (core.v1.Asset + a name) in any library a model can reach.
//
// Every field is optional; an unset field leaves that property to whatever
// applies beneath this style (ultimately the application default), so a style
// may specify any subset of properties.
message LineStyleAsset {
  option (motif.extension.v1.message).component = 190;

  // Stroke color.
  Color color = 1;
  // Stroke opacity, 0 (transparent) to 1 (opaque).
  optional float opacity = 2 [(buf.validate.field).float = {
    gte: 0
    lte: 1
  }];
  // Pen index (Revit-style), resolved to an on-paper width from the project's
  // pen-width table at the presenting view's scale (see LineStyle.pen_size).
  optional uint32 pen_size = 3 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 16
  }];
  // Line pattern, by name, as LineStyle.pattern_ref names one. "Solid" is an
  // explicit continuous stroke; an absent field leaves the pattern unset.
  optional string pattern_ref = 4;
}

// Font identity that survives reload (family name, not an unstable runtime
// font-database id). A plain embedded message, not a standalone component.
message Font {
  // Font family name, e.g. "Roboto".
  string family = 1;
  // star font style bits: BOLD = 0x1, ITALIC = 0x2. Unknown bits are ignored.
  uint32 style_flags = 2;
}

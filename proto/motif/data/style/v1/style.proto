syntax = "proto3";

// Styling components: color, opacity, line, and font styling applied to
// entities.
package motif.data.style.v1;

import "buf/validate/validate.proto";
import "motif/extension/v1/options.proto";
import "motif/extension/v1/reference.proto";

// A color, expressed in either the sRGB or linear-RGB color space.
message Color {
  option (motif.extension.v1.message).component = 33;

  // The color value. Exactly one color space must be set.
  oneof data {
    option (buf.validate.oneof).required = true;

    // sRGB-encoded color. See https://webstore.iec.ch/en/publication/6169.
    Srgb srgb = 1;
    // Linear-RGB color.
    LinearRgb linear_rgb = 2;
  }

  // An sRGB color with integer channels.
  message Srgb {
    // Red channel.
    uint32 red = 1;
    // Green channel.
    uint32 green = 2;
    // Blue channel.
    uint32 blue = 3;
  }

  // A linear-RGB color with floating-point channels.
  message LinearRgb {
    // Red channel.
    float red = 1;
    // Green channel.
    float green = 2;
    // Blue channel.
    float blue = 3;
  }
}

// The opacity (alpha) applied to an entity, from 0 (transparent) to 1 (opaque).
message Opacity {
  option (motif.extension.v1.message).component = 34;

  // Opacity in the range [0, 1].
  float value = 1 [(buf.validate.field).float = {
    gte: 0
    lte: 1
  }];
}

// The line styling applied to an entity.
message LineStyle {
  option (motif.extension.v1.message).component = 57;

  // On-paper line width, in millimeters.
  float width = 1;

  // Optional integer pen index (Revit-style). When set, the renderer resolves
  // the on-paper width in mm from the project's pen-width table for the
  // active view's scale and ignores `width`.
  optional uint32 pen_size = 2;

  // The line pattern applied to the entity's strokes: dashes, spaces, and dots.
  // Unset means a continuous solid stroke. An entity either references a pattern
  // by name or carries its own inline definition. Pattern lengths are fixed
  // printed-paper sizes, so a pattern renders at a constant printed size
  // regardless of view scale.
  oneof pattern {
    // Reference to a pattern by name. An unqualified name (e.g. "Hidden",
    // "Grid Line") resolves against the built-in patterns shipped with the
    // product. A catalog-qualified form "<catalog>:<pattern>" (split on the
    // first ":") is reserved so user- or third-party-defined pattern catalogs
    // can namespace their own patterns without colliding with the built-ins; an
    // unqualified name is equivalent to the reserved "motif" catalog.
    string pattern_ref = 3;

    // An inline pattern definition carried by this entity instead of a named
    // reference — the same shape as the built-in catalog patterns, letting a
    // line be its own pattern.
    LinePattern pattern_def = 4;
  }
}

// Default appearance of level, section, and elevation tag foregrounds.
// Stored on a model for defaults, or on a host view for field-wise exceptions.
// Absent fields inherit the model value, then the built-in role appearance.
// Paper interiors and level datum lines retain their existing appearance.
message TagInk {
  option (motif.extension.v1.message).component = 188;

  // Foreground ink, including tag labels. Unset retains the role's color.
  Color color = 1;

  // Pen-table index. Unset retains the role's screen-pixel fallback weight.
  optional uint32 pen_size = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 16
  }];

  // Future graphic-style identity. Retained but not resolved by this stand-in.
  // When wired up, use a new PinnedStyleAssetReference field for model
  // qualification; do not reinterpret this UUID field as a resolved reference.
  optional string style_id = 3 [(buf.validate.field).string.uuid = true];
}

// A line pattern definition: one repeating cycle of dashes, spaces, and dots.
// Shared by the built-in catalog and by inline definitions on an entity (see
// LineStyle.pattern_def). An empty cycle is a continuous solid stroke.
message LinePattern {
  // The elements of one repeat, in order.
  repeated LinePatternElement elements = 1;
}

// One element of a line pattern's repeating cycle. Exactly one kind is set.
message LinePatternElement {
  oneof element {
    option (buf.validate.oneof).required = true;

    // A drawn (on) segment; printed-paper length in millimeters.
    float dash = 1 [(buf.validate.field).float = {gt: 0}];
    // An undrawn (off) segment; printed-paper length in millimeters.
    float space = 2 [(buf.validate.field).float = {gt: 0}];
    // A dot marker. Carries no length; drawn at the line's width.
    Dot dot = 3;
  }

  // A dot marker (no fields).
  message Dot {}
}

// A named, reusable set of line properties: a line style asset. Lives on an
// asset entity (core.v1.Asset + a name) in any library a model can reach.
//
// Every property is optional; an unset one leaves that property to whatever
// applies beneath this style (ultimately the application default), so a style
// may specify any subset of properties.
message LineStyleAsset {
  option (motif.extension.v1.message).component = 190;

  // Stroke color: set directly, or taken from a color style asset. Neither set
  // leaves the color unset.
  oneof color_source {
    // A color set directly on this style.
    Color color = 1;
    // A color style asset (ColorStyleAsset) whose color this style uses.
    // Uses legacy resolution unless pin_color_style is true.
    StyleAssetReference color_style = 4;
  }
  // Stroke opacity, 0 (transparent) to 1 (opaque).
  optional float opacity = 2 [(buf.validate.field).float = {
    gte: 0
    lte: 1
  }];
  // Stroke weight and pattern, as an entity's own LineStyle carries them. An
  // unset `line` leaves both unset. Within it, an unset `pen_size` leaves the
  // weight unset, and an unset `pattern` leaves the pattern unset rather than
  // meaning a solid stroke; "Solid" by reference is an explicit continuous
  // stroke. `width` is written as 0 and ignored: styles are pen-sized lines.
  LineStyle line = 3;

  // Explicitly opts color_style into pinned resolution. Unset or false retains
  // legacy behavior, so existing assets do not become pinned. Ignored when
  // color_style is unset. When true, a set model selects exactly that version;
  // an unset model uses the containing model snapshot and follows local edits.
  // Writers must explicitly choose the version when enabling this flag, not
  // trust a version stored by a legacy writer. Updating a pin is an explicit
  // edit recorded in the referencing model's history.
  // Older readers ignore this flag and retain legacy resolution; use pin-aware
  // readers when pinned appearance is required.
  optional bool pin_color_style = 5;
}

// A named, reusable color and opacity: a color style asset. Lives on an asset
// entity (core.v1.Asset + a name) in any library a model can reach. Line, text
// and shape style assets can take their color from one instead of setting it
// directly.
message ColorStyleAsset {
  option (motif.extension.v1.message).component = 191;

  // The color. Unset leaves the color unset for every style that uses this one.
  Color color = 1;
  // Opacity, 0 (transparent) to 1 (opaque). Unset contributes no opacity, so
  // a fill that uses this style falls through to whatever applies beneath.
  optional float opacity = 2 [(buf.validate.field).float = {
    gte: 0
    lte: 1
  }];
}

// A named, reusable look for a closed 2D shape: its fill and its border. A
// shape style asset. Lives on an asset entity (core.v1.Asset + a name) in any
// library a model can reach. The host owns the boundary (for a text
// annotation, the box around its text); the style only says how to draw it.
//
// Every field is optional; an unset field leaves that property to whatever
// applies beneath this style (ultimately the application default).
// This existing wire representation is retained for compatibility. FillStyle
// and LineStyleSource express equivalent properties for new styles, but their
// explicit references are pinned while these legacy references follow latest.
// Readers that normalize these properties must retain the reference resolution
// mode. Any future schema migration must use new fields rather than changing
// these fields' types or numbers.
message ShapeStyleAsset {
  option (motif.extension.v1.message).component = 196;

  // Fill color: set directly, or taken from a color style asset (ColorStyleAsset).
  // Neither set leaves the fill color unset.
  oneof fill_source {
    // A color set directly on this style.
    Color fill_color = 1;
    // A color style asset whose color this style fills with.
    StyleAssetReference fill_color_style = 2;
  }
  // Fill opacity, 0 (no fill) to 1 (opaque). Applies to either fill source.
  // Unset with fill_color_style set, the fill draws at that color style's
  // opacity when it has one; unset otherwise, the fill opacity falls through to
  // whatever applies beneath this style.
  optional float fill_opacity = 3 [(buf.validate.field).float = {
    gte: 0
    lte: 1
  }];
  // The border: a line style asset (LineStyleAsset or LineStyleAssetV2), or the
  // line properties set on this style itself. Neither set leaves the border
  // unset.
  oneof border {
    // A line style asset whose color, opacity, weight and pattern the border uses.
    StyleAssetReference line_style = 4;
    // The border's own line properties, as a line style asset carries them.
    LineStyleAsset border_properties = 5;
  }
}

// A reference from one style asset to another (e.g. a line style's color
// style). Not a component: embedded in the referencing style.
// The expected style component is determined by the field using this reference;
// the target entity must carry that component, in either generation where a V2
// component supersedes it (see style_asset_v2.proto).
// By default the recorded model version is not a pin. LineStyleAsset can
// explicitly opt its color_style into pinning using pin_color_style. Other
// legacy references are constrained in graphic styles as documented below.
message StyleAssetReference {
  // The referenced style asset entity. Required.
  motif.extension.v1.EntityReference asset = 1 [(buf.validate.field).required = true];

  // The library model holding the referenced style. Unset means the model
  // containing the referencing style, in that style's current resolution
  // context. A nested local reference uses the same model snapshot as the
  // containing style; it does not independently load the latest snapshot.
  // Unless the containing field explicitly opts into pinning, readers match a
  // set model by ID, ignoring its recorded version. Outside a pinned context
  // this follows library updates. Inside a pinned context, an
  // explicit reference to the containing model uses the containing snapshot,
  // just like an unset model. A legacy reference to another model must be
  // converted before the style can be reused in a pinned graph.
  motif.extension.v1.ModelReference model = 2;
}

// A style reference with explicit version pinning for external assets. Not a
// component. The field using it determines the required target style component.
// This new message opts into a pinned resolution context without changing how
// existing StyleAssetReference values are resolved on their own.
//
// The policy applies through the target's entire style dependency graph.
// Explicit PinnedStyleAssetReference values use their recorded versions.
// LineStyleAsset.color_style also does so when pin_color_style is true.
// Legacy StyleAssetReference values without an explicit pin opt-in never use
// their stored versions as pins: an unset model, or a model ID equal to the
// containing style's model, resolves
// in that style's snapshot. Thus G at L@v3 referencing X in L resolves X at L@v3,
// even if a legacy reference explicitly records L@v1. A separate explicit pin
// to X at L@v7 resolves independently; neither path changes the other's version.
// Readers must keep resolution state per path, not one version per model ID.
//
// A legacy reference to a different model cannot establish a stable dependency:
// its version may have been a placeholder when follow-latest data was written.
// Before a writer reuses that style in a pinned graph, it must convert that edge
// to an explicit pinned reference in a field supporting this type, or copy its
// resolved properties inline so the graph no longer relies on that edge.
// Reject reuse until conversion is complete; do not silently follow latest or
// reinterpret the legacy version as a pin. Writers must also reject dependency
// edits that introduce an unconverted cross-model legacy edge into an existing
// pinned graph, including edits to local styles that graph references.
// If a reader encounters such an edge (for example in data written by another
// client), treat only the property supplied by that edge as unset and inherit
// it. Preserve the other properties; never load latest or trust the legacy
// version. This rendering fallback does not make the graph valid for reuse.
// For named or inline LineStyleAsset values, writers can explicitly select
// the external version and set pin_color_style. Copying the resolved color
// directly or into the containing model snapshot also removes the unsafe edge.
message PinnedStyleAssetReference {
  // The referenced style asset entity. Required.
  motif.extension.v1.EntityReference asset = 1 [(buf.validate.field).required = true];

  // The external model and exact version holding the style, including Standard
  // Library, organization libraries, or any other model. Later publications do
  // not advance this pin. Updating it is an explicit edit to the referencing
  // model and must be recorded in that model's history.
  // Unset means the model containing the referencing style: local references
  // follow local edits. Inside an externally pinned style, "local" means its
  // pinned snapshot, not the library's latest version.
  motif.extension.v1.ModelReference model = 2;
}

// A fill: color and opacity. Not a component. Embedded wherever a fill is
// set, starting with GeometryStyle. New styles reuse this definition;
// ShapeStyleAsset retains its existing equivalent fields for compatibility.
//
// Every field is optional. An unset field leaves that property unset. A color
// style uses PinnedStyleAssetReference so external colors remain pinned.
message FillStyle {
  // Fill color: set directly, or taken from a color style asset (ColorStyleAsset).
  // Neither set leaves the fill color unset.
  oneof color_source {
    // A color set directly on this fill.
    Color color = 1;
    // A color style asset whose color this fill uses.
    PinnedStyleAssetReference color_style = 2;
  }
  // Fill opacity, 0 (no fill) to 1 (opaque). Applies to either color source.
  // Unset with color_style set, the fill draws at that color style's opacity
  // when it has one; unset otherwise, the opacity falls through to whatever
  // applies beneath this fill.
  optional float opacity = 3 [(buf.validate.field).float = {
    gte: 0
    lte: 1
  }];
}

// Line properties taken from a named style asset or defined inline. Not a
// component: embedded wherever a geometry style sets its line appearance.
// Both sources support partial properties; unset properties inherit.
// The sources are alternatives: inline properties replace the reference, not
// individual properties of the named style. Combining a named style with local
// overrides is not supported by this message.
// An unset source, including a future variant this reader does not know,
// contributes no line properties; inherit all of them.
message LineStyleSource {
  oneof source {
    // Must reference an entity carrying a line style asset: LineStyleAsset or
    // LineStyleAssetV2.
    PinnedStyleAssetReference style = 1;
    // Line properties owned by the containing style rather than a named asset.
    // Unflagged legacy color_style references stay within the containing model
    // snapshot. External colors must explicitly opt into pinning using
    // pin_color_style before reuse.
    LineStyleAsset properties = 2;
  }
}

// The appearance of geometry: linework and fill. Not a component: embedded in
// GraphicStyleAsset for cut and projection appearance. Every property is
// optional and inherits independently from whatever applies beneath this style.
message GeometryStyle {
  // Line properties, set directly or taken from a line style asset. Unset
  // leaves pen, color, opacity, and pattern unset so they inherit.
  LineStyleSource line = 1;

  // Fill color and opacity. Unset leaves the fill unset.
  FillStyle fill = 2;
}

// A named graphic style: cut and projection appearance. Lives on an asset
// entity (core.v1.Asset + a name) in any library a model can reach.
//
// Appearance only. Every field is optional; an unset field leaves that
// property to whatever applies beneath this style. Cut and projection each
// group linework and fill. Line properties may be inline or reference a line
// style asset, and may set only a pattern. "Solid" on that line style is an
// explicit continuous stroke, not an unset pattern. Material styling is deferred
// until a material asset component defines the reference target.
//
// This schema defines the asset only; it does not attach it to an entity,
// category, or view. When a binding applies the asset, resolve each property
// independently. Stroke properties first use the ViewGraphicOverrides entry,
// then the legacy outline-style group's Color or LineStyle for cut strokes.
// Cut fill first uses CapFillStyle. For each property still unset, use the
// style from ViewFilterRules, then the model graphic style, source
// Color/LineStyle, the applicable view defaults (ViewStyle for cut, ModelEdges
// for projection strokes), and application defaults, in that order.
// Annotations skip both view defaults.
// Bindings may select sources by filters; a Color/LineStyle component on a
// source is a fallback, not by itself an explicit override. An authored override
// must be represented in the higher-priority override layer to win over a bound
// graphic style. GraphicStyleBindings stores model bindings; override storage
// is separate.
// Before enabling filter-based bindings on existing models, binding writers
// must preserve user-authored entity styling in the higher-priority override
// resolution, so a new matching filter does not replace that styling.
// All style references reached from this asset, including those in inline line
// properties, use PinnedStyleAssetReference's pinned resolution policy.
message GraphicStyleAsset {
  option (motif.extension.v1.message).component = 219;

  // Earlier drafts used field 4 for fill and field 5 for a material reference.
  reserved 4, 5;
  reserved "fill", "material";

  // The lowest reader version that understands every field used by this style,
  // including nested inline properties. Writers must raise this to the version
  // that introduced any newly used field or variant, even in a nested message.
  // A reader below this version renders the properties it understands read-only
  // and must not write this component back: rewriting could discard unknown
  // properties. Unset (0) covers the initial cut/projection geometry styles,
  // fill colors and opacity, and named or inline line properties.
  // This guard covers embedded values only. Separately referenced assets are
  // independent components and need their own guards when their schemas evolve.
  uint32 min_reader_version = 1;

  // Cut-plane linework and fill. Unset leaves both unset so they inherit.
  GeometryStyle cut = 2;

  // Projection linework and surface fill, including room plan fill.
  // Annotations use the line properties and skip ViewStyle and ModelEdges
  // defaults. Unset leaves each property unset.
  GeometryStyle projection = 3;
}

// An ordered filter-to-style binding on a model. Not a component by itself.
message GraphicStyleBinding {
  // The lowest reader version that understands every field in this binding.
  // Writers raise it when using a field or variant introduced by a later
  // version. A reader below it must not apply the binding or rewrite its list.
  // Version 0 covers the fields defined here.
  uint32 min_reader_version = 1;

  // A SavedFilter entity in the model containing this binding list. The
  // reference follows edits to that filter and does not name a live selection.
  motif.extension.v1.EntityReference filter = 2 [(buf.validate.field).required = true];

  // One GraphicStyleAsset. An external style is pinned to its model version;
  // an unset model means the model containing this binding list.
  PinnedStyleAssetReference style = 3 [(buf.validate.field).required = true];
}

// The model's ordered graphic-style bindings, stored on its model entity.
// The first matching filter selects one style; later bindings do not fill gaps
// in that style. Each unset property falls through to the next resolution layer.
// Replacing the list is one edit. This component does not store view overrides
// or change visibility rules.
message GraphicStyleBindings {
  option (motif.extension.v1.message).component = 238;

  // The lowest reader version that understands every field in this component.
  // Writers raise it when using a field introduced by a later version. Readers
  // below it must not apply or rewrite the list. Version 0 covers this schema.
  uint32 min_reader_version = 1;

  // Lowest index has highest priority. An unreadable binding makes the list
  // unavailable rather than allowing a later binding to win incorrectly.
  repeated GraphicStyleBinding bindings = 2;
}

// Font identity that survives reload (family name, not an unstable runtime
// font-database id). A plain embedded message, not a standalone component.
message Font {
  // Font family name, e.g. "Roboto".
  string family = 1;
  // star font style bits: BOLD = 0x1, ITALIC = 0x2. Unknown bits are ignored.
  uint32 style_flags = 2;
}

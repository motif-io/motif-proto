syntax = "proto3";

package motif.data.style.v1;

import "buf/validate/validate.proto";
import "motif/data/style/v1/style.proto";

// How a printed table looks: a schedule's or a text table's. Lengths are
// paper meters. A plain embedded message, not a standalone component.
message TableStyle {
  // Height of the title text.
  double title_size = 1 [(buf.validate.field).double.gt = 0];

  // Height of the column header text.
  double header_size = 2 [(buf.validate.field).double.gt = 0];

  // Height of the body text.
  double body_size = 3 [(buf.validate.field).double.gt = 0];

  // Horizontal padding between a cell's rule and its text, for a part that
  // sets none of its own.
  double cell_padding_x = 4 [(buf.validate.field).double.gte = 0];

  // Vertical padding above and below a line of text, for a part that sets
  // none of its own.
  double cell_padding_y = 5 [(buf.validate.field).double.gte = 0];

  // Pen index of the grid rules, as `LineStyle.pen_size`, for a part whose
  // rules set none.
  uint32 rule_pen = 6;

  // Whether the header row has a filled background when the header part
  // sets no fill of its own.
  bool header_fill = 7;

  // The title row does not print and takes no room.
  bool hide_title = 8;

  // The column headers, and the column group labels over them, do not print
  // and take no room.
  bool hide_header = 9;

  // The title row.
  TablePartStyle title = 10;

  // The column headers and the column group labels.
  TablePartStyle header = 11;

  // Data rows, group lines, subtotals and the total.
  TablePartStyle body = 12;
}

// How one part of a table reads and draws. Every field is optional: unset
// takes the table's default.
//
// A part's text and rules take their properties from a style asset or
// from properties of their own, as `LineStyleSource` does. A reader that
// cannot resolve a referenced style, or a color style, prints those
// properties at the table's defaults and must not write the style back.
message TablePartStyle {
  // The part's text. Unset is regular text in the table's ink.
  TableTextSource text = 1;

  // Where the text sits in its cell. Unspecified centers the title and puts
  // a header or a body cell where its column aligns.
  TableAlignment alignment = 2 [(buf.validate.field).enum.defined_only = true];

  // The cells' background. Unset fills the header grey when
  // `TableStyle.header_fill` is set, and leaves the title and the body clear.
  FillStyle fill = 3;

  // The part's rules. Unset properties take the table's: its ink,
  // `TableStyle.rule_pen` and a solid line. A rule's width comes from its
  // pen only.
  LineStyleSource rules = 4;

  // The room between the part's rules and its text. Unset uses
  // `TableStyle.cell_padding_x` and `cell_padding_y`.
  TablePadding padding = 5;

  // A shape style the part follows. Must reference an entity carrying
  // `motif.data.annotation.v1.ShapeStyleAsset`. Its fill and its border's
  // color, pen and pattern apply over `fill` and `rules`, which keep the
  // part's own for when it stops following. A reader that cannot resolve it
  // prints the part's own and must not write the reference back.
  PinnedStyleAssetReference shape_style = 6;
}

// The text properties of a table part: from a text style asset, or its own.
// An unset source, including a future variant this reader does not know,
// leaves every text property at the table's default.
message TableTextSource {
  oneof source {
    // Must reference an entity carrying `motif.data.annotation.v1.TextStyleAsset`.
    // Its font, weight, slant and color apply. Its height and justification do
    // not: a table sizes text by part and aligns it by part and column.
    PinnedStyleAssetReference style = 1;

    // Text properties owned by the table.
    TableTextProperties properties = 2;
  }
}

// A table part's own text properties. Every field is optional; unset takes
// the table's default.
message TableTextProperties {
  // Bold weight.
  optional bool bold = 1;

  // Italic slant.
  optional bool italic = 2;

  // Text color: set directly, or taken from a color style asset
  // (`ColorStyleAsset`). Neither set uses the table's ink.
  oneof color_source {
    // A color set directly.
    Color color = 3;
    // A color style asset whose color the text uses.
    PinnedStyleAssetReference color_style = 4;
  }
}

// The room left between a cell's rules and its text, in paper meters.
message TablePadding {
  // To the left and to the right of the text.
  double x = 1 [(buf.validate.field).double.gte = 0];

  // Above and below a line of text.
  double y = 2 [(buf.validate.field).double.gte = 0];
}

// Horizontal alignment of a table's text in its cells.
enum TableAlignment {
  // The default for where the alignment applies.
  TABLE_ALIGNMENT_UNSPECIFIED = 0;
  // Left.
  TABLE_ALIGNMENT_LEFT = 1;
  // Centered.
  TABLE_ALIGNMENT_CENTER = 2;
  // Right.
  TABLE_ALIGNMENT_RIGHT = 3;
}

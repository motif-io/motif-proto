syntax = "proto3";

package motif.data.annotation.v1;

import "buf/validate/validate.proto";
import "motif/data/annotation/v1/annotation.proto";
import "motif/data/style/v1/style.proto";
import "motif/data/style/v1/style_asset_v2.proto";
import "motif/extension/v1/options.proto";

// Second-generation text and text annotation style assets. Parts hold a style
// reference and their own properties side by side; the resolution rule and the
// migration from the first-generation components are stated at the top of
// motif/data/style/v1/style_asset_v2.proto.

// A named, reusable set of text properties: a text style asset. Lives on an
// asset entity (core.v1.Asset + a name) in any library a model can reach.
// Supersedes TextStyleAsset.
//
// Every field is optional; an unset field leaves that property to whatever
// applies beneath this style, so a style may specify any subset of properties.
message TextStyleAssetV2 {
  option (motif.extension.v1.message).component = 257;

  // Font family name, e.g. "Roboto".
  optional string font_family = 1;
  // Legacy weight. If font_weight is unset, false selects regular (400) and
  // true selects bold (700). When font_weight is set, writers also set bold
  // to true at 600 or more and false otherwise for older readers.
  optional bool bold = 2;
  // Italic slant.
  optional bool italic = 3;
  // Printed (paper) glyph height in millimeters, held constant across drawing
  // scales. Where the host has no drawing scale it is read as a model height.
  optional float printed_height_mm = 4 [(buf.validate.field).float = {
    gt: 0
    finite: true
  }];
  // Text color.
  motif.data.style.v1.StyleColorSource color = 5;
  // Horizontal alignment; UNSPECIFIED leaves it unset.
  Justify justify = 6;
  // Font weight on the CSS / OS/2 usWeightClass scale from 1 to 1000.
  // The highest-priority layer supplying font_weight or bold controls the
  // weight. Within that layer, font_weight takes precedence over bold.
  optional uint32 font_weight = 7 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1000
  }];
}

// Text properties for one part of a style: a text style asset, the part's own
// text properties, or both. Nothing set leaves the part unset.
message TextStylePart {
  // A text style asset (TextStyleAssetV2 or TextStyleAsset).
  motif.data.style.v1.StyleAssetReference style = 1;
  // The part's own text properties.
  TextStyleAssetV2 properties = 2;
}

// Arrowhead properties for one part of a style: an arrowhead style asset, the
// part's own arrowhead properties, or both. Nothing set leaves the part unset.
message ArrowheadStylePart {
  // An arrowhead style asset (ArrowheadStyleAsset).
  motif.data.style.v1.StyleAssetReference style = 1;
  // The part's own arrowhead properties.
  ArrowheadStyleAsset properties = 2;
}

// A named, reusable look for a whole text annotation: a text annotation style
// asset. Lives on an asset entity (core.v1.Asset + a name) in any library a
// model can reach. It sets the leader type, padding and tab size, and takes
// its text, shape, arrowhead and leader line each from a style asset of that
// kind, from properties set on this style itself, or both. Supersedes
// TextAnnotationStyleAsset, whose show_shape_fill and show_shape_border are
// now the shape's own show_fill and show_border.
//
// Every field is optional; an unset field leaves that property to whatever
// applies beneath this style.
message TextAnnotationStyleAssetV2 {
  option (motif.extension.v1.message).component = 255;

  // The leaders' shape. UNSPECIFIED leaves it unset.
  TextAnnotationLeaderType leader_type = 1;
  // The gap between the text and the shape's boundary on every side, in
  // millimetres on paper, held constant across view scales.
  optional float padding_mm = 2 [(buf.validate.field).float = {
    gte: 0
    finite: true
  }];
  // The distance between tab stops, in millimetres on paper, held constant
  // across view scales.
  optional float tab_size_mm = 3 [(buf.validate.field).float = {
    gt: 0
    finite: true
  }];
  // The text.
  TextStylePart text = 4;
  // The box's fill and border. The leaders draw with its border's line unless
  // the leader line sets that property.
  motif.data.style.v1.ShapeStylePart shape = 5;
  // The leaders' heads.
  ArrowheadStylePart arrowhead = 6;
  // The leaders' line. Each property it leaves unset is the shape border's.
  motif.data.style.v1.LineStylePart leader_line = 7;
}

// The style assets a placed text annotation draws with. Lives beside
// TextAnnotation on the annotation entity, which carries no reference of its
// own. The annotation takes its whole look from one text annotation style or,
// when it follows none, each of its text, box, leader heads and leader line
// from a style asset of that kind; choosing a whole style replaces any
// per-part choice.
//
// Resolution follows the rule stated at the top of
// motif/data/style/v1/style_asset_v2.proto, with the annotation's own
// properties (TextAnnotation, TextBlockV2 and the entity's Color and
// LineStyle) as the layer beneath: a property the referenced style sets,
// itself or through the styles it references in turn, comes from that style,
// and every other property is the annotation's own. Own values shadowed this
// way are retained, not cleared, and apply again once the style unsets the
// property or the reference stops resolving. A reference that does not
// resolve sets nothing. References follow the latest library version, as
// StyleAssetReference does; a color style a referenced style pins stays
// pinned.
//
// Nothing set draws the annotation with its own properties; a writer removes
// the component instead.
message TextAnnotationStyleSource {
  option (motif.extension.v1.message).component = 264;

  oneof source {
    // One text annotation style (TextAnnotationStyleAssetV2 or
    // TextAnnotationStyleAsset) governing the whole annotation.
    motif.data.style.v1.StyleAssetReference style = 1;
    // A style per part, for an annotation that follows no whole style.
    TextAnnotationStyleParts parts = 2;
  }
}

// One style asset per part of a text annotation's look. Each is optional; an
// unset part leaves that part to the annotation's own properties.
message TextAnnotationStyleParts {
  // The text (TextStyleAssetV2 or TextStyleAsset).
  motif.data.style.v1.StyleAssetReference text = 1;
  // The box's fill and border (ShapeStyleAssetV2 or ShapeStyleAsset). The
  // leaders draw with its border's line unless the leader line sets that
  // property.
  motif.data.style.v1.StyleAssetReference shape = 2;
  // The leaders' heads (ArrowheadStyleAsset).
  motif.data.style.v1.StyleAssetReference arrowhead = 3;
  // The leaders' line (LineStyleAssetV2 or LineStyleAsset). Each property it
  // leaves unset is the shape border's.
  motif.data.style.v1.StyleAssetReference leader_line = 4;
  // The box border's line (LineStyleAssetV2 or LineStyleAsset). It applies only
  // while the shape style's border sets no line property, itself or through
  // the line style it references; the leaders then draw with it as they do
  // with any border.
  motif.data.style.v1.StyleAssetReference border_line = 5;
}

syntax = "proto3";

// Annotation components: text and other annotations placed in views.
package motif.data.annotation.v1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "motif/data/geometry/v1/geometry.proto";
import "motif/data/model/v1/model.proto";
import "motif/data/style/v1/style.proto";
import "motif/extension/v1/options.proto";
import "motif/extension/v1/reference.proto";

// Authored content bounds for a text annotation.
message TextAnnotation {
  option (motif.extension.v1.message).component = 114;

  // Deprecated. Do not use. Use placement instead.
  motif.data.geometry.v1.Point2 origin = 1 [deprecated = true];
  // Deprecated. Do not use. Use placement instead.
  motif.data.geometry.v1.Size2 size = 2 [deprecated = true];

  // Position, size, and rotation
  motif.data.geometry.v1.Box2d placement = 3;

  // Text inset from every box edge, meters. 0 (the proto3 scalar default)
  // means no padding, matching the runtime default.
  float padding = 4;
  // Background fill behind the text, out to the border. Unset means no fill
  // (the box background stays transparent).
  motif.data.style.v1.Color fill = 5;
  // Keep the text upright: lay it out at a half-turn whenever
  // `placement.rotation` would make it read right-to-left, so the note stays
  // readable from the bottom or the right of the sheet. The box, its fill, and
  // its border are unaffected — a rectangle half-turned about its own centre is
  // the same rectangle.
  //
  // false (the proto3 scalar default) is the legacy behaviour, where the text
  // turns with the box and reads upside-down past vertical. An old reader
  // ignores this field and keeps drawing that way.
  bool keep_text_upright = 6;
  // Leaders use absolute workplane coordinates (meters), independent of box
  // translation/rotation. Empty on annotations authored before leader support.
  // IDs must be unique across every leader and endpoint in this annotation.
  repeated AnnotationLeader leaders = 7;
  // Line styling shared by every leader on this annotation (one style per
  // note, not per leader), independent of the box border, which is styled
  // through the entity's own style components. Unset reads as the application
  // default: pen 1, continuous stroke, black.
  AnnotationLeaderStyle leader_style = 8;
}

// One shoulder from the annotation to an elbow, branching to one or more heads.
message AnnotationLeader {
  enum Anchor {
    ANCHOR_UNSPECIFIED = 0;
    ANCHOR_TOP = 1;
    ANCHOR_MIDDLE = 2;
    ANCHOR_BOTTOM = 3;
  }
  enum Side {
    SIDE_UNSPECIFIED = 0;
    SIDE_LEFT = 1;
    SIDE_RIGHT = 2;
  }
  // Stable identity for selection and targeted edits. Regenerate on copy.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Unspecified is read as middle.
  Anchor anchor = 2;
  // Previous attachment side, retained while elbow is on the box center line.
  // Unspecified is read as right.
  Side side = 3;
  motif.data.geometry.v1.Point2 elbow = 4 [(buf.validate.field).required = true];
  // Removing the last endpoint removes the leader in the same operation.
  repeated AnnotationLeaderEndpoint endpoints = 5 [(buf.validate.field).repeated.min_items = 1];
}

message AnnotationLeaderEndpoint {
  string id = 1 [(buf.validate.field).string.uuid = true];
  motif.data.geometry.v1.Point2 position = 2 [(buf.validate.field).required = true];
}

// Stroke styling for an annotation's leaders.
message AnnotationLeaderStyle {
  // Unset reads as the application default (black).
  motif.data.style.v1.Color color = 1;
  // Pen index travels in `pen_size` (unset or 0 reads as pen 1) and the catalog
  // pattern in `pattern_ref` (unset or "Solid" is a continuous stroke). `width`
  // is written as 0 and ignored: leaders are pen-sized lines.
  motif.data.style.v1.LineStyle line = 2;
  // The head shape. UNSPECIFIED reads as ARROW_CLOSED.
  ArrowheadType arrowhead_type = 3;
  // The head's printed size in metres, measured to the stroke centreline.
  // Unset reads as the model's unit default (2.5 mm metric, 3/32 in imperial).
  optional float arrowhead_size = 4;
  // The included tip angle of the two arrow shapes in radians, 0 < angle <= pi/2.
  // Unset reads as 30 degrees. The other shapes keep it unused.
  optional float arrowhead_angle_rad = 5;
}

// The shape a text annotation's leaders end in.
enum ArrowheadType {
  ARROWHEAD_TYPE_UNSPECIFIED = 0;
  // A filled triangle with its point on the end point.
  ARROWHEAD_TYPE_ARROW_CLOSED = 1;
  // The two sides of that triangle, unfilled.
  ARROWHEAD_TYPE_ARROW_OPEN = 2;
  // A filled dot centred on the end point.
  ARROWHEAD_TYPE_FILLED_CIRCLE = 3;
  // A tick across the end point, 45 degrees clockwise of the line.
  ARROWHEAD_TYPE_DIAGONAL = 4;
}

// A persisted dimension annotation.
//
// Only the source grain persists: definition anchors and the placement rule
// (style reference and per-view presence are reserved extensions). Lifecycle is
// not persisted — existing in persisted data IS the permanent lifecycle; the
// loader stamps it and the commit path guarantees it. Derived geometry
// (resolved points, part meshes, labels) is regenerated client-side and never
// enters changesets.
message Dimension {
  option (motif.extension.v1.message).component = 120;

  // Which curve of the referenced entity a feature anchor evaluates: the
  // entity's own Curve2, an authored boundary segment, or a wall's symbolic
  // thickness-aware derived curves
  // (the baseline behind its Requires link, or a face offset by half the
  // footprint width — re-derived at every resolve, so a thickness edit moves
  // the face and the dimension follows). Face sides are named in the baseline
  // curve's plane: LEFT is +90° (counterclockwise) from the curve direction.
  enum CurveRef {
    // Unspecified curve reference.
    CURVE_REF_UNSPECIFIED = 0;
    // The referenced entity's own Curve2.
    CURVE_REF_OWN = 1;
    // The wall's baseline curve.
    CURVE_REF_WALL_BASELINE = 2;
    // The wall face left of the baseline curve direction.
    CURVE_REF_WALL_FACE_LEFT = 3;
    // The wall face right of the baseline curve direction.
    CURVE_REF_WALL_FACE_RIGHT = 4;
    // A segment of the entity's authored boundary in stored curve order.
    CURVE_REF_BOUNDARY_SEGMENT = 5;
  }

  // Where along the referenced curve the definition point sits. NEAREST is a
  // datum: no stored station — the point is the perpendicular foot of the
  // opposing anchor's resolved point, re-derived at every resolve.
  enum CurveStation {
    // Unspecified curve station.
    CURVE_STATION_UNSPECIFIED = 0;
    // The start of the curve.
    CURVE_STATION_START = 1;
    // The end of the curve.
    CURVE_STATION_END = 2;
    // The midpoint of the curve.
    CURVE_STATION_MID = 3;
    // A specific curve parameter, stored in `param`.
    CURVE_STATION_PARAM = 4;
    // The perpendicular foot of the opposing anchor's resolved point.
    CURVE_STATION_NEAREST = 5;
  }

  // Which direction a linear dimension measures in, and therefore the
  // direction its dimension line runs. Stored intent, not derived: an ALIGNED
  // dimension re-derives its direction from its own definition points every
  // resolve (so it follows a host that rotates), while a PLANE_X / PLANE_Y
  // dimension holds that axis and measures only the component of the span
  // along it. Axes are named in the dimension plane captured by PlaneBasis,
  // not in world space, so a projected dimension keeps its orientation
  // relative to the drawing when the plane rotates.
  //
  // UNSPECIFIED means ALIGNED: every record written before this field existed
  // is aligned, and an old writer that omits it must not change meaning.
  enum MeasurementDirection {
    // Unspecified direction; read as MEASUREMENT_DIRECTION_ALIGNED.
    MEASUREMENT_DIRECTION_UNSPECIFIED = 0;
    // Measure the true distance between the definition points; the dimension
    // line runs parallel to the span.
    MEASUREMENT_DIRECTION_ALIGNED = 1;
    // Measure the span's component along the dimension plane's X axis.
    MEASUREMENT_DIRECTION_PLANE_X = 2;
    // Measure the span's component along the dimension plane's Y axis.
    MEASUREMENT_DIRECTION_PLANE_Y = 3;
  }

  // A zero-based position in an entity's authored boundary. All indices follow
  // stored region, interior-loop, and curve order. This is not topological
  // identity: reordering or replacing the boundary can change its meaning.
  // Out-of-range indices are unresolved; consumers must not clamp to another segment.
  message BoundarySegmentIndex {
    // Region in MultiClosedRegion2D.regions. A lone ClosedRegion2D or legacy
    // Curve2List has one region at index 0.
    uint32 region_index = 1;
    // The exterior loop or one of the region's interior loops.
    oneof loop {
      option (buf.validate.oneof).required = true;
      // The region's exterior loop.
      google.protobuf.Empty exterior = 2;
      // Interior loop in ClosedRegion2D.interiors.
      uint32 interior_index = 3;
    }
    // Curve in the selected loop's Curve2List.curves.
    uint32 segment_index = 4;
  }

  // A boundary-segment target. The wrapper reserves room for future reference
  // forms without changing how an EntityFeature carries its boundary target.
  message BoundarySegmentReference {
    oneof target {
      option (buf.validate.oneof).required = true;
      // A positional reference in stored boundary order.
      BoundarySegmentIndex by_index = 1;
    }
  }

  // A structured feature reference on a synced entity. References a curve or
  // a stored boundary position, not a mesh buffer.
  message EntityFeature {
    option (buf.validate.message).cel = {
      id: "boundary_segment_matches_curve"
      message: "boundary_segment must be set exactly when curve is BOUNDARY_SEGMENT"
      // CURVE_REF_BOUNDARY_SEGMENT = 5. Use its value for CEL runtime compatibility.
      expression: "(this.curve == 5) == has(this.boundary_segment)"
    };

    // The referenced entity. Commit asserts the target is persisted. Required.
    motif.extension.v1.EntityReference entity = 1 [(buf.validate.field).required = true];
    // Which curve of the referenced entity the anchor evaluates.
    CurveRef curve = 2;
    // Where along the referenced curve the definition point sits.
    CurveStation station = 3;
    // Curve parameter, meaningful only when station == CURVE_STATION_PARAM.
    double param = 4;
    // Required exactly when curve is CURVE_REF_BOUNDARY_SEGMENT.
    BoundarySegmentReference boundary_segment = 5;
  }

  // A reference to one of an entity's ReferenceGeometry datums — a named plane
  // or cylinder published by a parametric asset definition. Resolves to a
  // point only in the presence of an opposing anchor: the point is the
  // perpendicular foot of the opposing anchor's resolved point on the datum,
  // the same rule CURVE_STATION_NEAREST uses. Two datum anchors facing each
  // other resolve against each other.
  message EntityDatum {
    // The referenced entity. This must be the *instance* carrying the resolved
    // ReferenceGeometry, never the asset it was materialized from: datum
    // primitives are stored in the owner-local frame and the instance's
    // transform is what lifts them to world space. Commit asserts the target
    // is persisted. Required.
    motif.extension.v1.EntityReference entity = 1 [(buf.validate.field).required = true];
    // The ReferenceGeometryEntry id within that entity's ReferenceGeometry.
    // Owner-local — authored per asset definition, not globally unique — so it
    // is only meaningful together with `entity`.
    //
    // Durable by contract: the id is chosen by the author of the
    // ReferenceGeometrySpec precisely to carry long-lived references like this
    // one, and an author is expected never to reassign the id of an existing
    // entry.
    uint32 reference_id = 2 [(buf.validate.field).uint32.gt = 0];
  }

  // What a definition point is measured against.
  message Anchor {
    // The anchor target.
    oneof anchor {
      // A free point in world space.
      motif.data.geometry.v1.Point3 free = 1;
      // A feature on a synced entity.
      EntityFeature entity_feature = 2;
      // A ReferenceGeometry datum on a synced entity.
      EntityDatum entity_datum = 3;
    }
  }

  // Linear definition geometry: the witness references being dimensioned, plus
  // the direction they are measured in.
  //
  // A plain dimension has two witnesses. A dimension *string* has more, and its
  // segments are derived rather than stored: sort the witnesses by station along
  // the dimension line and measure each consecutive pair, so every segment
  // reports the distance to its nearest neighbour and no overall span is drawn.
  // Adding a witness between two existing ones therefore splits that segment in
  // two with no edit to anything else, and witnesses may be supplied in any
  // order.
  message LinearGeometry {
    // The first measured point. When `anchors` is set this is a copy of the
    // witness at one end of the run (see `anchors`).
    Anchor a = 1;
    // The second measured point. When `anchors` is set this is a copy of the
    // witness at the other end of the run (see `anchors`).
    Anchor b = 2;
    // The full witness list, in the order the user picked them. Two or more
    // entries when set; empty means the dimension is defined by `a`/`b` alone.
    //
    // Insertion order is what is stored, deliberately: station order is derived
    // at resolve, so `anchors[0]` stays put as witnesses are inserted and the
    // placement offset keeps a fixed reference. `a` and `b` are maintained as
    // the two *station extremes* of this list, recomputed on every write, so a
    // reader that does not understand this field still draws a correct
    // end-to-end dimension instead of failing to load. They are not
    // `anchors[0]` and `anchors[n-1]`.
    repeated Anchor anchors = 3;
    // Which direction this dimension measures in. Unset reads as ALIGNED.
    MeasurementDirection direction = 4;
  }

  // One ray of an angular dimension.
  message Ray {
    // The ray definition.
    oneof ray {
      // Ray from the shared vertex toward this anchor (the vertex anchor is
      // authoritative).
      Anchor to = 1;
      // Ray along a referenced entity's curve ("angle between two walls"):
      // the vertex is DERIVED as the rays' intersection, so it tracks the
      // referenced entities; the stored vertex is ignored. Reserved for the
      // entity-referenced angular consumer — loaders reject it until then.
      EntityFeature edge = 2;
    }
  }

  // Angular definition geometry: a vertex plus two rays. The measured value is
  // the minor angle between the rays.
  message AngularGeometry {
    // The angle vertex.
    Anchor vertex = 1;
    // The first ray.
    Ray a = 2;
    // The second ray.
    Ray b = 3;
  }

  // The captured dimension plane: plane normal plus the signed in-plane offset
  // direction (which side of the measured line the dimension line sits on).
  // World-fixed in v1; the feature-relative frame is a reserved extension.
  message PlaneBasis {
    // The dimension plane normal.
    motif.data.geometry.v1.UnitVector3 normal = 1;
    // The signed in-plane offset direction.
    motif.data.geometry.v1.UnitVector3 offset_direction = 2;
  }

  // Per-dimension placement. Never a world-space point: the placement point is
  // converted to basis + offset at commit and the plane re-derives on load.
  message OwnPlacement {
    // Label side in the captured dimension plane, independent of view rotation
    // and the text's readable orientation.
    enum TextSide {
      // Preserve the application's automatic, readable-side placement.
      TEXT_SIDE_UNSPECIFIED = 0;
      // Linear: along `basis.offset_direction`. Angular: radially outward
      // from the vertex.
      TEXT_SIDE_POSITIVE = 1;
      // Linear: against `basis.offset_direction`. Angular: radially inward
      // toward the vertex.
      TEXT_SIDE_NEGATIVE = 2;
    }

    // The captured dimension plane.
    PlaneBasis basis = 1;
    // Signed offset h from the measured line to the dimension line, meters.
    // For ANGULAR dimensions this is the arc radius: 0 = auto radius (derived
    // client-side; all v1 records), nonzero = an explicit user-set radius.
    double offset = 2;
    // Reserved label slide along the dimension line, meters. 0 until used.
    // Applies to the whole dimension; for a multi-segment run see
    // `text_slides`.
    double text_slide = 3;
    // Per-segment label slide along the dimension line, meters, index-aligned
    // with the derived segments of a dimension string (segment i measures
    // witness i to witness i+1 in station order). Empty means every label sits
    // at its segment midpoint offset by `text_slide`; when non-empty it
    // supersedes `text_slide` for the segments it covers, and any segment past
    // its end falls back to `text_slide`.
    //
    // Reserved alongside `text_slide` and 0 until used. Crowded strings are the
    // motivating case: a run of short segments cannot place every label at its
    // own midpoint without collisions, and sliding is per-label by nature.
    repeated double text_slides = 4;
    // Label side for every segment. Explicit sides use
    // `DimensionStyle.text_offset` as the clearance magnitude, without moving
    // the dimension line or witnesses. Unset (0) preserves automatic placement
    // for existing records.
    TextSide text_side = 5;
  }

  // The definition geometry.
  oneof kind {
    // Linear-aligned dimension.
    LinearGeometry linear = 1;
    // Angular dimension.
    AngularGeometry angular = 2;
  }

  // How the dimension line is placed.
  oneof placement {
    // Placement owned by this dimension alone. This covers a multi-witness run
    // too: the witnesses of one dimension share that dimension's single
    // placement, which is what puts every derived segment on one line by
    // construction rather than by keeping separate placements agreeing.
    OwnPlacement own = 3;
    // 4 unallocated. Previously earmarked for a `shared` arm referencing a
    // separate chain record, on the assumption a run would be many
    // two-witness dimensions. `LinearGeometry.anchors` makes a run one
    // dimension instead, so no chain record is needed; a run's members cannot
    // drift apart because there is nothing to keep in sync.
  }

  // This dimension's own look. Sparse throughout: an unset field inherits the
  // application default, and an absent message means the dimension draws at
  // the application default entirely.
  //
  // Inline rather than a component of its own, so that style and geometry
  // cannot end up on separate entities and a delete cannot strand one without
  // the other. The cost is that a commit serializes the whole component, so a
  // restyle and a placement edit made concurrently on the same dimension are
  // last-writer-wins rather than merging.
  DimensionStyle style = 5;

  // Field-number allocation (kind/placement oneofs and top-level fields share
  // this message's number space): 1-2 kind arms; 3-4 placement arms (4
  // unallocated, see the oneof); 5 = style; future kind arms (radial) and other
  // extensions take 6+.
  //
  // A projected linear dimension does not take a kind arm of its own: aligned
  // and axis-projected differ only in which direction is measured, which is
  // `LinearGeometry.direction`. One kind, one resolver, one set of parts.
}

// A dimension's look: label text, the linework, the sizes that position the
// parts, and the units the value is displayed in.
//
// Every field is sparse: an unset field inherits the application default
// rather than meaning "zero". That is why the scalars are `optional` instead
// of using 0 as a sentinel — 0 is a legitimate authored value for every offset
// and extension here, and has to stay distinguishable from "inherit".
//
// Sizes are millimeters measured on the printed page, so a dimension holds its
// printed size across view scales.
//
// The text and line properties are grouped rather than flattened because the
// intended end state is a composed style, where each group is either given
// inline (as here) or referenced as a shared style asset. Grouping now is what
// makes that additive later: a single field can be moved into a `oneof`
// alongside a reference without breaking the wire format, as long as only one
// arm is ever set. A reference to a whole dimension style is field 10, and
// arrives as a plain field with documented precedence for the same reason.
message DimensionStyle {
  // Label text style.
  message Text {
    // Text color.
    motif.data.style.v1.Color color = 1;
    // Em size, millimeters on paper — the ordinary meaning of a "12 pt" text
    // size, not the cap height.
    optional float size = 2;
    // 3 reserved: font (motif.data.style.v1.Font), once more than one family
    // is available to choose from.
    // 4 reserved: width factor (horizontal glyph scale), once the text stack
    // can render one.
  }

  // Style of the dimension line, the extension lines, and the terminators,
  // which are drawn as one stroke and so share one look.
  message Line {
    // Line color.
    motif.data.style.v1.Color color = 1;
    // Stroke weight. A pen size of 0 means the renderer draws a
    // screen-constant hairline.
    motif.data.style.v1.LineStyle weight = 2;
    // 3 reserved: dash pattern, once the renderer honors one on this stroke.
  }

  // Label text.
  Text text = 1;
  // Linework.
  Line line = 2;
  // 3 reserved: terminator style (tick vs arrow, and its size), grouped like
  // Text and Line so that it too can gain a shared-style reference.

  // Gap between the dimension line and the label.
  optional float text_offset = 4;
  // Gap between the measured geometry and the start of an extension line
  // (a.k.a. witness line).
  optional float extension_line_offset = 5;
  // How far an extension line continues past the dimension line.
  optional float extension_line_extension = 6;
  // How far the dimension line continues past the extension lines. Linear
  // dimensions only — an angular dimension's arc has no such overrun, while
  // the offsets above apply to both.
  optional float dimension_line_extension = 7;

  // Length unit, notation, and precision for a linear dimension's value.
  // Unset inherits the model's unit settings.
  motif.data.model.v1.LengthUnitGroup length_units = 8;
  // Angle unit, notation, and precision for an angular dimension's value.
  // Unset inherits the model's unit settings.
  motif.data.model.v1.AngleUnitGroup angle_units = 9;

  // 10 reserved: a reference to a shared dimension style asset. When it
  // arrives it takes precedence over every field above, per the composed-style
  // model where referencing a dimension style takes the whole style from it.
}

// Rich-text content + styling for a text annotation. Box geometry stays in
// TextAnnotation (114). Spans are an inline repeated run; ordering is array
// order. Unset span fields inherit the block defaults.
message TextBlock {
  option (motif.extension.v1.message).component = 125;

  // Block default font, size (em), and color; spans inherit unset fields.
  TextStyle default_style = 1;
  TextLayout layout = 2;
  repeated TextSpan spans = 3;
  // Per-paragraph list styling, one entry per "\n"-delimited paragraph of
  // the concatenated span text, in paragraph order. Empty (including every
  // pre-list writer) means no paragraph is a list item; a vector shorter
  // than the paragraph count leaves trailing paragraphs unlisted; extra
  // entries are ignored. Numbered ordinals are never persisted — they
  // derive from paragraph position at render time, where a SPACER entry is a
  // blank line inside the list (numbering continues across it) and a NONE
  // entry between two list paragraphs starts a new list.
  repeated ListKind paragraph_lists = 4;
}

// A run of uniformly-styled text. Message-typed fields carry presence in
// proto3; the scalar `size` field uses 0 to mean "unset" instead.
message TextSpan {
  // "\n" encodes hard line breaks (matches the runtime text model).
  string text = 1;
  // Unset — or unset inner fields — inherit the TextBlock defaults.
  TextStyle style = 2;
}

message TextStyle {
  // On a span, unset => inherit the block default. As a block default, unset
  // means "use the application default font".
  motif.data.style.v1.Font font = 1;
  // Em multiplier; 0 (the proto3 scalar default) decodes to the context
  // default: 1.0 as a block default, "inherit" on a span.
  float size = 2;
  motif.data.style.v1.Color color = 3;
}

message TextLayout {
  Justify justify = 1;
  LineBreak line_break = 2;
  // Line height multiplier; 0 (the proto3 scalar default) is decoded as 1.2.
  float line_height_factor = 3;
}

enum Justify {
  JUSTIFY_UNSPECIFIED = 0;
  JUSTIFY_LEFT = 1;
  JUSTIFY_CENTER = 2;
  JUSTIFY_RIGHT = 3;
  JUSTIFY_JUSTIFIED = 4;
}

enum LineBreak {
  LINE_BREAK_UNSPECIFIED = 0;
  LINE_BREAK_WORD_BOUNDARY = 1;
  LINE_BREAK_ANY_CHARACTER = 2;
  LINE_BREAK_WORD_OR_CHARACTER = 3;
  LINE_BREAK_NO_WRAP = 4;
}

// Paragraph-level list styling for TextBlock paragraphs. UNSPECIFIED decodes
// the same as NONE (not a list item). Ordinals of the ordered kinds
// (numbered and lettered) are never persisted — they derive from paragraph
// position at render time.
enum ListKind {
  LIST_KIND_UNSPECIFIED = 0;
  LIST_KIND_NONE = 1;
  LIST_KIND_BULLETED = 2;
  LIST_KIND_NUMBERED = 3;
  // Ordered items labeled A., B., ... Z., AA., ...
  LIST_KIND_UPPERCASE_LETTER = 4;
  // Ordered items labeled a., b., ... z., aa., ...
  LIST_KIND_LOWERCASE_LETTER = 5;
  // The blank line an author leaves between two items of the surrounding
  // list (Shift+Enter in the editor): renders as an empty row with no marker
  // and does not count, so numbering continues across it. Any other kind
  // between two items ends the list — a NONE paragraph between two NUMBERED
  // paragraphs starts a second list at 1.
  LIST_KIND_SPACER = 6;
}

// A named, reusable set of text properties: a text style asset. Lives on an
// asset entity (core.v1.Asset + a name) in any library a model can reach.
//
// Every field is optional; an unset field leaves that property to whatever
// applies beneath this style (ultimately the application default), so a style
// may specify any subset of properties.
message TextStyleAsset {
  option (motif.extension.v1.message).component = 189;

  // Font family name, e.g. "Roboto".
  optional string font_family = 1;
  // Bold weight.
  optional bool bold = 2;
  // Italic slant.
  optional bool italic = 3;
  // Printed (paper) glyph height in millimeters, held constant across drawing
  // scales. Where the host has no drawing scale it is read as a model height.
  optional float printed_height_mm = 4 [(buf.validate.field).float = {gt: 0}];
  // Text color: set directly, or taken from a color style asset. Neither set
  // leaves the color unset.
  oneof color_source {
    // A color set directly on this style.
    motif.data.style.v1.Color color = 5;
    // A color style asset (style.v1.ColorStyleAsset) whose color this style
    // uses.
    motif.data.style.v1.StyleAssetReference color_style = 8;
  }
  // Horizontal alignment; UNSPECIFIED leaves it unset.
  Justify justify = 6;

  // Formerly list_kind: lists belong to the text, not its style.
  reserved 7;
  reserved "list_kind";
}

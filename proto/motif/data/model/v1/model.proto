syntax = "proto3";

// Components specific to models and model-related feature sets: workplanes,
// sketches, levels, walls, joins, rooms, and unit settings.
package motif.data.model.v1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "motif/data/geometry/v1/geometry.proto";
import "motif/data/style/v1/style.proto";
import "motif/extension/v1/options.proto";
import "motif/extension/v1/reference.proto";
import "motif/extension/v1/type.proto";

// A marker component identifying a workplane.
message Workplane {
  option (motif.extension.v1.message).component = 6;
}

// The location and orientation of a plane in 3D space.
message CoordinateSystem3 {
  option (motif.extension.v1.message).component = 7;

  // The coordinate system geometry.
  motif.data.geometry.v1.CoordinateSystem3 coordinate_system = 1;
}

// A marker component identifying a sketch.
message Sketch {
  option (motif.extension.v1.message).component = 8;
}

// A marker component identifying a sketch element.
//
// TODO: Consider removing this marker entirely; it may not be necessary.
message SketchElement {
  option (motif.extension.v1.message).component = 9;
}

// 2D curve geometry.
message Curve2 {
  option (motif.extension.v1.message).component = 10;

  // The curve geometry.
  motif.data.geometry.v1.Curve2 curve = 1;
}

// 3D point geometry.
message Point3 {
  option (motif.extension.v1.message).component = 138;

  // The point geometry.
  motif.data.geometry.v1.Point3 point = 1;
}

// A marker component identifying a level.
message Level {
  option (motif.extension.v1.message).component = 13;
}

// An elevation that is always relative to a model's zero.
message RelativeElevation {
  option (motif.extension.v1.message).component = 14;

  // The elevation, relative to the model's zero, in meters.
  double elevation = 1;
}

// The bounding rectangle of a level — center position plus axis spans, all in
// meters.
//
// `center_x` / `center_y` were added after `width` / `depth`; legacy data that
// pre-dates the center fields loads with center = (0, 0), which matches the
// pre-existing assumption that levels were anchored at the world origin.
message LevelExtent {
  option (motif.extension.v1.message).component = 62;

  // East-west span, in meters.
  double width = 1;
  // North-south span, in meters.
  double depth = 2;
  // X coordinate of the level's center, in world meters.
  double center_x = 3;
  // Y coordinate of the level's center, in world meters.
  double center_y = 4;
}

// A marker component identifying a default workplane.
message DefaultWorkplane {
  option (motif.extension.v1.message).component = 18;
}

// Reference to a plane source entity.
message PlanarReference {
  option (motif.extension.v1.message).component = 28;

  // The entity supplying the plane. Required.
  motif.extension.v1.EntityReference target = 1 [(buf.validate.field).required = true];
}

// A system of measurement.
enum UnitSystem {
  // Unspecified unit system.
  UNIT_SYSTEM_UNSPECIFIED = 0;
  // Imperial units.
  UNIT_SYSTEM_IMPERIAL = 1;
  // Metric units.
  UNIT_SYSTEM_METRIC = 2;
}

// How unit values are notated.
enum UnitNotation {
  // Unspecified notation.
  UNIT_NOTATION_UNSPECIFIED = 0;
  // Fractional notation.
  UNIT_NOTATION_FRACTIONAL = 1;
  // Decimal notation.
  UNIT_NOTATION_DECIMAL = 2;
}

// Symbols used in formatted length labels. Applications determine which symbols
// are valid for the selected unit and notation.
enum UnitSymbol {
  // Legacy settings omit optional symbols.
  UNIT_SYMBOL_UNSPECIFIED = 0;
  // Omit optional unit symbols.
  UNIT_SYMBOL_NONE = 1;
  // Millimeter symbol: mm.
  UNIT_SYMBOL_MM = 2;
  // Centimeter symbol: cm.
  UNIT_SYMBOL_CM = 3;
  // Decimeter symbol: dm.
  UNIT_SYMBOL_DM = 4;
  // Meter symbol: m.
  UNIT_SYMBOL_M = 5;
  // Decameter symbol: dam.
  UNIT_SYMBOL_DAM = 6;
  // Hectometer symbol: hm.
  UNIT_SYMBOL_HM = 7;
  // Kilometer symbol: km.
  UNIT_SYMBOL_KM = 8;
  // Foot symbol: '.
  UNIT_SYMBOL_FOOT_SINGLE_QUOTE = 9;
  // Foot abbreviation: ft.
  UNIT_SYMBOL_FT = 10;
  // Linear foot abbreviation: LF.
  UNIT_SYMBOL_LF = 11;
  // Inch symbol: ".
  UNIT_SYMBOL_INCH_DOUBLE_QUOTE = 12;
  // Inch abbreviation: in.
  UNIT_SYMBOL_IN = 13;
  // Yard abbreviation: yd.
  UNIT_SYMBOL_YD = 14;
  // Furlong abbreviation: fur.
  UNIT_SYMBOL_FUR = 15;
  // Mile abbreviation: mi.
  UNIT_SYMBOL_MI = 16;
}

// A unit of length.
enum LengthUnit {
  // Unspecified length unit.
  LENGTH_UNIT_UNSPECIFIED = 0;
  // Millimeters.
  LENGTH_UNIT_MILLIMETER = 1;
  // Centimeters.
  LENGTH_UNIT_CENTIMETER = 2;
  // Meters.
  LENGTH_UNIT_METER = 3;
  // Kilometers.
  LENGTH_UNIT_KILOMETER = 4;
  // Inches.
  LENGTH_UNIT_INCH = 5;
  // Feet.
  LENGTH_UNIT_FOOT = 6;
  // Yards.
  LENGTH_UNIT_YARD = 7;
  // Miles.
  LENGTH_UNIT_MILE = 8;
}

// A unit of area.
enum AreaUnit {
  // Unspecified area unit.
  AREA_UNIT_UNSPECIFIED = 0;
  // Square millimeters.
  AREA_UNIT_SQUARE_MILLIMETER = 1;
  // Square centimeters.
  AREA_UNIT_SQUARE_CENTIMETER = 2;
  // Square meters.
  AREA_UNIT_SQUARE_METER = 3;
  // Square kilometers.
  AREA_UNIT_SQUARE_KILOMETER = 4;
  // Square inches.
  AREA_UNIT_SQUARE_INCH = 5;
  // Square feet.
  AREA_UNIT_SQUARE_FOOT = 6;
  // Square yards.
  AREA_UNIT_SQUARE_YARD = 7;
  // Square miles.
  AREA_UNIT_SQUARE_MILE = 8;
}

// A unit of angle.
enum AngleUnit {
  // Unspecified angle unit.
  ANGLE_UNIT_UNSPECIFIED = 0;
  // Radians.
  ANGLE_UNIT_RADIAN = 1;
  // Degrees.
  ANGLE_UNIT_DEGREE = 2;
}

// Length unit, notation, and display precision.
message LengthUnitGroup {
  // The length unit.
  LengthUnit unit = 1;
  // The notation used to display values.
  UnitNotation notation = 2;
  // The number of fractional digits or denominator precision used for display.
  uint32 precision = 3;
}

// Area unit, notation, and display precision.
message AreaUnitGroup {
  // The area unit.
  AreaUnit unit = 1;
  // The notation used to display values.
  UnitNotation notation = 2;
  // The number of fractional digits or denominator precision used for display.
  uint32 precision = 3;
}

// Angle unit, notation, and display precision.
message AngleUnitGroup {
  // The angle unit.
  AngleUnit unit = 1;
  // The notation used to display values.
  UnitNotation notation = 2;
  // The number of fractional digits used for display.
  uint32 precision = 3;
}

// The unit settings for a model: the overall system plus per-quantity display
// configuration.
message ModelUnitSettings {
  option (motif.extension.v1.message).component = 73;

  // The overall unit system.
  UnitSystem unit_system = 1;
  // Length display settings.
  LengthUnitGroup length = 2;
  // Area display settings.
  AreaUnitGroup area = 3;
  // Angle display settings.
  AngleUnitGroup angle = 4;
  // Selected length symbol. Applications validate it against the effective unit
  // and notation when displaying labels.
  UnitSymbol unit_symbol = 5;
}

// Wall-asset compose behavior. Reads the 6 declared sub-parameters (workplane,
// base/top elevations, base/top offsets, attachment mode) from the asset's
// `ResolvedParameters` via `DataReference` + `FieldPath`; writes the composed
// `(coordinate_system, height)` pair into the per-instance
// `ResolvedWallSweepInputs` component for `SweepWidthHeightAlongCurveBehavior`
// to consume.
//
// Decouples wall-specific composition from the general sweep primitive.
message ComposeParametricWallSweepInputsBehavior {
  option (motif.extension.v1.message).component = 115;

  // The wall's workplane frame.
  motif.extension.v1.DataReference workplane = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.CoordinateSystem3"
    }
  ];

  // The elevation of the wall's base level.
  motif.extension.v1.DataReference base_level_elev = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];

  // The wall's base offset from the base level.
  motif.extension.v1.DataReference base_offset = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];

  // The elevation of the wall's top level.
  motif.extension.v1.DataReference top_level_elev = 4 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];

  // The wall's top offset from the top level.
  motif.extension.v1.DataReference top_offset = 5 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];

  // The wall's top attachment mode (e.g. `levelAbove` or `unattachedUp`).
  motif.extension.v1.DataReference top_attachment_mode = 6 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_STRING}
  ];

  // The entity the composed `ResolvedWallSweepInputs` is written to.
  motif.extension.v1.DataReference output = 7 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.ResolvedWallSweepInputs"
    }
  ];
}

// Per-instance output of `ComposeParametricWallSweepInputsBehavior`: the composed
// `(coordinate_system, height)` pair that `SweepWidthHeightAlongCurveBehavior`
// reads in the `DataReference` + decomposition shape.
//
// Sites wall-specific composition outside the general sweep primitive. Sweep
// wiring targets the two fields of this component via per-field `DataReference`
// from `coordinate_system` and `height` paths.
message ResolvedWallSweepInputs {
  option (motif.extension.v1.message).component = 116;

  // Composed placement frame for the sweep. Composed as `workplane` with
  // `origin.z` overridden to `base_level_elev + base_offset`.
  motif.data.geometry.v1.CoordinateSystem3 coordinate_system = 1;

  // Composed sweep distance in meters.
  // - In `levelAbove` mode:
  //   `top_level_elev - base_level_elev - base_offset + top_offset`.
  // - In `unattachedUp` mode: `top_offset`.
  double height = 2;
}

// A component which defines a set of exposed parameters.
//
// Generally added to parametric asset entities whose children wire the values
// into behaviors.
message ParameterDeclarations {
  option (motif.extension.v1.message).component = 89;

  // The declared parameters, keyed by parameter name.
  map<string, ParameterDeclaration> declarations = 1;
}

// The definition of a single parameter.
//
// `expected_type` is the declared payload type the corresponding
// `ResolvedParameters` entry must carry. Behaviors that consume the resolved
// value declare a `data_reference_expected_type` matching the same `TypeSpec`.
message ParameterDeclaration {
  // Defaults selected according to the consuming model's configured length
  // unit. Values are stored in canonical units.
  message PerLengthUnitDefaults {
    google.protobuf.Any millimeter = 1;
    google.protobuf.Any centimeter = 2;
    google.protobuf.Any meter = 3;
    google.protobuf.Any kilometer = 4;
    google.protobuf.Any inch = 5;
    google.protobuf.Any foot = 6;
    google.protobuf.Any yard = 7;
    google.protobuf.Any mile = 8;
  }

  // The parameter name.
  string name = 1;
  // A human-readable description of the parameter.
  string description = 2;
  // The declared payload type for this parameter.
  motif.extension.v1.TypeSpec expected_type = 3;

  // The parameter's default. For unit-bearing values, TYPE_DOUBLE uses the base
  // unit of the quantity (e.g. meters for length or radians for angles).
  // Evaluation uses the literal or live-source default when no explicit binding
  // exists. Removing an explicit binding resumes use of the current default.
  oneof default_type {
    // One default applied regardless of the model's configured length unit.
    google.protobuf.Any default_value = 4;

    // Defaults selected at placement using the consuming model's length unit.
    // These defaults do not support inheritance.
    PerLengthUnitDefaults per_length_unit_defaults = 6;

    // A live source in the declaration's evaluation context. References are
    // remapped for instances. An unresolved source is an incomplete evaluation.
    motif.extension.v1.DataReference default_source = 7 [(motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "google.protobuf.Any"
    }];
  }

  // The closed, ordered set of permitted values for a TYPE_STRING parameter.
  // Empty when the parameter has no fixed choice set.
  repeated ParameterChoice choices = 5;

  // Whether this parameter feeds regeneration. Unset means driving, so a
  // declaration written before this field carries the same meaning it had
  // previously.
  ParameterMode mode = 8;
}

// One option in a TYPE_STRING parameter's closed choice set.
message ParameterChoice {
  // The canonical stored value. Non-empty: an unset TYPE_STRING parameter resolves to
  // the empty string, so an empty choice value would be indistinguishable from "nothing
  // selected" and would match `ParametricSelect.cases[""]`.
  string value = 1 [(buf.validate.field).string.min_len = 1];
  // The human-readable label for this value.
  string label = 2;
}

// Whether a declared parameter feeds the regeneration of the asset that declares
// it.
//
// Driving parameters materially affect the output of the regenerated asset - when
// the value changes the output must be regenerated. Passthrough parameters do not.
enum ParameterMode {
  // No mode recorded. Treated as PARAMETER_MODE_DRIVING, which is how every
  // declaration behaved before this field existed.
  PARAMETER_MODE_UNSPECIFIED = 0;

  // The parameter feeds regeneration and its value materially affects the
  // regenerated output
  PARAMETER_MODE_DRIVING = 1;

  // The parameter does not feed regeneration.
  PARAMETER_MODE_PASSTHROUGH = 2;
}

// The map of resolved parameters.
//
// Generally constructed by a `ParameterBindingsBehavior` as part of
// regeneration. Each entry's `Any` payload type is constrained by the
// corresponding `ParameterDeclaration.expected_type`.
message ResolvedParameters {
  option (motif.extension.v1.message).component = 90;

  // The resolved parameter values, keyed by parameter name.
  map<string, google.protobuf.Any> values = 1;
}

// A scalar expression node over f64 values.
//
// A value can come from three leaf forms:
//
//   * `literal` contains the number directly.
//   * `parameter` names a parameter in the consumer's evaluation scope.
//   * `binding` reads a specifically addressed `TYPE_DOUBLE` value through a
//     `DataReference`.
//
// All consumers accept `literal`.
// Change-propagation parameter bindings accept `binding` but reject `parameter`.
// Built-in asset geometry configurations accept `parameter` but reject `binding`.
// Reference geometry specifications accept both `parameter` and `binding`.
message ParametricExpression {
  // The expression node.
  oneof node {
    // A literal f64 value.
    double literal = 1;

    // A `DataReference` to a specifically addressed `TYPE_DOUBLE` value.
    motif.extension.v1.DataReference binding = 2 [(motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}];

    // A binary operation over two sub-expressions.
    ParametricBinaryOp binary_op = 3;

    // A parameter name looked up in the consumer's evaluation scope.
    string parameter = 4;

    // Arithmetic negation of a sub-expression.
    ParametricExpression neg = 5;

    // A sub-expression selected by a choice parameter's text value.
    ParametricSelect select = 7;

    // <add>
    // Arc length of a curve, in meters.
    BuiltinAssetConfiguration.AnalyticalRecipe.CurveLengthExpr curve_length = 8;
    // Euclidean distance between two points, in meters.
    BuiltinAssetConfiguration.AnalyticalRecipe.DistanceExpr distance = 9;
    // Sine, cosine, tangent, their inverses, or a hyperbolic function.
    BuiltinAssetConfiguration.AnalyticalRecipe.TrigExpr trig = 10;
    // Two-argument arctangent, `atan2(y, x)`, in radians.
    BuiltinAssetConfiguration.AnalyticalRecipe.Atan2Expr atan2 = 11;
    // </add>
  }
}

// A sub-expression chosen by the text value of a `TYPE_STRING` parameter.
// Evaluation picks the case matching the parameter's value, or `fallback`
// when none matches (failing the evaluation when `fallback` is unset).
message ParametricSelect {
  // Name of the `TYPE_STRING` parameter supplying the discriminant. A name (not a
  // `DataReference`) keeps the discriminant tied to the parameter's declaration, so a
  // consumer can validate `cases` against the declared choices at decode. A pointer
  // discriminant (for binding-time or cross-scope branching) could be added later as an
  // additive alternative field without changing this one.
  string parameter = 1 [(buf.validate.field).string.min_len = 1];

  // The sub-expression evaluated for each value.
  map<string, ParametricExpression> cases = 2 [(buf.validate.field).map.min_pairs = 1];

  // Evaluated when the parameter's value matches no case.
  optional ParametricExpression fallback = 3;
}

// A binary arithmetic operation applied to two sub-expressions.
message ParametricBinaryOp {
  // The operator applied to `left` and `right`.
  ParametricOperator operator = 1;
  // The left operand.
  ParametricExpression left = 2;
  // The right operand.
  ParametricExpression right = 3;
}

// Arithmetic operators supported in parametric expressions.
enum ParametricOperator {
  // Unspecified operator.
  PARAMETRIC_OPERATOR_UNSPECIFIED = 0;
  // Addition.
  PARAMETRIC_OPERATOR_ADD = 1;
  // Subtraction.
  PARAMETRIC_OPERATOR_SUB = 2;
  // Multiplication.
  PARAMETRIC_OPERATOR_MUL = 3;
  // Division.
  PARAMETRIC_OPERATOR_DIV = 4;
  // Minimum of the two operands.
  PARAMETRIC_OPERATOR_MIN = 5;
  // Maximum of the two operands.
  PARAMETRIC_OPERATOR_MAX = 6;
}

// A parameter binding supplied by an instance to satisfy one entry in
// `ParameterDeclarations`.
//
// A binding is a literal `Any` payload (matching the declared `expected_type`),
// a `DataReference` pointing at a concrete value, or an arithmetic expression
// whose `binding` leaves are resolved against sibling bindings in the same
// behavior.
message ParameterBinding {
  // How the parameter value is supplied.
  oneof source {
    // A literal value matching the declared `expected_type`.
    google.protobuf.Any value = 1;

    // The bound value's type is resolved per `ParameterDeclaration` at runtime,
    // so a static data_reference_expected_type is intentionally not set here.
    // buf:lint:ignore MOTIF_DATA_REFERENCE_MISSING_EXPECTED_TYPE
    motif.extension.v1.DataReference data_ref = 2;

    // An arithmetic expression whose `binding` leaves resolve against sibling
    // bindings in the same behavior.
    ParametricExpression expression = 3;
  }
}

// The behavior which operates on `ParameterDeclarations` and `ResolvedParameters`.
//
// This behavior's regeneration logic is as follows:
// * Find the `ParameterDeclarations` component by following the `declarations`
//   pointer.
// * Construct a `ResolvedParameters` component from the keys in
//   `ParameterDeclarations` and values in `bindings`.
// * Write the `ResolvedParameters` component to the `resolved` entity.
message ParameterBindingsBehavior {
  option (motif.extension.v1.message).component = 91;

  // Pointer to the source `ParameterDeclarations`.
  motif.extension.v1.DataReference declarations = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.ParameterDeclarations"
    }
  ];

  // Pointer to the `ResolvedParameters` destination.
  motif.extension.v1.DataReference resolved = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.ResolvedParameters"
    }
  ];

  // The bindings used to resolve each declared parameter, keyed by name.
  map<string, ParameterBinding> bindings = 3;
}

// A named set of an asset's parameters that the asset's variants set together.
// Lives on a group entity named by `motif.data.core.v1.AssignedName`. A group
// with no variants is valid.
//
// A variant is an entity with `motif.data.core.v1.IsOfType` at the group
// (`BINDING_MODE_ASSIGNED`), an `AssignedName`, and a `ResolvedParameters` with
// one value per key in `parameter_keys`. An instance uses a variant by binding
// each of the group's parameters in its `ParameterBindingsBehavior` to a
// `DataReference` at the variant's `ResolvedParameters.values[<key>]`, so a
// variant edit reaches every bound instance. These bindings are the only record
// of which variant an instance uses, and an instance uses at most one variant
// per group. An instance's asset is the one its `SourceAsset` names, or else
// the one its `motif.data.core.v1.Instance` names.
//
// Writers keep the groups of one asset on disjoint keys, write a value into
// every variant when they add a key, and rebind instances to literal values
// before they remove a key or delete a variant.
//
// Readers ignore a variant value for a key outside `parameter_keys`, a key the
// asset does not declare, and a group whose `asset` does not resolve. A reader
// that predates this component still evaluates variant-bound instances, because
// the bindings are ordinary `DataReference`s.
message AssetVariantGroup {
  option (motif.extension.v1.message).component = 192;

  // The asset whose parameters the group covers. Required.
  motif.extension.v1.EntityReference asset = 1 [(buf.validate.field).required = true];

  // Optional. When set, `asset` is resolved against this model rather than the
  // group's own model, for example a Standard Library asset. Readers match a
  // group to an asset by model ID and entity ID; `model_version` records the
  // asset version whose declarations `parameter_keys` was checked against.
  motif.extension.v1.ModelReference model = 2;

  // Keys into the asset's `ParameterDeclarations.declarations` that the
  // group's variants set. Order carries no meaning.
  repeated string parameter_keys = 3 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {
      string: {min_len: 1}
    }
  }];
}

// A behavior which copies component data from configured sources to output entities.
// Each map key is the destination component type ID; the value describes how to
// obtain the payload and where to place it. Inputs and outputs resolve through
// the evaluation context, which remaps definition references in an instance context.
//
// Currently only motif.data.style.v1.Color payloads are supported. Other component
// types are rejected; additional types require explicit consumer support.
message AssignComponentsBehavior {
  option (motif.extension.v1.message).component = 184;

  // Destination component type IDs must be positive.
  map<int32, ComponentAssignment> assignments = 1 [(buf.validate.field).map.keys.int32.gt = 0];
}

// Describes where component data is found and where it is placed. An omitted
// source uses default_value. Inputs carry a packed message of the destination
// component type. Mismatched or malformed values are errors.
// Input references must not name the output, which would feed generated data
// back into the assignment as an explicit value.
message ComponentAssignment {
  // Required fallback. Its type_url must name the destination component.
  google.protobuf.Any default_value = 1 [(buf.validate.field).required = true];

  // Optional input. If omitted, use default_value. If configured, the referenced
  // value must resolve; an unresolved reference is an incomplete evaluation.
  // In an instance context, this reference is remapped through that context.
  motif.extension.v1.DataReference source = 2 [(motif.extension.v1.field).data_reference_expected_type = {
    kind: TYPE_MESSAGE
    type_name: "google.protobuf.Any"
  }];

  // Where the payload is placed, remapped through the evaluation context.
  // Without a path, component_id must match the destination map key and the
  // payload replaces the whole component. A non-empty path must address a
  // google.protobuf.Any field, which receives the packed component payload.
  //
  // If omitted, the output is the whole destination component on this entity.
  // In an instance context, this entity is remapped to the instance automatically.
  motif.extension.v1.DataReference output = 3 [(motif.extension.v1.field).data_reference_expected_type = {
    kind: TYPE_MESSAGE
    type_name: "google.protobuf.Any"
  }];
}

// A behavior which generates a three-dimensional solid.
//
// The solid is constructed as follows:
// * A rectangular profile is created from the `width` and `height` values in a
//   plane perpendicular to the one defined by `coordinate_system`. The profile
//   is centered on `curve`.
// * The generated profile is swept along the curve from start to end.
// * The generated solid is written to the `output` entity as a `Shape`.
message SweepWidthHeightAlongCurveBehavior {
  option (motif.extension.v1.message).component = 92;

  // The profile width.
  motif.extension.v1.DataReference width = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];

  // The profile height.
  motif.extension.v1.DataReference height = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];

  // The curve to sweep the profile along.
  motif.extension.v1.DataReference curve = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.Curve2"
    }
  ];

  // The coordinate system that places the curve and profile in world space.
  motif.extension.v1.DataReference coordinate_system = 4 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.CoordinateSystem3"
    }
  ];

  // The entity the generated `Shape` is written to.
  motif.extension.v1.DataReference output = 5 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.Shape"
    }
  ];
}

// Sweeps a closed profile along a spine, where both the profile and the spine
// are ordered lists of `Curve2` segments (one `Curve2List` parameter value
// each), rather than a width/height rectangle. The spine `curves` are swept in
// the `coordinate_system`; a single spine segment produces a smooth solid pipe
// while multiple segments produce a pipe-shell with right-corner transitions at
// the joints. The generated solid is written to the `output` entity as a
// `Shape`.
message SweepProfileAlongCurvesBehavior {
  option (motif.extension.v1.message).component = 129;

  // Spine: ordered `Curve2` segments. One segment sweeps a smooth pipe; many
  // sweep a mitered pipe-shell.
  motif.extension.v1.DataReference curves = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.core.v1.Curve2List"
    }
  ];

  // Closed profile loop, as one `Curve2List` value.
  motif.extension.v1.DataReference profile = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.core.v1.Curve2List"
    }
  ];

  // Coordinate system the spine/profile curves live in.
  motif.extension.v1.DataReference coordinate_system = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.CoordinateSystem3"
    }
  ];

  // The entity the generated `Shape` is written to.
  motif.extension.v1.DataReference output = 4 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.Shape"
    }
  ];
}

// A behavior which generates one part of a built-in parametric asset assembly.
//
// Regeneration resolves the named `inputs` into a parameter map, evaluates the
// asset's stored `configuration` against it to obtain the engine-agnostic asset
// parts, looks up the part selected by `part_index`, <remove>sweeps or extrudes
// it (in the part's own self-placing frame)</remove><add>evaluates its geometry
// recipe</add>, and writes the result to the `output`
// entity as a `Shape`.
//
// Distinct from `SweepWidthHeightAlongCurveBehavior` (which only sweeps a
// *centered rectangle* along a *single* curve): asset parts are arbitrary
// non-rectangular profiles, anchored origin-on-spine, swept along multi-segment
// / closed spines (or extruded, for e.g. a glazing pane).
message BuiltinAssetPartBehavior {
  option (motif.extension.v1.message).component = 105;

  // Resolved parameter inputs keyed by parameter name (e.g. "width" /
  // "height"). The configuration's decoder validates the value types it needs;
  // types are not constrained per-entry here.
  // buf:lint:ignore MOTIF_DATA_REFERENCE_MISSING_EXPECTED_TYPE
  map<string, motif.extension.v1.DataReference> inputs = 2;

  // Index into the evaluated configuration's parts selecting which part this
  // behavior builds.
  uint32 part_index = 3;

  // The entity the generated `Shape` is written to.
  motif.extension.v1.DataReference output = 4 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.Shape"
    }
  ];

  // The asset entity's stored configuration the parts are evaluated from.
  // Required.
  motif.extension.v1.DataReference configuration = 5 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.BuiltinAssetConfiguration"
    }
  ];
}

// Stored, expression-driven definition of a built-in asset's parts.
//
// <add>Contains either a planar solid recipe in `parts` or an analytical recipe
// in `analytical`. Readers select the recipe by field presence.</add>
//
// Placed permanently on a `CONFIGURATION_DRIVEN` asset entity.
// <add>In a planar recipe,</add> each part's geometry is a sweep/extrude recipe
// whose scalars are expression trees over named parameters; evaluating the
// configuration against an instance's resolved
// parameter scope yields the same engine-agnostic parts vocabulary the
// code-authored recipes produce (`builtin_asset_recipes::geometry_parts::AssetPart`),
// so consumers bake configured and code-authored assemblies identically.
//
// The <add>planar</add> expression language is single-typed (every expression is
// a finite double in meters) and exactly IEEE-754-specified, so evaluation is
// deterministic.
// Structural limits (expression depth, part and point counts) are enforced at
// decode.
message BuiltinAssetConfiguration {
  option (motif.extension.v1.message).component = 119;

  // <add>
  option (buf.validate.message).cel = {
    id: "builtin_asset_configuration.exclusive_recipe"
    message: "an analytical recipe cannot also set the planar parts field"
    expression: "!has(this.analytical) || size(this.parts) == 0"
  };

  option (buf.validate.message).cel = {
    id: "builtin_asset_configuration.analytical_minimum_reader_version"
    message: "analytical recipes require version 3 or later"
    expression: "!has(this.analytical) || this.version >= 3u"
  };
  // </add>

  // Minimum reader version required to interpret this configuration. Readers
  // built against an older supported version reject higher-versioned payloads
  // up front. Bump only for semantic extensions an older evaluator cannot
  // represent (new ops, new geometry kinds); purely additive optional fields do
  // not bump it. The encoder sets the minimum a payload actually needs:
  // <add>3 when `analytical` is present,</add> 2 when any part uses curve
  // geometry (`curve_sweep`/`curve_extrude`), otherwise 1.
  uint32 version = 1;

  // The assembly's parts, in stable authoring order (a per-part behavior's
  // `part_index` indexes this list).
  repeated Part parts = 2;

  // <add>
  // The analytical recipe. When present, the behavior indexes its evaluated parts.
  AnalyticalRecipe analytical = 3;
  // </add>

  // Scalar expressions over named parameters use the shared
  // `ParametricExpression`. Built-in asset configurations accept its
  // `literal`/`parameter`/`binary_op`/`neg` leaves; the `binding`
  // (`DataReference`) and `select` leaves are rejected at decode.
  // <add>Analytical recipes also accept `curve_length`, `distance`, `trig`,
  // and `atan2`.</add>

  // A 2D point whose coordinates are parametric expressions.
  message Point2Expr {
    // The x-coordinate expression.
    ParametricExpression x = 1;
    // The y-coordinate expression.
    ParametricExpression y = 2;
  }

  // A 3D point whose coordinates are parametric expressions.
  message Point3Expr {
    // The x-coordinate expression.
    ParametricExpression x = 1;
    // The y-coordinate expression.
    ParametricExpression y = 2;
    // The z-coordinate expression.
    ParametricExpression z = 3;
  }

  // A single spine/profile curve segment, built on the fly from expression
  // points at evaluation time (the concrete `Curve2` is never persisted). Each
  // variant maps to a point-based constructor in the `geometry` crate. Nurbs
  // curves are deliberately unsupported.
  message CurveExpr {
    // The curve segment kind.
    oneof curve {
      // Straight segment `start -> end` (`geometry::Line2::from_points`).
      LineCurve line = 1;
      // Circular arc through three points
      // (`geometry::Circle2::from_arc_points`).
      ArcCurve arc = 2;
      // Elliptical arc through start/end plus a middle point
      // (`geometry::Ellipse2::from_ellipse_points`).
      EllipseArcCurve ellipse_arc = 3;
      // <add>
      // A polyline through expression points.
      AnalyticalRecipe.PolylineSegment polyline = 4;
      // An interpolating spline through expression points.
      AnalyticalRecipe.SplineSegment spline = 5;
      // A full circle.
      AnalyticalRecipe.CircleSegment circle = 6;
      // </add>
    }
  }

  // A straight segment defined by two expression endpoints.
  message LineCurve {
    // The segment start point.
    Point2Expr start = 1;
    // The segment end point.
    Point2Expr end = 2;
  }

  // A circular arc through three expression points.
  message ArcCurve {
    // The arc start point.
    Point2Expr start = 1;
    // A point on the arc between `start` and `end`.
    Point2Expr mid = 2;
    // The arc end point.
    Point2Expr end = 3;
  }

  // An elliptical arc through start/end plus a middle point.
  message EllipseArcCurve {
    // The arc start point.
    Point2Expr start = 1;
    // The arc end point.
    Point2Expr end = 2;
    // A point on the arc between `start` and `end`.
    Point2Expr middle = 3;
  }

  // Sweep an ordered curve profile along an ordered curve spine. Unlike
  // `SweepExpr`, spine and profile are curve segments <remove>(lines/arcs)</remove>
  // rather than straight-polyline points: spine connectivity is explicit in the ordered
  // curves, and the profile curves must themselves form a closed loop.
  message CurveSweepExpr {
    // The ordered spine curve segments.
    repeated CurveExpr spine = 1;
    // The ordered profile curve segments (a closed loop).
    repeated CurveExpr profile = 2;
  }

  // Extrude a closed curve profile <remove>(lines/arcs)</remove> along the frame's `+Z`.
  message CurveExtrudeExpr {
    // The closed profile curve segments.
    repeated CurveExpr profile = 1;
    // The extrusion depth, in meters.
    ParametricExpression depth_m = 2;
    // The extrusion start offset along `+Z`, in meters.
    ParametricExpression depth_start_m = 3;
  }

  // The frame embedding a part's 2D recipe into 3D: expression origin, *literal*
  // unit axes (a parameter-dependent rotation would require normalization, which
  // the language cannot express; no recipe needs it).
  // <add>The y-axis is `z × x`.</add>
  message FrameExpr {
    // The frame origin.
    Point3Expr origin = 1;
    // The frame x-axis.
    motif.data.geometry.v1.UnitVector3 x_axis = 2;
    // The frame z-axis.
    motif.data.geometry.v1.UnitVector3 z_axis = 3;
  }

  // A single part of the assembly.
  message Part {
    // Display label (e.g. "Jamb"); becomes the materialized child entity's
    // name.
    string name = 1;
    // The part's display color.
    motif.data.style.v1.Color.Srgb color = 2;
    // Display opacity in [0, 1]; absent = fully opaque.
    optional float opacity = 3;
    // The part's geometry recipe.
    oneof geometry {
      // Sweep a curve profile along a curve spine.
      CurveSweepExpr curve_sweep = 7;
      // Extrude a curve profile along the frame's `+Z`.
      CurveExtrudeExpr curve_extrude = 8;
      // <add>
      // A vertex marker.
      AnalyticalRecipe.PointGeometry point = 9;
      // Drawn curves (a wire body).
      AnalyticalRecipe.LineworkGeometry linework = 10;
      // A sheet body.
      AnalyticalRecipe.SurfaceGeometry surface = 11;
      // A solid: a planar profile swept along an analytical 3D spine.
      AnalyticalRecipe.SweepGeometry sweep = 12;
      // </add>
    }
    // The frame embedding the 2D recipe into 3D.
    // <add>Planar sweeps and extrusions require this frame. The other kinds
    // use their geometry's frames.</add>
    FrameExpr frame = 6;
  }

  // <add>
  // An asset recipe built from analytical points, curves, and surfaces.
  // Nodes marked "kernel" require a geometry kernel. Readers without one
  // decline the part rather than approximating those operations.
  message AnalyticalRecipe {
    // Named analytical geometry, resolved before any part is evaluated. An entry
    // may reference another entry by name through a `GeometryRef`; the
    // references must form a DAG, and a cycle is rejected at decode. A `scalar`
    // entry's value is added to the evaluation scope under its key, so
    // `ParametricExpression.parameter` can read it. Keys must be distinct from
    // the asset's declared parameter names.
    map<string, GeometryExpr> geometry = 1;

    // The assembly's parts, in stable authoring order (a per-part behavior's
    // `part_index` indexes this list).
    repeated Part parts = 2 [(buf.validate.field).repeated.items.cel = {
      id: "analytical_recipe.part_opacity"
      message: "part opacity must be between 0 and 1"
      expression: "!has(this.opacity) || (this.opacity >= 0.0 && this.opacity <= 1.0)"
    }];

    // Which one-argument trigonometric or hyperbolic function `TrigExpr` applies.
    // Trigonometric angles are radians. Hyperbolic functions take a real argument.
    enum TrigFn {
      // Unspecified function.
      TRIG_FN_UNSPECIFIED = 0;
      // Sine.
      TRIG_FN_SIN = 1;
      // Cosine.
      TRIG_FN_COS = 2;
      // Tangent.
      TRIG_FN_TAN = 3;
      // Arcsine. The operand is a ratio in `[-1, 1]`.
      TRIG_FN_ASIN = 4;
      // Arccosine. The operand is a ratio in `[-1, 1]`.
      TRIG_FN_ACOS = 5;
      // Arctangent.
      TRIG_FN_ATAN = 6;
      // Hyperbolic sine.
      TRIG_FN_SINH = 7;
      // Hyperbolic cosine.
      TRIG_FN_COSH = 8;
      // Hyperbolic tangent.
      TRIG_FN_TANH = 9;
      // Inverse hyperbolic sine.
      TRIG_FN_ASINH = 10;
      // Inverse hyperbolic cosine. The operand is a ratio in `[1, +∞)`.
      TRIG_FN_ACOSH = 11;
      // Inverse hyperbolic tangent. The operand is a ratio in `(-1, 1)`.
      TRIG_FN_ATANH = 12;
    }

    // One trigonometric or hyperbolic function of `operand`. A non-finite result
    // (for example arcsine of a value outside `[-1, 1]`, or `atanh` of a value
    // outside `(-1, 1)`) fails evaluation.
    message TrigExpr {
      // The function applied to `operand`.
      TrigFn kind = 1;
      // The operand. Radians for `sin`, `cos`, and `tan`; a real number for the
      // hyperbolic functions.
      ParametricExpression operand = 2;
    }

    // `atan2(y, x)` in radians. The quadrant follows the signs of both operands.
    message Atan2Expr {
      // The y operand.
      ParametricExpression y = 1;
      // The x operand.
      ParametricExpression x = 2;
    }

    // Arc length of `curve`. Closed form for lines, arcs, polylines, and circles;
    // numerically integrated with a fixed scheme for splines and ellipses.
    message CurveLengthExpr {
      // The measured curve.
      CurveExpr curve = 1;
    }

    // Distance between `a` and `b`.
    message DistanceExpr {
      // The first point.
      PointExpr a = 1;
      // The second point.
      PointExpr b = 2;
    }

    // A 3D vector whose components are expressions.
    message Vector3Expr {
      // The x component.
      ParametricExpression x = 1;
      // The y component.
      ParametricExpression y = 2;
      // The z component.
      ParametricExpression z = 3;
    }

    // One named analytical value.
    message GeometryExpr {
      // The value kind.
      oneof value {
        // A derived scalar, in meters.
        ParametricExpression scalar = 1;
        // A 3D point.
        PointExpr point = 2;
        // A 3D curve.
        CurveExpr curve = 3;
        // A surface.
        SurfaceExpr surface = 4;
        // A frame (right-handed orthonormal coordinate system).
        FrameNodeExpr frame = 5;
        // A generator rather than a value: emits parts once per index.
        RepeatExpr repeat = 6;
      }
    }

    // A frame as a value: the thing a section is authored in once and then
    // placed on every station of a curve.
    message FrameNodeExpr {
      // The frame kind.
      oneof frame {
        // An expression origin with literal axes.
        FrameExpr literal = 1;
        // A named `frame` entry.
        GeometryRef ref = 2;
        // The frame at a station of a curve.
        FrameAtExpr at_curve = 3;
      }
    }

    // The frame at station `t` of `curve`. Axis convention: `z` is the tangent
    // (direction of travel; a displacement along it leaves the section plane),
    // `y` is section-vertical (the component of `up` perpendicular to the
    // tangent), `x = y × z` is section-horizontal. Evaluation fails where the
    // tangent is parallel to `up`.
    message FrameAtExpr {
      // The curve carrying the station.
      CurveExpr curve = 1;
      // Station parameter: the curve's own domain (meters of arc length), or a
      // `[0, 1]` fraction of it when `normalized` is set.
      ParametricExpression t = 2;
      // Interpret `t` as a normalized `[0, 1]` fraction of the domain.
      bool normalized = 3;
      // The up direction the section-vertical axis follows; `+Z` when unset.
      motif.data.geometry.v1.UnitVector3 up = 4;
    }

    // Count-driven repetition. Evaluates `parts` once per index `i` in
    // `0..count`, with `index` bound to `i` (and `parity` to `i mod 2` when set)
    // as scalars, and `geometry` resolved per iteration on top of the
    // configuration's named geometry. Emitted parts are named
    // `"{part.name}[{i}]"` and follow all fixed parts, in repeat-entry key order.
    //
    // `count` is a number of stations: on a closed plan `t = i / count` gives
    // `count` sections and `count` bays (the last closing back to station 0); on
    // an open plan `t = i / (count − 1)` includes both endpoints and the bay
    // repeat's count is `count − 1`. `count` must evaluate to a finite
    // non-negative integer. `index`, `parity`, and the local entry names must be
    // distinct and must not shadow a parameter or configuration-level entry;
    // a local entry may not itself be a repeat.
    message RepeatExpr {
      // Number of iterations.
      ParametricExpression count = 1;
      // Scalar name bound to the iteration index.
      string index = 2;
      // Scalar name bound to `index mod 2`, for alternating recipes.
      optional string parity = 3;
      // Permit an odd `count` with `parity` set; otherwise strict alternation
      // cannot close a ring and the odd count is rejected.
      bool allow_parity_seam = 4;
      // Entries local to each iteration.
      map<string, GeometryExpr> geometry = 5;
      // The template parts.
      repeated Part parts = 6 [(buf.validate.field).repeated.items.cel = {
        id: "analytical_repeat.part_opacity"
        message: "part opacity must be between 0 and 1"
        expression: "!has(this.opacity) || (this.opacity >= 0.0 && this.opacity <= 1.0)"
      }];
    }

    // A reference to a named entry in `geometry`. The entry's kind must match
    // the referencing field.
    message GeometryRef {
      // The entry key.
      string name = 1;
    }

    // A 3D point.
    message PointExpr {
      // The point kind.
      oneof point {
        // Literal expression coordinates.
        Point3Expr literal = 1;
        // A named `point` entry.
        GeometryRef ref = 2;
        // A point evaluated on a curve.
        PointAtExpr point_at = 3;
        // A curve–curve intersection (kernel).
        IntersectExpr intersect = 4;
        // A point projected onto a surface (kernel for non-planar surfaces).
        ProjectPointExpr project = 5;
        // A point written in a frame's coordinates.
        InFrameExpr in_frame = 6;
      }
    }

    // The point with coordinates `local` in `frame`: `origin + x·X + y·Y + z·Z`.
    message InFrameExpr {
      // The frame.
      FrameNodeExpr frame = 1;
      // Frame-local coordinates.
      Point3Expr local = 2;
    }

    // The point on `curve` at parameter `t`.
    message PointAtExpr {
      // The evaluated curve.
      CurveExpr curve = 1;
      // Curve parameter in the curve's own domain. A circle's domain is its angle,
      // not `[0, 1]`. Set `normalized` to read `t` as a fraction of that domain.
      ParametricExpression t = 2;
      // Read `t` as a `[0, 1]` fraction of the curve domain. An iso curve has no
      // switch: surface parameters are already that fraction.
      bool normalized = 3;
    }

    // One intersection point of two curves. Intersections are ordered along
    // `a`'s parameter; `index` selects one. Fewer intersections than `index + 1`
    // is a per-part evaluation error, not an empty result.
    message IntersectExpr {
      // The first curve; results are ordered along its parameter.
      CurveExpr a = 1;
      // The second curve.
      CurveExpr b = 2;
      // Which intersection, in order along `a`.
      uint32 index = 3;
    }

    // The closest point on `onto` to `point`.
    message ProjectPointExpr {
      // The projected point.
      PointExpr point = 1;
      // The target surface.
      SurfaceExpr onto = 2;
    }

    // A 3D curve.
    message CurveExpr {
      // The curve kind.
      oneof curve {
        // Ordered planar segments embedded by a frame.
        PlanarCurveExpr planar = 1;
        // A named `curve` entry.
        GeometryRef ref = 2;
        // A curve projected onto a surface (kernel).
        ProjectCurveExpr project = 3;
        // An isoparametric curve of a surface.
        IsoCurveExpr iso = 4;
        // A parameter sub-range of a curve.
        TrimExpr trim = 5;
        // A curve read as authored in a frame.
        PlacedCurveExpr placed = 6;
        // An interpolating spline through 3D points.
        Spline3Expr spline = 7;
        // A curve with its direction of travel reversed.
        CurveExpr reversed = 8;
      }
    }

    // `curve` read as if authored in `frame`: its world coordinates are taken as
    // coordinates in `frame`. A planar curve composes frames exactly; sampled
    // and spline curves map their points.
    message PlacedCurveExpr {
      // The curve to place.
      CurveExpr curve = 1;
      // The frame to place it in.
      FrameNodeExpr frame = 2;
    }

    // Interpolating spline of `order` (degree + 1; `0` selects cubic, lowered to
    // fit fewer points) through 3D `points`; `closed` returns to the first point.
    message Spline3Expr {
      // The interpolation points, at least two.
      repeated PointExpr points = 1 [(buf.validate.field).repeated.min_items = 2];
      // Spline order; `0` for the default.
      uint32 order = 2;
      // Close back to the first point.
      bool closed = 3;
    }

    // Ordered 2D segments in `frame`, forming one connected curve. Segments are
    // consumed in order; each must start where the previous one ended.
    message PlanarCurveExpr {
      // The frame embedding the 2D segments into 3D.
      FrameExpr frame = 1;
      // The ordered segments, at least one.
      repeated BuiltinAssetConfiguration.CurveExpr segments = 2;
    }

    // A polyline through `points`, in order.
    message PolylineSegment {
      // The vertices, at least two.
      repeated Point2Expr points = 1 [(buf.validate.field).repeated.min_items = 2];
      // Append the segment back to the first point.
      bool closed = 2;
    }

    // A spline interpolating `points`, in order. Evaluated as a fixed-order
    // interpolation in IEEE-754 arithmetic with a fixed operation order, so the
    // result is reproducible across readers.
    message SplineSegment {
      // The interpolated points, at least two.
      repeated Point2Expr points = 1 [(buf.validate.field).repeated.min_items = 2];
      // Spline order (degree + 1); 0 selects the reader's default, cubic.
      uint32 order = 2;
      // Interpolate a closed, periodic curve.
      bool closed = 3;
    }

    // A full circle, counter-clockwise from `+X` in its frame.
    message CircleSegment {
      // The center.
      Point2Expr center = 1;
      // The radius, in meters; must evaluate positive.
      ParametricExpression radius = 2;
    }

    // `curve` projected onto `onto` along the surface normal.
    message ProjectCurveExpr {
      // The projected curve.
      CurveExpr curve = 1;
      // The target surface.
      SurfaceExpr onto = 2;
    }

    // The isoparametric curve of `surface` at fixed `t` in `dir`.
    message IsoCurveExpr {
      // The host surface.
      SurfaceExpr surface = 1;
      // The fixed parameter direction.
      IsoDirection dir = 2;
      // The fixed parameter in `[0, 1]`. Surface parameters are always a fraction
      // of the domain, so this has no `normalized` switch.
      ParametricExpression t = 3;
    }

    // Which surface parameter an iso curve holds fixed.
    enum IsoDirection {
      // Unspecified direction.
      ISO_DIRECTION_UNSPECIFIED = 0;
      // `u` fixed: the curve runs across the rails.
      ISO_DIRECTION_U = 1;
      // `v` fixed: the curve runs along the rails.
      ISO_DIRECTION_V = 2;
    }

    // The sub-range `[t0, t1]` of `curve`.
    message TrimExpr {
      // The trimmed curve.
      CurveExpr curve = 1;
      // Start parameter in the curve's own domain, or a `[0, 1]` fraction when
      // `normalized` is set.
      ParametricExpression t0 = 2;
      // End parameter in the curve's own domain, or a `[0, 1]` fraction when
      // `normalized` is set.
      ParametricExpression t1 = 3;
      // Read `t0` and `t1` as `[0, 1]` fractions of the curve domain.
      bool normalized = 4;
    }

    // A surface.
    message SurfaceExpr {
      // The surface kind.
      oneof surface {
        // A named `surface` entry.
        GeometryRef ref = 1;
        // An unbounded plane.
        PlaneExpr plane = 2;
        // A ruled surface between two rails.
        RuledSurfaceExpr ruled = 3;
        // A rail extruded along a direction.
        ExtrudedSurfaceExpr extruded = 4;
        // A smooth loft over three or more rails (kernel).
        LoftSurfaceExpr loft = 5;
      }
    }

    // The plane of `frame`: origin on the plane, `z_axis` its normal.
    message PlaneExpr {
      // The defining frame.
      FrameExpr frame = 1;
    }

    // Straight lines between corresponding normalized arc-length parameters of
    // two rails: `rail0(u)` to `rail1(u)`, start to start and end to end, as
    // authored. Wrap a rail in `CurveExpr.reversed` to change the
    // correspondence; it is never inferred.
    message RuledSurfaceExpr {
      // The first rail (`v = 0`).
      CurveExpr rail0 = 1;
      // The second rail (`v = 1`).
      CurveExpr rail1 = 2;
    }

    // `rail` swept along `direction`; the vector's length is the extrusion
    // distance.
    message ExtrudedSurfaceExpr {
      // A literal direction has to leave the origin. An expression that evaluates
      // to zero fails at evaluation, where the components are numbers.
      option (buf.validate.message).cel = {
        id: "extruded_surface.direction"
        message: "a literal extrusion direction is not the zero vector"
        expression: "!has(this.direction.x.literal) || !has(this.direction.y.literal) || !has(this.direction.z.literal) || this.direction.x.literal != 0.0 || this.direction.y.literal != 0.0 || this.direction.z.literal != 0.0"
      };

      // The extruded rail.
      CurveExpr rail = 1;
      // The extrusion vector, in meters. Its length is the distance.
      Vector3Expr direction = 2;
    }

    // A smooth blend across `rails`, in order.
    message LoftSurfaceExpr {
      // The rails, at least three.
      repeated CurveExpr rails = 1 [(buf.validate.field).repeated.min_items = 3];
    }

    // A part that bakes to a single vertex at `point`.
    message PointGeometry {
      // The marked point.
      PointExpr point = 1;
    }

    // A part that bakes to a wire of `curves`.
    message LineworkGeometry {
      // The drawn curves, at least one.
      repeated CurveExpr curves = 1;
    }

    // A part that bakes to a sheet of `surface`.
    message SurfaceGeometry {
      // The baked surface.
      SurfaceExpr surface = 1;
    }

    // A solid swept from a closed planar `profile` along `spine` (kernel). The
    // profile's frame is re-based at the spine start so its origin rides the
    // spine; its plane is held normal to the spine tangent along the sweep.
    message SweepGeometry {
      // The 3D spine.
      CurveExpr spine = 1;
      // The closed profile, in its own frame at the spine start.
      PlanarCurveExpr profile = 2;
    }
  }
  // </add>
}

// Tessellates a shape into a triangular mesh.
message TessellateShapeBehavior {
  option (motif.extension.v1.message).component = 93;

  // The source shape to convert.
  motif.extension.v1.DataReference shape = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.Shape"
    }
  ];

  // The entity the generated `Mesh` is written to.
  motif.extension.v1.DataReference output = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.core.v1.Mesh"
    }
  ];
}

// B-rep geometry.
//
// `bodies` carries one OCCT BRepTools binary payload per body in the shape.
message Shape {
  option (motif.extension.v1.message).component = 94;

  // One OCCT BRepTools binary payload per body.
  repeated bytes bodies = 1;
}

// The type of join represented.
enum JoinKind {
  // Unspecified join kind.
  JOIN_KIND_UNSPECIFIED = 0;
  // A butt join.
  JOIN_KIND_BUTT = 1;
}

// Which part of the participant's curve is anchored at the join.
//
// `START` / `END` point at a specific spine endpoint. `CURVE` indicates that
// the participant's whole curve takes part in the join (the participant
// passes through the join location rather than terminating at it). A
// participant with `CURVE` is always treated as the through wall regardless
// of its position in `JoinBehavior.participants`; the other participant must
// then carry a `START` or `END` endpoint that lies on the through wall's
// curve. A join with two `CURVE` participants is rejected.
enum JoinEndpointKind {
  // Unspecified endpoint kind.
  JOIN_ENDPOINT_KIND_UNSPECIFIED = 0;
  // The participant's curve start is anchored at the join.
  JOIN_ENDPOINT_KIND_START = 1;
  // The participant's curve end is anchored at the join.
  JOIN_ENDPOINT_KIND_END = 2;
  // The participant's whole curve takes part in the join.
  JOIN_ENDPOINT_KIND_CURVE = 3;
}

// Per-entity layout description that turns an entity into a join participant.
//
// Holds four `DataReference`s naming the participant's `curve`, `width`,
// `coordinate_system`, and `shape` slots.
//
// ## Two manual copy steps
//
// `JoinableMetadata` is the source of truth for "where does this entity keep
// its joinable layout?". It is currently propagated by **two manual copies**
// performed outside change propagation:
//
//  1. **Asset → Instance (at instance-creation time).** When a tool/runtime
//     spawns an instance of an asset that has `JoinableMetadata`, it copies
//     the component verbatim onto the instance entity. Because the inner
//     `DataReference`s use `this_entity`, the same wire bytes naturally resolve
//     to the instance's own slots when re-decoded on the instance.
//
//     **Why this is manual, not a behavior:** the obvious alternative is an
//     asset-attached "AssignJoinableMetadata" behavior that materializes the
//     instance copy at regen time. Change propagation does not currently
//     support regenerating data that itself contains `DataReference`s and then
//     consuming those `DataReference`s in the same regeneration pass — the
//     framework has no story for "this slot was just produced by a regen and
//     also needs its inner pointers to be honored by downstream resolve calls
//     in the same pass." When that capability is added, this copy should become
//     a behavior.
//
//  2. **Instance → Join (at join-creation time).** When a tool authors a new
//     `JoinBehavior`, it reads each participant entity's `JoinableMetadata`
//     and copies the four inner `DataReference`s into the corresponding
//     `JoinParticipant` fields on the join entity. The copy must **remap
//     `this_entity` to an explicit `entity_id` (the participant entity id)**
//     because the join entity is *not* the participant entity, so leaving the
//     wire form as `this_entity` would resolve to the wrong host.
//
//     **Why this is also manual:** the natural alternative is for
//     `JoinParticipant` to hold a single `DataReference` to the participant's
//     `JoinableMetadata` and have the framework follow that pointer to
//     discover the four leaf refs. Change propagation's persistence loader
//     does **single-hop** `DataReference` walks — it loads what a relationship's
//     direct refs point at, but does not then walk the loaded component's
//     own refs. As a result, the participant's `Shape`/`ResolvedParameters`
//     never enter the model and `JoinBehavior::register` cannot resolve
//     them. Until the loader grows multi-hop / recursive walks (an explicit
//     framework change), the join carries the leaf refs directly.
//
// **Why the copies are safe:** in both cases we are copying *structural*
// pointers (slot kinds + paths), not the values they point at. The inner
// `DataReference`s do not change once the asset is authored — only the values at
// the targeted slots do, and those are re-resolved at each regen via the
// (single) hop the framework already performs.
message JoinableMetadata {
  option (motif.extension.v1.message).component = 95;

  // The participant's spine curve slot.
  motif.extension.v1.DataReference curve = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.Curve2"
    }
  ];

  // The participant's width slot.
  motif.extension.v1.DataReference width = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];

  // The participant's coordinate-system slot.
  motif.extension.v1.DataReference coordinate_system = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.CoordinateSystem3"
    }
  ];

  // The participant's shape slot.
  motif.extension.v1.DataReference shape = 4 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.Shape"
    }
  ];
}

// Data references to one participant's state needed by the join.
message JoinParticipant {
  // The participant's spine curve slot.
  motif.extension.v1.DataReference curve = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.Curve2"
    }
  ];

  // The participant's width slot.
  motif.extension.v1.DataReference width = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];

  // The participant's coordinate-system slot.
  motif.extension.v1.DataReference coordinate_system = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.CoordinateSystem3"
    }
  ];

  // The participant's shape slot.
  motif.extension.v1.DataReference shape = 4 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.Shape"
    }
  ];

  // Which part of the participant's curve is anchored at the join.
  JoinEndpointKind endpoint = 5;
}

// A behavior which defines a join between one or more participants.
//
// Participants are assigned priority based on the order of the `participants`
// collection. The first and second participants are the primary definers of the
// result geometry, and all other participants adapt to that geometry. In the
// future we will allow changing priority without modifying the collection.
message JoinBehavior {
  option (motif.extension.v1.message).component = 96;

  // The kind of join.
  JoinKind kind = 1;
  // The participants in the join, in priority order.
  repeated JoinParticipant participants = 2;
}

// <remove>Component 97 `TrimmedHostingSurface` and component 98 `HostBehavior`
// were removed here; hosting is now a single face-mate path and `HostedBehavior`
// binds straight to the host's `ReferenceGeometry` face entry. Their removed
// doc prose read:
//
//   TrimmedHostingSurface: "A planar hosting surface trimmed to the valid
//   placement region on a host entity. The hosting plane is computed from the
//   same inputs as the host's swept geometry so the two stay consistent:
//   `curve` + `coordinate_system` give the plane's origin (curve start), its
//   u-axis (curve start tangent) and normal (the host's thickness direction),
//   and the u-extent (the curve length); `height` is the v-extent (the host
//   height, measured from the base up)." Its field comments — `surface`,
//   `curve`, `height`, `coordinate_system` — were removed with it.
//
//   HostBehavior: "A behavior which identifies an entity as a host for other
//   hosted entities." Its field comment — `hosting_surface` — was removed with
//   it.
//
// Component ids 97 and 98 are retired and must never be reused.</remove>

// A behavior which identifies an entity as hosted on another entity's hosting
// surface.
//
// <remove>Regeneration reads the host's trimmed hosting surface and the stored
// parametric coordinate, then writes the hosted entity's absolute transform.</remove>
// <add>Regeneration reads the host's `ReferenceGeometry` face and this element's
// own mating face, mates the two at the stored parametric coordinate, then
// writes the hosted entity's absolute transform.</add>
message HostedBehavior {
  option (motif.extension.v1.message).component = 99;

  // <remove>The host's trimmed hosting surface.</remove>
  // <add>The host face this element mates to: the host's own `ReferenceGeometry`
  // (target = the host entity) with, in the path, the entry that is the face — a
  // plane for a straight host, a cylinder for a curved one. Each entry is its own
  // resolvable slot, so this binds directly to the face.</add>
  motif.extension.v1.DataReference host_surface = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.ReferenceGeometry"
    }
  ];

  // The parametric coordinate on the hosting surface.
  motif.extension.v1.DataReference parametric_coordinate = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.Point2"
    }
  ];

  // <add>Which of THIS element's own `ReferenceGeometry` entries is the face it
  // mates to the host.
  //
  // The persisted counterpart of `host_surface`, on the element's side: it names
  // the element's own `ReferenceGeometry` (target = this entity) and, in the
  // path, the entry that is its mating face. Each entry is its own resolvable
  // slot, so this binds directly to the face. The mating face fixes which side
  // the element faces, so no facing flip is needed.</add>
  motif.extension.v1.DataReference mating_reference = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.ReferenceGeometry"
    }
  ];

  // The entity the computed absolute transform is written to.
  motif.extension.v1.DataReference absolute_transform = 4 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.core.v1.Isometry"
    }
  ];

  // <remove>4 was `facing_flip`: "Turns the hosted element to face the host's
  // other side."</remove>
  // <add>The mating face now fixes which side the element faces, so the
  // per-element flip is gone. Field 4 carries `absolute_transform` rather than
  // being reserved: the `host_surface` retarget above already breaks every
  // pre-existing `HostedBehavior`, so there is no older payload to protect.</add>
  reserved "facing_flip";

  // Turns the element on its host face: radians about the face normal.
  //
  // A mate fixes the element's orientation completely, so this is the one
  // rotational freedom it leaves open. The placement composes as
  // `host_frame ∘ offset(u, v) ∘ rotation(angle) ∘ mating_frame⁻¹`, so the
  // rotation turns the element in place at its seat point rather than sweeping
  // it across the face.
  //
  // Measured counter-clockwise from the host face's `axis_u`. A face that
  // authors an `axis_u` fixes what a stored angle means; a face that leaves it
  // unset falls back to a derived axis, so changing that derivation later would
  // re-interpret every angle already stored against it. Author `axis_u` on any
  // host face meant to carry rotation.
  //
  // Unset means no rotation, and is how every placement authored before this
  // field reads.
  motif.extension.v1.DataReference angle_about_face_normal = 5 [(motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}];

  // The `host_frame` term of the composition above: the placement of the entity
  // that publishes the face `host_surface` names.
  //
  // A `ReferenceGeometry` entry is authored in the frame of the entity that
  // publishes it, so that entity's own placement is what carries the face into
  // the model's frame. Seating an element on such a face without this term
  // places it at the model origin.
  //
  // Regeneration requires `target` to equal `host_surface.target` exactly — the
  // same oneof case with the same value, not merely a target denoting the same
  // entity — and this field to be that entity's `Isometry`. It rejects a
  // `this_entity` target, which would name the element's own `Isometry` rather
  // than its host's, and rejects any `path`. Unset means the face is already in
  // the model's frame and no placement is composed, which is how every payload
  // written before this field reads.
  motif.extension.v1.DataReference host_frame_transform = 6 [(motif.extension.v1.field).data_reference_expected_type = {
    kind: TYPE_MESSAGE
    type_name: "motif.data.core.v1.Isometry"
  }];
}

// A behavior which subtracts one profile solid from a target geometry.
//
// Regeneration reads the target geometry, builds a profile solid from the
// supplied dimensions and placement on the host surface, and writes the cut
// result back to the target geometry slot using a pipeline write sequence.
message CutGeometryBehavior {
  option (motif.extension.v1.message).component = 100;

  // The geometry to cut into; the cut result is written back here.
  motif.extension.v1.DataReference target_geometry = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.Shape"
    }
  ];

  // The hosted element's world-space placement transform (e.g. the `Isometry` a
  // `HostedBehavior` writes). Its translation is the cut center; its rotation
  // supplies the host-surface frame from which the cut derives the profile plane
  // and the extrusion direction.
  motif.extension.v1.DataReference cut_transform = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.core.v1.Isometry"
    }
  ];

  // World-space extrusion vector for the cutter prism. Thickness is
  // `|extrusion|`.
  motif.extension.v1.DataReference extrusion = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.Vector3"
    }
  ];

  // The profile width.
  motif.extension.v1.DataReference profile_width = 4 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];

  // The profile height.
  motif.extension.v1.DataReference profile_height = 5 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];
}

// Extrudes a closed boundary profile perpendicular to a workplane.
//
// Regeneration reads the workplane coordinate system, a `MultiClosedRegion2D`
// profile in workplane-local coordinates, and `thickness`. Each
// `ClosedRegion2D` becomes one planar face (exterior minus holes) extruded
// along ± the workplane normal (sign baked on the asset via
// `extrude_along_workplane_normal`) as its own solid body on the `output`
// entity's `Shape`. Consumers must refuse an empty or open loop.
message ExtrudeBoundaryProfileBehavior {
  option (motif.extension.v1.message).component = 141;

  // Workplane the boundary profile lies in.
  motif.extension.v1.DataReference workplane = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.CoordinateSystem3"
    }
  ];

  // Closed regions: each entry is one exterior plus optional holes. Several
  // entries are disjoint outers or nested islands (separate solids).
  motif.extension.v1.DataReference profile = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.MultiClosedRegion2D"
    }
  ];

  // Extrusion distance (meters).
  motif.extension.v1.DataReference thickness = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];

  // Deprecated: use `extrude_along_normal`, which carries the same meaning as a
  // resolved parameter rather than a value baked into the asset family. When
  // true, extrude along the +workplane normal (ceiling); when false, along the
  // -normal (floor). Still honored, but only as the fallback when
  // `extrude_along_normal` is unset.
  bool extrude_along_workplane_normal = 4 [deprecated = true];

  // Resolved parameter: when true, extrude along the +workplane normal; when
  // false, along the -workplane normal. When set this wins over the deprecated
  // `extrude_along_workplane_normal`.
  motif.extension.v1.DataReference extrude_along_normal = 6 [(motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_BOOL}];

  // Elevation of the level this boundary is placed on, in meters, referenced
  // rather than copied. Bound to the level's `RelativeElevation.elevation`, so
  // the boundary tracks the level through change propagation instead of holding
  // a snapshot that goes stale when the level moves. Mirrors the wall's
  // `base_level_elev` on
  // `motif.data.model.v1.ComposeParametricWallSweepInputsBehavior`.
  //
  // When set, the profile is extruded from `workplane` with `origin.z`
  // overridden to `base_level_elev + base_offset`, exactly as the wall composes
  // its sweep frame; the workplane's axes are untouched, so orientation and the
  // in-plane position still come from the workplane itself.
  //
  // Optional: boundaries authored before this field reference no level, and the
  // workplane's own `origin.z` stands unmodified.
  motif.extension.v1.DataReference base_level_elev = 7 [(motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}];

  // Resolved parameter: the boundary's signed offset from `base_level_elev`, in
  // meters. Negative values sit below the level. Held separately from the level
  // elevation so that moving the level preserves the offset the boundary was
  // authored with, rather than rewriting it.
  //
  // Ignored when `base_level_elev` is unset. Unset or zero places the boundary
  // on the level itself.
  motif.extension.v1.DataReference base_offset = 8 [(motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}];

  // The entity the generated `Shape` is written to.
  motif.extension.v1.DataReference output = 5 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.Shape"
    }
  ];
}

// Points at the original asset that was materialized. The result of
// materializing a parametric asset is pointed at by `Instance`; this points back
// at the source. For non-parametric assets, this is not present.
message SourceAsset {
  option (motif.extension.v1.message).component = 130;

  // The source asset entity that was materialized. Required.
  motif.extension.v1.EntityReference entity = 1 [(buf.validate.field).required = true];

  // Optional. When set, the source entity is resolved against this model and
  // version rather than the materialized entity's own model.
  motif.extension.v1.ModelReference model = 2;
}

// Records the asset definition a copied asset was copied from, in another
// model, the Standard Library, or the same model when the asset was
// duplicated. Set on every copied top-level definition.
//
// It names the immediate source: the source entity and the source model at the
// version the copy was taken from. A copy of a copy therefore records the copy
// it was made from, not the original.
//
// Provenance only. The source may later be removed, so these references can
// name an entity that no longer exists. Materialized clones (see
// `SourceAsset`) do not inherit this component.
message CopiedFrom {
  option (motif.extension.v1.message).component = 194;

  // The source asset entity. Required.
  motif.extension.v1.EntityReference entity = 1 [(buf.validate.field).required = true];

  // The source model, at the version the copy was taken from. Required.
  motif.extension.v1.ModelReference model = 2 [(buf.validate.field).required = true];
}

// Authored declarations for stable reference geometry on an asset.
//
// A resolver evaluates each entry and writes a `ReferenceGeometry` component
// whose entries preserve the declared IDs. The asset's existing lifecycle
// determines whether that resolved component belongs on an instance or on a
// materialized asset.
//
// Every construction method produces coordinates in the local frame of the
// entity that receives the resolved `ReferenceGeometry`. All entries in one
// specification therefore share that single frame (even if they use different
// construction methods).
message ReferenceGeometryDefinition {
  option (motif.extension.v1.message).component = 168;

  // The asset's reference geometry declarations, keyed by stable reference ID.
  // Keys are scoped to this component. Keys must remain stable across compatible
  // recipe revisions.
  map<uint32, ReferenceGeometryEntryDefinition> entries = 1 [(buf.validate.field).map = {
    min_pairs: 1
    keys: {
      uint32: {gt: 0}
    }
  }];
}

// One authored stable reference geometry declaration.
message ReferenceGeometryEntryDefinition {
  // Optional human-readable name.
  optional string name = 1;

  // Selection priority. Larger values have higher priority.
  int32 priority = 2;

  // How to construct the reference geometry.
  oneof primitive {
    option (buf.validate.oneof).required = true;

    // A planar reference.
    PlaneDefinition plane = 3;

    // A cylindrical reference.
    CylinderDefinition cylinder = 4;

    // A reference whose concrete primitive or construction method is selected
    // at runtime from at least two supported construction cases. Use `plane`
    // or `cylinder` directly when the recipe needs only one construction
    // method.
    //
    // Useful for assets like a wall whose center-line reference geometry is a
    // plane for a straight curve and a cylinder for a circular curve.
    CurveBasedGeometryDefinition curve_based = 5;
  }
}

// Authored construction cases for a reference geometry whose primitive or
// construction method is selected at runtime.
//
// Use this only where runtime selection is needed between at least two
// construction cases, such as a wall centerline that can be planar or
// cylindrical depending on the wall curve type. If only one construction method is
// needed, use the relevant direct spec such as PlaneDefinition.
message CurveBasedGeometryDefinition {
  // Construction cases supported by this recipe.
  // Each construction method may appear at most once. (We do not choose between
  // duplicates; ReferenceGeometryDefinition with duplicates is treated as invalid).
  repeated CurveBasedGeometryCase cases = 1 [(buf.validate.field).repeated.min_items = 2];
}

// One construction case in a CurveBasedGeometryDefinition.
message CurveBasedGeometryCase {
  // The selected arm identifies the construction method.
  oneof definition {
    option (buf.validate.oneof).required = true;

    // Applies only when the resolved Curve2 contains a Line2.
    PlaneUsingLineOffsetDefinition line_offset = 1;

    // Applies only when the resolved Curve2 contains a Circle2.
    CylinderUsingCurveRadiusDefinition circle_radius = 2;
  }
}

// Authored mappings from asset parameters to reference geometry pairs.
//
// This authored component is intentionally distinct from the published
// ReferenceGeometryParameterMap, even though the two are virtually identical.
// This allows the asset to own the spec while the instance owns the published map.
// (On a materialized instance both can coexist)
// The spec preserves authored intent, whereas the published map includes entries
// only after their parameter names and reference IDs validate, and its validity_status
// reports whether they are usable with the current ReferenceGeometry.
message ReferenceGeometryParameterMapDefinition {
  option (motif.extension.v1.message).component = 169;

  // The asset's parameter-to-reference mappings.
  repeated ReferenceGeometryParameterMapEntryDefinition entries = 1 [(buf.validate.field).repeated.min_items = 1];
}

// One authored mapping from a scalar parameter to reference geometry.
message ReferenceGeometryParameterMapEntryDefinition {
  // The name of the declared asset parameter controlled by this reference pair.
  string parameter_name = 1 [(buf.validate.field).string.min_len = 1];

  // The first reference geometry ID.
  uint32 start_reference_id = 2 [(buf.validate.field).uint32.gt = 0];

  // The second reference geometry ID.
  uint32 end_reference_id = 3 [(buf.validate.field).uint32.gt = 0];

  // How the parameter relates to the two references.
  ReferenceGeometryParameterMappingKind kind = 4 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
}

// Concrete reference geometry resolved from a `ReferenceGeometryDefinition`.
//
// Every primitive is expressed in the local frame of the entity carrying this
// component. To use the geometry in model coordinates a client should apply
// the transform of the particular instance being consumed.
// If the component is on an instance and the instance has no placement transform,
// its local-to-model transform is identity.
// If the component is shared on a materialized asset, an instance of that asset
// is required to establish model coordinates.
message ReferenceGeometry {
  option (motif.extension.v1.message).component = 170;

  // The resolved references.
  // Empty if generation failed, so consumers do not accidentally use
  // stale geometry produced from older input values.
  map<uint32, ReferenceGeometryEntry> entries = 1 [(buf.validate.field).map.keys = {
    uint32: {gt: 0}
  }];
}

// One concrete reference resolved from a `ReferenceGeometryEntryDefinition`.
message ReferenceGeometryEntry {
  // Optional human-readable name copied from the authored declaration.
  optional string name = 1;

  // Selection priority copied from the authored declaration.
  int32 priority = 2;

  // The resolved reference geometry.
  oneof primitive {
    option (buf.validate.oneof).required = true;

    // A planar reference.
    UnboundedPlane plane = 3;

    // A cylindrical reference.
    UnboundedCylinder cylinder = 4;
  }
}

// Published mappings from logical asset parameters to concrete reference geometry pairs.
// This derived component is separate from its authored spec, despite the two being virtually
// identical. See the `ReferenceGeometryParameterMapDefinition` comment for the rationale.
message ReferenceGeometryParameterMap {
  option (motif.extension.v1.message).component = 171;

  // Parameter to reference mappings
  // They may remain present while validity_status is INVALID due to the corresponding
  // concrete reference geometry being unavailable.
  repeated ReferenceGeometryParameterMapEntry entries = 1;

  // Whether every mapping refers to a declared parameter and currently generated references.
  ReferenceGeometryParameterMapValidityStatus validity_status = 2 [(buf.validate.field).enum.defined_only = true];
}

// One published mapping from a logical asset parameter to reference geometry.
message ReferenceGeometryParameterMapEntry {
  // The logical parameter name copied from the authored mapping.
  string parameter_name = 1 [(buf.validate.field).string.min_len = 1];

  // The first reference geometry ID.
  uint32 start_reference_id = 2 [(buf.validate.field).uint32.gt = 0];

  // The second reference geometry ID.
  uint32 end_reference_id = 3 [(buf.validate.field).uint32.gt = 0];

  // How the parameter relates to the two references.
  ReferenceGeometryParameterMappingKind kind = 4 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
}

// Whether the published parameter map is usable
// It could be invalid for several reasons, such as if a mapping names an unsuitable
// parameter, names an ID absent from ReferenceGeometryDefinition, or its referenced
// concrete geometry was not successfully generated.
enum ReferenceGeometryParameterMapValidityStatus {
  // No validation result has been recorded. Consumers should not use the entries.
  REFERENCE_GEOMETRY_PARAMETER_MAP_VALIDITY_STATUS_UNSPECIFIED = 0;

  // Every mapping refers to a declared parameter and currently generated references.
  REFERENCE_GEOMETRY_PARAMETER_MAP_VALIDITY_STATUS_VALID = 1;

  // The mappings cannot currently be used. Validated entries may remain available for inspection.
  REFERENCE_GEOMETRY_PARAMETER_MAP_VALIDITY_STATUS_INVALID = 2;
}

// How a scalar parameter relates to a pair of reference geometries.
enum ReferenceGeometryParameterMappingKind {
  // No mapping kind specified. This is invalid for a mapping entry.
  REFERENCE_GEOMETRY_PARAMETER_MAPPING_KIND_UNSPECIFIED = 0;

  // A linear distance between two reference geometries.
  REFERENCE_GEOMETRY_PARAMETER_MAPPING_KIND_LINEAR = 1;

  // An angle between two reference geometries.
  REFERENCE_GEOMETRY_PARAMETER_MAPPING_KIND_ANGULAR = 2;

  // A radius or radial distance between two (cylindrical) reference geometries.
  REFERENCE_GEOMETRY_PARAMETER_MAPPING_KIND_RADIAL = 3;
}

// A source that resolves to a two-dimensional curve.
message Curve2Input {
  // How the curve value is supplied.
  oneof source {
    option (buf.validate.oneof).required = true;

    // Name in the current instance's resolved-parameter scope.
    string parameter = 1;

    // Direct reference to Curve2 data.
    motif.extension.v1.DataReference data_ref = 2 [(motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.Curve2"
    }];
  }
}

// A source that resolves to a three-dimensional coordinate system.
//
// When used to construct reference geometry, the coordinate-system value is
// expressed in the local frame of the entity receiving `ReferenceGeometry`.
message CoordinateSystem3Input {
  // How the coordinate-system value is supplied.
  oneof source {
    option (buf.validate.oneof).required = true;

    // Name in the current instance's resolved-parameter scope.
    string parameter = 1;

    // Direct reference to CoordinateSystem3 data.
    motif.extension.v1.DataReference data_ref = 2 [(motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.CoordinateSystem3"
    }];
  }
}

// An authored method for constructing a planar reference.
// Every construction method produces a plane in the local frame of the entity
// receiving the resolved `ReferenceGeometry`.
message PlaneDefinition {
  // The supported plane construction methods.
  oneof definition {
    option (buf.validate.oneof).required = true;

    // Construct a plane from an origin and normal.
    PlaneUsingOriginNormalDefinition origin_normal = 1;

    // Construct a plane from a location and tangent on a curve.
    PlaneUsingCurveLocationDefinition using_curve_location = 2;

    // Construct a plane parallel to a line at a signed perpendicular offset.
    PlaneUsingLineOffsetDefinition using_line_offset = 3;

    // Construct a plane at a curve location, offset along a coordinate system's Z axis.
    PlaneUsingCurveLocationZOffsetDefinition using_curve_location_z_offset = 4;

    // Construct a plane from an Isometry-relative origin and signed local-axis normal.
    PlaneUsingIsometryLocalOffsetDefinition using_isometry_local_offset = 5;
  }
}

// Constructs a plane by evaluating its origin and normal coordinates.
message PlaneUsingOriginNormalDefinition {
  // Plane-origin X coordinate.
  ParametricExpression origin_x = 1 [(buf.validate.field).required = true];

  // Plane-origin Y coordinate.
  ParametricExpression origin_y = 2 [(buf.validate.field).required = true];

  // Plane-origin Z coordinate.
  ParametricExpression origin_z = 3 [(buf.validate.field).required = true];

  // Plane-normal X component.
  ParametricExpression normal_x = 4 [(buf.validate.field).required = true];

  // Plane-normal Y component.
  ParametricExpression normal_y = 5 [(buf.validate.field).required = true];

  // Plane-normal Z component.
  ParametricExpression normal_z = 6 [(buf.validate.field).required = true];

  // <add>Optional in-plane u-axis X component. When all three axis_u components are set, the generated
  // plane carries an explicit axis_u (see UnboundedPlane.axis_u), pinning its in-plane orientation
  // for faces whose hosted elements must align (e.g. a wall opening's front mate face). When unset,
  // the frame derives the u-axis heuristically.</add>
  ParametricExpression axis_u_x = 7;

  // <add>Optional in-plane u-axis Y component. See axis_u_x.</add>
  ParametricExpression axis_u_y = 8;

  // <add>Optional in-plane u-axis Z component. See axis_u_x.</add>
  ParametricExpression axis_u_z = 9;
}

// Selects a stable location in a curve's parameter domain.
message CurveLocationDefinition {
  // Locations that do not require an accompanying numeric value.
  enum NamedLocation {
    // Unspecified named location.
    NAMED_LOCATION_UNSPECIFIED = 0;

    // The start of the curve domain.
    NAMED_LOCATION_START = 1;

    // The end of the curve domain.
    NAMED_LOCATION_END = 2;

    // The midpoint of the curve domain.
    NAMED_LOCATION_MIDPOINT = 3;
  }

  // Exactly one way of locating the point on the curve.
  oneof location {
    option (buf.validate.oneof).required = true;

    // A platform-defined named location.
    NamedLocation named_location = 1 [
      (buf.validate.field).enum.defined_only = true,
      (buf.validate.field).enum.not_in = 0
    ];

    // A normalized position across the curve's parameter domain, from 0 to 1.
    double fractional_location = 2 [(buf.validate.field).double = {
      gte: 0
      lte: 1
    }];
  }
}

// Constructs a plane from a point and tangent evaluated on a `Curve2`.
//
// The curve is evaluated in its two-dimensional parameter space and lifted
// into three dimensions by `coordinate_system`. The lifted point is the plane
// origin. At the curve start, the plane normal opposes the lifted tangent; at
// the curve end, it follows the lifted tangent. Midpoint and fractional
// locations use the lifted tangent.
message PlaneUsingCurveLocationDefinition {
  // The two-dimensional curve to evaluate.
  Curve2Input curve = 1 [(buf.validate.field).required = true];

  // The coordinate system that lifts the curve into three dimensions.
  CoordinateSystem3Input coordinate_system = 2 [(buf.validate.field).required = true];

  // Where to evaluate the curve.
  CurveLocationDefinition location = 3 [(buf.validate.field).required = true];
}

// Constructs a plane parallel to a line at a signed perpendicular offset.
//
// The line is evaluated in its two-dimensional parameter space. Its local
// left perpendicular `(-dir.y, dir.x)` is used as the plane normal and offset
// direction, then the resulting origin and normal are lifted into three
// dimensions by `coordinate_system`.
message PlaneUsingLineOffsetDefinition {
  // The two-dimensional line to offset. Other Curve2 variants are invalid.
  Curve2Input curve = 1 [(buf.validate.field).required = true];

  // The coordinate system that lifts the line into three dimensions.
  CoordinateSystem3Input coordinate_system = 2 [(buf.validate.field).required = true];

  // Signed perpendicular distance from the line.
  ParametricExpression offset = 3 [(buf.validate.field).required = true];
}

// Constructs a plane centered at a location on a curve and offset along a
// coordinate system's positive Z axis. The plane normal follows that Z axis.
message PlaneUsingCurveLocationZOffsetDefinition {
  // Supported directions for the plane normal along the coordinate-system Z axis.
  enum NormalDirection {
    // Unspecified normal direction.
    NORMAL_DIRECTION_UNSPECIFIED = 0;

    // Normal follows the coordinate system's positive Z axis.
    NORMAL_DIRECTION_POSITIVE_Z = 1;

    // Normal follows the coordinate system's negative Z axis.
    NORMAL_DIRECTION_NEGATIVE_Z = 2;
  }

  // The two-dimensional curve on which to choose the plane origin.
  Curve2Input curve = 1 [(buf.validate.field).required = true];

  // The coordinate system that lifts the curve into three dimensions.
  CoordinateSystem3Input coordinate_system = 2 [(buf.validate.field).required = true];

  // Where to evaluate the curve.
  CurveLocationDefinition location = 3 [(buf.validate.field).required = true];

  // Signed distance from the lifted curve point along the positive Z axis.
  ParametricExpression z_offset = 4 [(buf.validate.field).required = true];

  // Direction of the plane normal along the coordinate-system Z axis.
  NormalDirection normal_direction = 5 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
}

// Constructs a plane by offsetting an Isometry's origin in its local frame.
message PlaneUsingIsometryLocalOffsetDefinition {
  // Supported signed local axes for the plane normal.
  enum NormalDirection {
    // Plane normal direction not specified. This is invalid.
    NORMAL_DIRECTION_UNSPECIFIED = 0;

    // Plane normal aligns with positive X in the local coordinate frame.
    NORMAL_DIRECTION_POSITIVE_X = 1;

    // Plane normal aligns with negative X in the local coordinate frame.
    NORMAL_DIRECTION_NEGATIVE_X = 2;

    // Plane normal aligns with positive Y in the local coordinate frame.
    NORMAL_DIRECTION_POSITIVE_Y = 3;

    // Plane normal aligns with negative Y in the local coordinate frame.
    NORMAL_DIRECTION_NEGATIVE_Y = 4;

    // Plane normal aligns with positive Z in the local coordinate frame.
    NORMAL_DIRECTION_POSITIVE_Z = 5;

    // Plane normal aligns with negative Z in the local coordinate frame.
    NORMAL_DIRECTION_NEGATIVE_Z = 6;
  }

  // Placement whose translation and rotation define the local frame.
  motif.extension.v1.DataReference isometry = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.core.v1.Isometry"
    }
  ];

  // Signed local X offset from the Isometry origin.
  ParametricExpression local_offset_x = 2 [(buf.validate.field).required = true];

  // Signed local Y offset from the Isometry origin.
  ParametricExpression local_offset_y = 3 [(buf.validate.field).required = true];

  // Signed local Z offset from the Isometry origin.
  ParametricExpression local_offset_z = 4 [(buf.validate.field).required = true];

  // Direction of the plane normal in the Isometry's local frame.
  NormalDirection normal_direction = 5 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
}

// An authored method for constructing a cylindrical reference.
// Every construction method produces a cylinder in the local frame of the entity
// receiving the resolved `ReferenceGeometry`.
message CylinderDefinition {
  // The supported cylinder construction methods.
  oneof definition {
    option (buf.validate.oneof).required = true;

    // Construct a cylinder from a circular curve and radius offset.
    CylinderUsingCurveRadiusDefinition using_curve_radius = 1;
  }
}

// Constructs a cylinder from a circular `Curve2`.
//
// The curve center is lifted into three dimensions by `coordinate_system`, the
// coordinate system's Z axis becomes the cylinder axis, and `radius_offset` is
// added to the curve's radius.
message CylinderUsingCurveRadiusDefinition {
  // The circular two-dimensional curve.
  Curve2Input curve = 1 [(buf.validate.field).required = true];

  // The coordinate system that lifts the curve into three dimensions.
  CoordinateSystem3Input coordinate_system = 2 [(buf.validate.field).required = true];

  // Value added to the circular curve's radius.
  ParametricExpression radius_offset = 3 [(buf.validate.field).required = true];
}

// A concrete unbounded planar reference.
message UnboundedPlane {
  // A point on the plane.
  motif.data.geometry.v1.Point3 origin = 1 [(buf.validate.field).required = true];

  // The plane's normal.
  motif.data.geometry.v1.UnitVector3 normal = 2 [(buf.validate.field).required = true];

  // <add>Optional explicit in-plane u-axis. Set for faces whose hosted elements must align — a wall
  // opening's front mate face and the wall thickness face it seats on both carry it so the opening
  // stands upright with its width along the wall, independent of the wall's heading. When unset, the
  // frame derives the u-axis heuristically (fine where in-plane orientation does not matter).</add>
  motif.data.geometry.v1.UnitVector3 axis_u = 3;
}

// A concrete unbounded cylindrical reference.
message UnboundedCylinder {
  // A point on the cylinder axis.
  motif.data.geometry.v1.Point3 origin = 1 [(buf.validate.field).required = true];

  // The cylinder axis.
  motif.data.geometry.v1.UnitVector3 axis = 2 [(buf.validate.field).required = true];

  // The cylinder radius.
  double radius = 3 [(buf.validate.field).double.gt = 0];
}

// Authored recipe for an asset's derived 2D drawing geometry (`Geometry2d`).
// Each entry names one group of curves and either references existing curve
// data or constructs curves from the asset's resolved parameters.
message Geometry2dBehavior {
  option (motif.extension.v1.message).component = 175;

  // The authored entries. Names must be unique within this component; they
  // become the `Geometry2d.entries` map keys and must remain stable across
  // compatible recipe revisions. Uniqueness is not validated: on a name collision
  // the derived `map` keeps the last entry with that name and drops the earlier one
  // (and, since priority ties break by name, the survivor's draw order stays defined).
  repeated Geometry2dEntrySpec entries = 1 [(buf.validate.field).repeated.min_items = 1];
}

// One authored `Geometry2d` entry.
message Geometry2dEntrySpec {
  // Stable entry name; the `Geometry2d.entries` map key.
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // Visibility-policy classification of the produced curves. A type-less entry is
  // rejected: `defined_only` alone still admits `UNSPECIFIED` (0), so `not_in` excludes it.
  Geometry2dEntryType type = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Draw order within the 2D drawing layer. Larger values draw on top. Ties
  // are broken by entry name so rendering never depends on map iteration
  // order.
  uint32 priority = 3;

  // Where the entry's curves come from.
  oneof source {
    option (buf.validate.oneof).required = true;

    // Existing curve data, such as a literal `Curve2List` parameter value.
    motif.extension.v1.DataReference curves = 4 [(motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.Curve2List"
    }];

    // Curves constructed from resolved parameters.
    Geometry2dConstruction construction = 5;
  }

  // How the derived entry draws the source curves. Evaluators that predate
  // this field derive every entry as curves; evaluators that do not recognize
  // the value mark the entry FAILED.
  Geometry2dEntryShape shape = 6 [(buf.validate.field).enum.defined_only = true];
}

// How a `Geometry2d` entry draws its curves.
enum Geometry2dEntryShape {
  // The reader's default, which is `CURVES`.
  GEOMETRY2D_ENTRY_SHAPE_UNSPECIFIED = 0;

  // Linework: the derived entry carries the curves as `curves`.
  GEOMETRY2D_ENTRY_SHAPE_CURVES = 1;

  // A solid fill: the curves, in order, form one closed loop that becomes the
  // `exterior` of the derived entry's `region`. Writers mark the entry FAILED
  // when the curves do not close.
  GEOMETRY2D_ENTRY_SHAPE_REGION = 2;
}

// An authored construction producing one entry's curves and the local frame
// they live in.
message Geometry2dConstruction {
  // The frame the constructed 2D curves are expressed in.
  Geometry2dFrame frame = 1 [(buf.validate.field).required = true];

  // The constructed curves, in construction order.
  repeated Geometry2dCurveConstruction curves = 2 [(buf.validate.field).repeated.min_items = 1];
}

// How an entry's local 2D frame is derived.
message Geometry2dFrame {
  oneof source {
    option (buf.validate.oneof).required = true;

    // A frame in the owning asset's own coordinate system; each component is a
    // `ParametricExpression`, so it follows the resolved parameters and never
    // references a placement. A oneof (rather than a bare field) leaves room for
    // additional frame sources — e.g. a placement-projected plan frame — when a
    // consumer needs one.
    Geometry2dLocalFrame local = 1;
  }
}

// Three parametric expressions, used either as a point (a location) or as a
// direction. A direction is normalized at construction, so it need not evaluate
// to a unit vector.
message Vec3Expr {
  ParametricExpression x = 1 [(buf.validate.field).required = true];
  ParametricExpression y = 2 [(buf.validate.field).required = true];
  ParametricExpression z = 3 [(buf.validate.field).required = true];
}

// An owner-local frame built from parametric expressions (see `Geometry2dFrame`).
// The 2D curves live in the plane through `origin` spanned by `x_axis` and
// `z_axis × x_axis`; `z_axis` is the drawing plane's normal. The axes are
// direction vectors normalized at construction — they need not evaluate to unit
// vectors — so a frame may follow the resolved parameters; construction fails
// only when an axis evaluates to a degenerate (near-zero) vector. (They are
// expression `Vec3Expr`s rather than the literal `UnitVector3`s of
// `BuiltinAssetConfiguration.FrameExpr`, which deliberately forbids
// parameter-dependent axes.)
message Geometry2dLocalFrame {
  Vec3Expr origin = 1 [(buf.validate.field).required = true];
  Vec3Expr x_axis = 2 [(buf.validate.field).required = true];
  Vec3Expr z_axis = 3 [(buf.validate.field).required = true];
}

// One constructed 2D curve. Every scalar is a `ParametricExpression`, so the
// curve follows the instance's resolved parameters.
message Geometry2dCurveConstruction {
  oneof kind {
    option (buf.validate.oneof).required = true;

    // A line segment.
    Line2Construction line = 1;

    // A circular arc.
    Arc2Construction arc = 2;
  }
}

// A line segment between two expression-valued endpoints, in the entry frame.
message Line2Construction {
  ParametricExpression start_x = 1 [(buf.validate.field).required = true];
  ParametricExpression start_y = 2 [(buf.validate.field).required = true];
  ParametricExpression end_x = 3 [(buf.validate.field).required = true];
  ParametricExpression end_y = 4 [(buf.validate.field).required = true];
}

// A circular arc from expression-valued center, radius, and angles, in the
// entry frame. Angles are radians from the frame's +X axis; the arc sweeps
// from `start_angle` by `sweep_angle` (counterclockwise when positive), so a
// parameter-selected sign flips the sweep direction.
message Arc2Construction {
  ParametricExpression center_x = 1 [(buf.validate.field).required = true];
  ParametricExpression center_y = 2 [(buf.validate.field).required = true];
  ParametricExpression radius = 3 [(buf.validate.field).required = true];
  ParametricExpression start_angle = 4 [(buf.validate.field).required = true];
  ParametricExpression sweep_angle = 5 [(buf.validate.field).required = true];
}

// Derived 2D drawing geometry produced from an asset's `Geometry2dBehavior`.
// Entries are display linework and fills, not solid model geometry. Entries
// are keyed by the authored entry name; draw order is the entries' `priority`,
// not map iteration or encoding order.
message Geometry2d {
  option (motif.extension.v1.message).component = 176;

  // The derived entries, keyed by the authored entry name. Written only after the
  // behavior derives, so the component's presence with an empty map means the recipe
  // produced no entries — not "derivation pending"; per-entry `status` then
  // distinguishes a failed entry from a succeeded one.
  map<string, Geometry2dEntry> entries = 1;
}

// One derived `Geometry2d` entry.
message Geometry2dEntry {
  // Visibility-policy classification copied from the authored entry.
  Geometry2dEntryType type = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Draw order copied from the authored entry.
  uint32 priority = 2;

  // Whether this entry's geometry was generated from the current inputs.
  // `primitive` is unset unless the status is SUCCEEDED, so consumers never use
  // stale geometry produced from older input values.
  Geometry2dEntryStatus status = 3 [(buf.validate.field).enum.defined_only = true];

  // The local frame the 2D curves are expressed in, relative to the owning
  // entity. World placement is the owner's transform composed with this frame.
  // Present whenever `status` is SUCCEEDED (it always accompanies the curves) and
  // absent otherwise; a consumer must not draw a non-SUCCEEDED entry, so it never
  // composes an absent (degenerate, zero-axis) frame.
  motif.data.geometry.v1.CoordinateSystem3 frame = 4;

  // The drawable geometry. A reader that does not recognize the set member
  // does not draw the entry.
  oneof primitive {
    // Curves (open or closed), drawn as linework.
    motif.data.geometry.v1.Curve2List curves = 5;

    // A closed region, drawn as a solid fill with its boundary as linework.
    motif.data.geometry.v1.ClosedRegion2D region = 6;
  }
}

// Visibility-policy classification for `Geometry2d` entries.
enum Geometry2dEntryType {
  // Unspecified; consumers must not draw the entry.
  GEOMETRY2D_ENTRY_TYPE_UNSPECIFIED = 0;

  // Drafting/symbolic linework.
  GEOMETRY2D_ENTRY_TYPE_DETAIL = 1;

  // Model linework present in the model space.
  GEOMETRY2D_ENTRY_TYPE_MODEL = 2;
}

// Whether a derived `Geometry2d` entry matches its current inputs.
enum Geometry2dEntryStatus {
  // No generation result recorded; consumers must not use the entry.
  GEOMETRY2D_ENTRY_STATUS_UNSPECIFIED = 0;

  // The entry was generated from the current inputs.
  GEOMETRY2D_ENTRY_STATUS_SUCCEEDED = 1;

  // The entry could not be generated; `primitive` is unset.
  GEOMETRY2D_ENTRY_STATUS_FAILED = 2;
}

// Property-panel presentation for an asset's rows.
//
// Lives on the asset definition entity. Presentation places, orders, labels,
// and styles rows. It never grants writability and never changes what an
// edit means: a reader decides writability from its own model of the row
// (the row's editor and whether its value is computed), never from this
// component, so a wrong or stale entry degrades to a default rendering,
// never to a wrong edit.
//
// A row key names a row. An unqualified key is an emitter-owned reported key
// (for example "height" or "area") and never contains ":". A declared
// parameter is addressed as "parameter:<name>", where <name> is the
// parameter's key in the map
// `motif.data.model.v1.ParameterDeclarations.declarations`. This is the
// same catalog-qualified form as `LineStyle.pattern_ref` (split on the
// first ":"), so the two namespaces cannot collide. The pattern on
// `row_key` rejects a ":" in an unqualified key and every catalog other
// than "parameter". That reserves further catalogs and removes the need
// for an escaping rule.
//
// The component absent, or present with both lists empty, means every row
// gets the panel's default presentation. A row without an entry keeps the
// panel's default placement, after the listed rows of its group. A row key
// that names no row on the entity is ignored.
message PropertyPresentations {
  option (motif.extension.v1.message).component = 179;

  // The row entries. The list may interleave groups: a reader filters the
  // list per group and keeps relative order, so a group's rows need not be
  // contiguous. A reader may render a group's editable rows before its
  // read-only rows (writability is reader-derived, see above), so list
  // order is guaranteed only inside each half. List a group's editable
  // rows before its read-only ones and the written order holds in every
  // reader. Each `row_key` appears at most once: publish rejects
  // duplicates, and a reader that sees one uses the first entry.
  repeated RowPresentation rows = 1;

  // The composite entries. Each `composite_id` appears at most once, a row
  // key is a member of at most one composite, and a row key appears at
  // most once across a composite's pages: publish rejects all three, and a
  // reader that sees a duplicate uses the first occurrence.
  //
  // A member row renders inside its composite, not separately in its
  // group. A reader that does not recognize a `composite_id` renders the
  // members as ordinary rows in their own slots instead. Every member row
  // must belong to one group: publish rejects a composite whose member
  // rows disagree on group, and a reader that sees one claims the
  // composite per group, each group's members as their own unit.
  //
  // The composite occupies the panel slot of its first member row (for a
  // paged composite, the first key of the first page) and pulls the other
  // members to it, across the editable and read-only halves. If that
  // first member row has no entry in `rows`, the composite keeps the
  // panel's default placement. A member key that names no row on the
  // entity is ignored, and a composite whose member keys all name no row
  // renders nothing. Order inside the composite comes from the composite's
  // own member order, not from `rows`.
  repeated CompositePresentation composites = 2;
}

// Presentation of one property-panel row.
message RowPresentation {
  // The property-panel group a row renders in.
  //
  // The panel derives further groups of its own (for example for imported
  // foreign properties). Those never appear on the wire, which is why the
  // set is a closed enum rather than an open string.
  enum Group {
    // No group specified: the panel uses its default placement.
    GROUP_UNSPECIFIED = 0;

    // The `location` group.
    GROUP_LOCATION = 1;

    // The `size` group.
    GROUP_SIZE = 2;

    // The `options` group.
    GROUP_OPTIONS = 3;

    // The `classification` group.
    GROUP_CLASSIFICATION = 4;
  }

  // The row this entry presents: an unqualified reported key with no ":",
  // or "parameter:<name>". The pattern rejects every other catalog, which
  // reserves them.
  string row_key = 1 [(buf.validate.field).string.pattern = "^(parameter:.+|[^:]+)$"];

  // The group the row renders in.
  Group group = 2 [(buf.validate.field).enum.defined_only = true];

  // How the row's control is rendered.
  optional RowControl control = 3;

  // Replaces the display label the row would otherwise derive (a declared
  // parameter's description, or the reported key's built-in label).
  optional string label = 4;
}

// How a property-panel row's control is rendered.
message RowControl {
  // Where the row's label is placed relative to the control.
  enum LabelPlacement {
    // No placement specified: the panel uses its default.
    LABEL_PLACEMENT_UNSPECIFIED = 0;

    // The label is placed above the control.
    LABEL_PLACEMENT_ABOVE = 1;
  }

  // The widget used to render the row. The vocabulary is emitter-defined
  // and opaque to the platform: a reader that does not recognize the name
  // renders the default control for the row's value type.
  optional string widget = 1;

  // Where the row's label is placed.
  LabelPlacement label_placement = 2;
}

// Presentation of a composite the property panel dispatches on.
message CompositePresentation {
  // The composite id the property panel dispatches on.
  string composite_id = 1 [(buf.validate.field).string.min_len = 1];

  // The composite's display title.
  optional string title = 2;

  // The composite's members. A composite is flat or paged, never both and
  // always one of the two, so the shapes are a required `oneof`.
  oneof members {
    option (buf.validate.oneof).required = true;

    // Member row keys, for the composite kinds without pages.
    RowKeyList flat = 3;

    // Pages, for the paged composite kind.
    PageList paged = 4;
  }

  // An ordered list of member row keys.
  message RowKeyList {
    // The row keys, in display order.
    repeated string row_keys = 1 [(buf.validate.field).repeated.min_items = 1];
  }

  // An ordered list of pages.
  message PageList {
    // The pages, in display order. A paged composite has at least two
    // pages: with one page there is nothing to page, so publish collapses
    // a single page to the flat shape and `min_items` makes it
    // unrepresentable here.
    repeated Page pages = 1 [(buf.validate.field).repeated.min_items = 2];
  }

  // One page of a paged composite.
  message Page {
    // The page name shown on the pager.
    string name = 1 [(buf.validate.field).string.min_len = 1];

    // The row keys shown on this page, in display order.
    repeated string row_keys = 2 [(buf.validate.field).repeated.min_items = 1];
  }
}

// A stored relationship. `inputs` are the function's parameters, in order.
// `output` is the list of values the function writes, in result order: one
// value is the function's result, and more than one is a record with one
// field per output.
//
// When `member_cap` is set, the function returns either a count or a list of
// section poses, instead of `output`. A count copies `member_component_data`
// onto that many entities. A section pose is the plane normal to a curve:
// origin, X across the section, Z along the tangent. Regeneration copies the
// template and writes that pose as an Isometry, so a translation in the plane
// and a rotation about its normal are stored on the member. Indices from the
// list length, or the count, up to the cap are deleted. A count or a list
// past the cap fails the pass.
message CustomRegenerateBehavior {
  option (motif.extension.v1.message).component = 220;

  // The function's parameters, in order. Each reference may name a different
  // component, so a single expected type would reject a legal input.
  // buf:lint:ignore MOTIF_DATA_REFERENCE_MISSING_EXPECTED_TYPE
  repeated motif.extension.v1.DataReference inputs = 1;
  // The values the function writes, in result order. One value is the
  // function's result. More than one is a record with one field per output.
  // Unused when `member_cap` is set. Each reference may name a different
  // component, so a single expected type would reject a legal output.
  // buf:lint:ignore MOTIF_DATA_REFERENCE_MISSING_EXPECTED_TYPE
  repeated motif.extension.v1.DataReference output = 2;
  // The compiled regeneration function.
  bytes function = 3;
  // A human-readable description of the relationship.
  string description = 4;
  // When set, the function returns a count or a list of section poses instead
  // of `output`, and regeneration creates at most this many member entities.
  uint32 member_cap = 5;
  // The component copied onto each member when the function returns a count.
  int32 member_component_type = 6;
  // The component payload copied onto each member when the function returns a
  // count.
  bytes member_component_data = 7;
}

// A marker component identifying a space's area representation.
message SpaceAreaRepresentation {
  option (motif.extension.v1.message).component = 221;
}

// A marker component identifying a space's volume representation.
message SpaceVolumeRepresentation {
  option (motif.extension.v1.message).component = 222;
}

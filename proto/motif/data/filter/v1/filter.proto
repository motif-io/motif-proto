syntax = "proto3";

// Filter expressions select model entities.
//
// An unknown field, required oneof arm, enum value, component ID, or field
// path, a target index past the end of `targets`, or a source on the read of
// a computed value, makes the entire filter unreadable; it does not mean the
// filter matches nothing.
//
// Length, angle, and area operands use SI units: meters, radians, and square
// meters. Text equality, inequality, membership, containment, and prefix
// tests ignore case using Unicode simple case folding. Numeric comparisons
// use the display precision of the model that applies the filter for lengths,
// angles, and areas, so results can vary between models. Every test except
// `not_exists` fails for an entity with no value.
//
// Readers accept at least 32 levels of nesting in the expression, and
// computed values of at least 8 levels and 256 nodes, where each operation is
// a level. A read of a computed value inside another is a level too, and the
// nodes of the one it reads count toward the one that reads it.

package motif.data.filter.v1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "motif/extension/v1/options.proto";
import "motif/extension/v1/reference.proto";

// A saved filter expression.
message SavedFilter {
  option (motif.extension.v1.message).component = 229;

  FilterExpression expression = 1 [(buf.validate.field).required = true];
}

// A filter expression. Target indexes in the expression refer to `targets`.
message FilterExpression {
  FilterNode root = 1 [(buf.validate.field).required = true];

  repeated FilterTarget targets = 2 [(buf.validate.field).repeated.max_items = 5000];
}

// An entity named by a filter. The model reference scopes only this target.
message FilterTarget {
  // Unset to name the model itself.
  motif.extension.v1.EntityReference entity = 1;

  // Unset for the filter's own model. For a linked model, set to the version
  // seen by the author; readers resolve the entity in each loaded version so
  // the filter follows library upgrades.
  motif.extension.v1.ModelReference model = 2;
}

// A node of a filter expression.
message FilterNode {
  oneof node {
    option (buf.validate.oneof).required = true;

    // Matches entities matched by every node; an empty list matches all.
    FilterNodeList all = 1;
    // Matches entities matched by any node; an empty list matches none.
    FilterNodeList any = 2;
    FilterNode not = 3;
    // Matches the definitions of entities matched by the node.
    FilterNode definitions_of = 4;
    FilterCondition condition = 5;
    // Matches entities holding the persisted component with this ID.
    int32 has_component = 6 [(buf.validate.field).int32.gt = 0];
    FilterTargetIndexes entities = 7;
    // Matches entities whose placement path or source asset reaches the
    // target at this index.
    uint32 instances_of = 8;
  }
}

// The nodes of an `all` or an `any`.
message FilterNodeList {
  repeated FilterNode nodes = 1 [(buf.validate.field).repeated.max_items = 2000];
}

// The targets of an `entities` node.
message FilterTargetIndexes {
  repeated uint32 indexes = 1 [(buf.validate.field).repeated.max_items = 5000];
}

// A test of an entity property.
message FilterCondition {
  FilterPropertyRead read = 1 [(buf.validate.field).required = true];

  oneof op {
    option (buf.validate.oneof).required = true;

    google.protobuf.Empty exists = 2;
    google.protobuf.Empty not_exists = 3;
    FilterOperand eq = 4;
    FilterOperand ne = 5;
    FilterOperand lt = 6;
    FilterOperand le = 7;
    FilterOperand gt = 8;
    FilterOperand ge = 9;
    string contains = 10;
    string starts_with = 11;
    FilterOperandList any_of = 12;
  }
}

// The operands of an `any_of`.
message FilterOperandList {
  repeated FilterOperand operands = 1 [(buf.validate.field).repeated.max_items = 1000];
}

// A value that a condition compares with.
message FilterOperand {
  oneof value {
    option (buf.validate.oneof).required = true;

    string text = 1;
    double number = 2 [(buf.validate.field).double.finite = true];
    bool boolean = 3;
    // A target index, for a property whose value is a reference, such as a
    // level.
    uint32 target = 4;
    // An enum value by number, such as a Revit category or IFC class.
    int32 enum_number = 5;
  }
}

// A property and which of its values to read.
message FilterPropertyRead {
  FilterProperty property = 1 [(buf.validate.field).required = true];

  // Defaults to the effective value.
  FilterValueSource source = 2 [(buf.validate.field).enum.defined_only = true];
}

// The property that a condition reads.
message FilterProperty {
  oneof property {
    option (buf.validate.oneof).required = true;

    // A client-derived property key, such as `name` or `level`.
    string registered = 1 [(buf.validate.field).string.min_len = 1];
    FilterStoredField field = 2;
    FilterParameter parameter = 3;
    FilterForeignProperty foreign = 4;
    // A value computed from other properties. A read of one takes no source;
    // inside a computed value, it is the same value as its operation nested
    // in its place, and writers write the nested operation.
    FilterComputedValue computed = 5;
  }
}

// A value computed, not stored, from an entity's properties. It is read-only:
// a writer that edits through one, such as a table cell, writes a property
// that it reads. A parameter read means what it does in a condition; one that
// its asset does not declare has no value and takes any measure and kind.
//
// Arithmetic has no value when a read that it uses has no value or a value
// that is not a number, on division by zero, or when a result is not finite;
// to arithmetic, imported text has no value and an imported number with no
// measure is a plain number. Outside each `coalesce`, the entity then has no
// value.
//
// A result snaps, as a number in the SI unit of its measure: v becomes the
// whole number nearest v when that is within 64 × 2^-52 × max(1, |v|) of v;
// else the decimal with the fewest digits after the point that is within
// 64 × 2^-52 × |v| of v and has one digit after the point or at most 12
// significant digits; else it stays v. So 0.1 + 0.2 is 0.3.
//
// Measures must agree: values that read a property and are added or
// subtracted have one measure, and a product or quotient has the measure its
// parts make (model length × model length is an area; area / area is a plain
// number). Model length and paper length are separate measures. Arithmetic
// that reads a property that is not a number, or whose result is not a plain
// number, length, angle, or area, fails to compile; the filter stays
// readable.
//
// A plain value is text, a number, or a bool, as an imported property holds
// it: a length, angle, or area is its number in SI units, a color its
// `#rrggbb` text, and an enum value its name as the schema spells it, such as
// `REVIT_CATEGORY_DOORS`. As a plain value, a reference, or an enum value the
// reader does not know, has no value.
message FilterComputedValue {
  oneof value {
    option (buf.validate.oneof).required = true;

    // A property of the entity, read from the source that it names.
    FilterPropertyRead read = 1;
    // A number with no measure of its own: in a sum or difference it takes
    // the measure of the values it meets, in SI units (a width + 0.5 adds
    // 0.5 m); in a product or quotient it is a plain factor. A part of
    // literals alone, such as 2 × 3, acts as one literal, and a computation
    // of literals alone is a plain number.
    double literal = 2 [(buf.validate.field).double.finite = true];
    // The sum of the values.
    FilterComputedValues add = 3;
    // The first value minus the second.
    FilterComputedPair subtract = 4;
    // The product of the values.
    FilterComputedValues multiply = 5;
    // The first value divided by the second.
    FilterComputedPair divide = 6;
    // The least whole number at or above the value. Rounding is in the SI
    // unit of the value, after it snaps, and keeps its measure: `ceil` of an
    // area rounds up to whole square meters.
    FilterComputedValue ceil = 7;
    // The greatest whole number at or below the value, with the same unit,
    // snapping, and measure as `ceil`.
    FilterComputedValue floor = 8;
    // The nearest whole number, with the same unit, snapping, and measure as
    // `ceil`; halfway rounds away from zero.
    FilterComputedValue round = 9;
    // The first value, in order, that has a value; text that is empty or only
    // white space has none. When each value is a read of a property or a
    // `coalesce` that keeps its kind, all of one kind such as text or a
    // ratio, the result has that kind; else, when all have one measure, it
    // has that measure, which a literal among them takes as in a sum. Values
    // of two or more kinds, such as text and a literal, are plain values.
    // Arithmetic reads the number of a `coalesce`, and fails to compile over
    // one of a kind that holds no number, such as text.
    FilterComputedValues coalesce = 10;
  }
}

// The values of an `add`, a `multiply`, or a `coalesce`.
message FilterComputedValues {
  repeated FilterComputedValue values = 1 [(buf.validate.field).repeated = {
    min_items: 2
    max_items: 100
  }];
}

// The values of a `subtract` or a `divide`, in order.
message FilterComputedPair {
  FilterComputedValue left = 1 [(buf.validate.field).required = true];
  FilterComputedValue right = 2 [(buf.validate.field).required = true];
}

// A persisted component field, identified by component ID and field-number
// path so schema renames do not affect it.
message FilterStoredField {
  int32 component_id = 1 [(buf.validate.field).int32.gt = 0];
  motif.extension.v1.FieldPath path = 2 [(buf.validate.field).required = true];
}

// A parameter by name. With `asset`, that asset's parameter. With none, the
// parameter of that name on whichever asset each entity places: every asset
// that declares the name gives the same property, and declarations of
// different kinds read as plain values (see `FilterComputedValue`).
message FilterParameter {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // A target index. Unset reads the parameter on whichever asset each entity
  // places.
  optional uint32 asset = 2;
}

// An imported property, identified by the exact key written by the import.
message FilterForeignProperty {
  string key = 1 [(buf.validate.field).string.min_len = 1];
}

// Which value of an entity a condition reads.
//
// An own value is set on the element itself, including expressions and
// references, but not asset variant bindings. The effective value is the
// first available of the own value, the asset variant value, and the values
// along the placement path.
enum FilterValueSource {
  FILTER_VALUE_SOURCE_UNSPECIFIED = 0;
  FILTER_VALUE_SOURCE_OWN = 1;
  // The value of the definition: the root of the entity's first source asset,
  // else the asset at the end of its placement path. An entity with no
  // definition has no value.
  FILTER_VALUE_SOURCE_DEFINITION = 2;
}

// The messages in this file are unstable APIs. Motif makes no guarantees that
// these messages will continue to be supported.

syntax = "proto3";

package motif.data.values.v1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "motif/data/values/v1/scalar_value.proto";

// One concrete message or scalar value.
//
// This carrier preserves which kind of value was supplied. A containing slot or
// other consumer defines the expected type; references and collection membership
// are represented by that container.
message Value {
  oneof value {
    option (buf.validate.oneof).required = true;

    // An encoded protobuf message. Resolve its type_url to the registered,
    // fully qualified message name and validate its payload against that type.
    google.protobuf.Any message_value = 1;

    // A protobuf scalar with an explicitly selected primitive kind.
    ScalarValue scalar_value = 2;
  }
}

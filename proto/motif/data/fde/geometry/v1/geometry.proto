syntax = "proto3";

// Computational geometry hosts: curve-hosted points, point-driven curves,
// multi-rail surfaces, two-point bars, and point-hosted planes.
package motif.data.fde.geometry.v1;

import "buf/validate/validate.proto";
import "motif/data/geometry/v1/geometry.proto";
import "motif/extension/v1/options.proto";
import "motif/extension/v1/reference.proto";

// How a sequence of points becomes a curve.
enum CurveThroughPointsKind {
  // Unspecified curve kind.
  CURVE_THROUGH_POINTS_KIND_UNSPECIFIED = 0;
  // Piecewise linear segments through the points (2 points = a line).
  CURVE_THROUGH_POINTS_KIND_LINE = 1;
  // A circular arc through exactly three points.
  CURVE_THROUGH_POINTS_KIND_ARC = 2;
  // An interpolating NURBS spline through the points.
  CURVE_THROUGH_POINTS_KIND_SPLINE = 3;
}

// Which surface parameter an iso curve or curtain grid line holds fixed.
enum SurfaceIsoDirection {
  // Unspecified iso direction.
  SURFACE_ISO_DIRECTION_UNSPECIFIED = 0;
  // `u` fixed: the curve runs across the rails (along `v`).
  SURFACE_ISO_DIRECTION_U = 1;
  // `v` fixed: the curve runs along the rails (along `u`).
  SURFACE_ISO_DIRECTION_V = 2;
}

// Normalized parameter of a point hosted on a curve.
message CurveHostParam {
  option (motif.extension.v1.message).component = 202;

  // Normalized curve parameter in [0, 1].
  double t = 1 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
}

// Places a point on a host curve at a normalized parameter.
message CurveHostedPointBehavior {
  option (motif.extension.v1.message).component = 203;

  // The host curve geometry.
  motif.extension.v1.DataReference host_curve = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.Curve2"
    }
  ];

  // The normalized host parameter on the hosted point entity.
  motif.extension.v1.DataReference host_param = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.fde.geometry.v1.CurveHostParam"
    }
  ];

  // The entity the computed point is written to.
  motif.extension.v1.DataReference output = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.Point3"
    }
  ];
}

// A curve driven by an ordered sequence of Point3 entities.
message CurveThroughPoints {
  option (motif.extension.v1.message).component = 204;

  // The driver Point3 entities, in order.
  repeated motif.extension.v1.EntityReference points = 1 [(buf.validate.field).repeated = {
    min_items: 2
    max_items: 64
  }];

  // How the points become geometry. Unspecified is rejected; evaluation has no
  // default kind.
  CurveThroughPointsKind kind = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Interpolating spline order (degree + 1); read only for KIND_SPLINE.
  // Zero selects the default (3).
  uint32 order = 3;
}

// A surface lofted through one or more rail curves.
//
// One rail is extruded along `direction`, two rails are ruled, and three or
// more are a piecewise ruled loft.
message MultiRailSurface {
  option (motif.extension.v1.message).component = 205;

  // A single rail is an extrusion, so its direction has to leave the origin.
  // Two or more rails ignore `direction`.
  option (buf.validate.message).cel = {
    id: "multi_rail_surface.single_rail_direction"
    message: "a single rail needs a non-zero extrusion direction"
    expression: "this.rails.size() != 1 || this.direction.x != 0.0 || this.direction.y != 0.0 || this.direction.z != 0.0"
  };

  // The rail curve entities, in order.
  repeated motif.extension.v1.EntityReference rails = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 8
  }];

  // World-space extrusion vector in meters; read only when one rail is given.
  motif.data.geometry.v1.Vector3 direction = 2;
}

// An iso curve on a host that carries `MultiRailSurface`.
message SurfaceIsoCurve {
  option (motif.extension.v1.message).component = 206;

  // The host surface entity.
  motif.extension.v1.EntityReference surface = 1 [(buf.validate.field).required = true];

  // Which parameter is held fixed. Unspecified is rejected.
  SurfaceIsoDirection direction = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // The fixed parameter value, normalized to [0, 1].
  double param = 3 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
}

// Normalized `(u, v)` of a point hosted on a `MultiRailSurface`.
message SurfaceHostParam {
  option (motif.extension.v1.message).component = 207;

  // The host surface entity.
  motif.extension.v1.EntityReference surface = 1 [(buf.validate.field).required = true];

  // Normalized `u` along the rails, in [0, 1].
  double u = 2 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];

  // Normalized `v` across the rails, in [0, 1].
  double v = 3 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
}

// Resolved spine and placement frame for a bar between two points.
message ResolvedBarSweepInputs {
  option (motif.extension.v1.message).component = 208;

  // The bar's spine in its placement frame: a line from local (0,0) with
  // length equal to the node-to-node distance.
  motif.data.geometry.v1.Curve2 curve = 1;

  // The bar's placement frame: origin at the start node, local X toward the
  // end node, local Z the perpendicularized global up.
  motif.data.geometry.v1.CoordinateSystem3 coordinate_system = 2;
}

// Builds a bar between two point entities.
message TwoPointBarBehavior {
  option (motif.extension.v1.message).component = 209;

  // The start point.
  motif.extension.v1.DataReference start_point = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.Point3"
    }
  ];

  // The end point.
  motif.extension.v1.DataReference end_point = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.Point3"
    }
  ];

  // The entity the resolved bar sweep inputs are written to.
  motif.extension.v1.DataReference output = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.fde.geometry.v1.ResolvedBarSweepInputs"
    }
  ];
}

// A planar hosting surface.
//
// `surface` is the plane hosted geometry is placed on. When `curve`, `height`,
// and `coordinate_system` resolve, change propagation rebuilds that plane from
// them: origin at the curve start, u along the start tangent, v along the
// height. When they do not resolve, the authored plane is kept. Point hosts
// write a plane and leave those references unresolved.
message TrimmedHostingSurface {
  option (motif.extension.v1.message).component = 231;

  // The hosting plane. Unset decodes as the default plane at the origin.
  motif.data.geometry.v1.Plane surface = 1;

  // The host curve the plane is rebuilt from.
  motif.extension.v1.DataReference curve = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.Curve2"
    }
  ];

  // The host height the plane's v extent is rebuilt from, in meters.
  motif.extension.v1.DataReference height = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];

  // The placement frame the curve is lifted into.
  motif.extension.v1.DataReference coordinate_system = 4 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.CoordinateSystem3"
    }
  ];
}

// Names the `TrimmedHostingSurface` that makes an entity a host.
message HostBehavior {
  option (motif.extension.v1.message).component = 232;

  // The reference is to the whole surface component.
  option (buf.validate.message).cel = {
    id: "host_behavior.hosting_surface_path"
    message: "hosting_surface names the whole TrimmedHostingSurface, so path stays unset"
    expression: "!has(this.hosting_surface) || !has(this.hosting_surface.path)"
  };

  // The hosting surface on this entity.
  motif.extension.v1.DataReference hosting_surface = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.fde.geometry.v1.TrimmedHostingSurface"
    }
  ];
}

// Keeps a `TrimmedHostingSurface` plane attached to a host point.
//
// An isometry supplies the origin and rotates the authored axes. A `Point3`
// supplies the origin only, and the authored axes are used as written.
message PointHostedPlaneBehavior {
  option (motif.extension.v1.message).component = 223;

  // A zero cross product is a zero axis or a parallel pair.
  option (buf.validate.message).cel = {
    id: "point_hosted_plane_behavior.axes"
    message: "x_axis and z_axis must be non-zero and not parallel"
    expression: "this.x_axis.y * this.z_axis.z - this.x_axis.z * this.z_axis.y != 0.0 || this.x_axis.z * this.z_axis.x - this.x_axis.x * this.z_axis.z != 0.0 || this.x_axis.x * this.z_axis.y - this.x_axis.y * this.z_axis.x != 0.0"
  };

  // Origin, and rotation when the target is an isometry. The component id is
  // `motif.data.core.v1.Isometry` or `motif.data.model.v1.Point3`, so a single
  // expected type would reject one of those.
  // buf:lint:ignore MOTIF_DATA_REFERENCE_MISSING_EXPECTED_TYPE
  motif.extension.v1.DataReference host_transform = 1 [(buf.validate.field).required = true];

  // Local X of the plane, before the host rotation is applied.
  motif.data.geometry.v1.Vector3 x_axis = 2 [(buf.validate.field).required = true];

  // Local Z of the plane, before the host rotation is applied.
  motif.data.geometry.v1.Vector3 z_axis = 3 [(buf.validate.field).required = true];

  // Half-size of the plane domain on both axes, in meters.
  double half_extent = 4 [(buf.validate.field).double = {
    gt: 0
    finite: true
  }];

  // The `TrimmedHostingSurface` whose plane this behavior rewrites.
  motif.extension.v1.DataReference output_surface = 5 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.fde.geometry.v1.TrimmedHostingSurface"
    }
  ];
}

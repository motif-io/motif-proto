syntax = "proto3";

// Sketch-hosted objects: loop extrusion hosts (slabs / spaces), opening voids,
// and parametric wall openings.
package motif.data.fde.sketch_host.v1;

import "motif/data/geometry/v1/geometry.proto";
import "motif/extension/v1/options.proto";
import "motif/extension/v1/reference.proto";

// Which plane an opening void is interpreted in.
enum OpeningVoidPlane {
  // Unspecified opening plane.
  OPENING_VOID_PLANE_UNSPECIFIED = 0;
  // Horizontal (plan) void — typical slab / floor opening.
  OPENING_VOID_PLANE_HORIZONTAL_PLAN = 1;
  // Vertical face void — typical wall rough opening.
  OPENING_VOID_PLANE_WALL_ELEVATION = 2;
}

// How a wall opening is embedded on its host wall.
enum WallOpeningEmbedding {
  // Unspecified embedding.
  WALL_OPENING_EMBEDDING_UNSPECIFIED = 0;
  // Embedded via plan footprint parameters along the wall.
  WALL_OPENING_EMBEDDING_PLAN_FOOTPRINT = 1;
  // Embedded on an elevation face of the wall.
  WALL_OPENING_EMBEDDING_ELEVATION_FACE = 2;
}

// Host-relative placement for a wall-opening void (plan or elevation embedding).
message WallOpeningHostPlacement {
  // How the opening is embedded on the host wall.
  WallOpeningEmbedding embedding = 1;
  // Start parameter along the wall centerline.
  double t_start = 2;
  // End parameter along the wall centerline.
  double t_end = 3;
  // Minimum perpendicular offset from the wall centerline, in meters.
  double perp_min_m = 4;
  // Maximum perpendicular offset from the wall centerline, in meters.
  double perp_max_m = 5;
  // Sill height above the wall base, in meters.
  double sill_m = 6;
  // Opening height, in meters.
  double height_m = 7;
}

// Ordered sketch curve entities plus extrusion parameters for a closed-loop
// host (slab / space).
message SketchLoopExtrusion {
  option (motif.extension.v1.message).component = 144;

  // Ordered sketch-element entities that form the closed loop.
  repeated motif.extension.v1.EntityReference sketch_elements = 1;
  // Extrusion depth, in meters.
  double depth = 2;
  // Offset along the extrusion direction before the solid starts, in meters.
  double start_offset = 3;
  // Extrusion direction (typically the workplane normal).
  motif.data.geometry.v1.Vector3 direction = 4;
}

// Floor / ceiling / flat-roof slab marker; pairs with `SketchLoopExtrusion` on
// the same entity.
message Slab {
  option (motif.extension.v1.message).component = 145;
}

// Volume / space marker; pairs with `SketchLoopExtrusion` like `Slab`.
message SketchHostedSpace {
  option (motif.extension.v1.message).component = 146;
}

// Marker for an opening void on a wall or slab host.
message SketchHostedOpening {
  option (motif.extension.v1.message).component = 147;
}

// Cutter loop plus host-relative placement for a boolean void on one host
// entity.
message OpeningVoidBinding {
  option (motif.extension.v1.message).component = 148;

  // Ordered sketch-element entities that form the cutter loop, if present.
  repeated motif.extension.v1.EntityReference sketch_elements = 1;
  // Optional sketch container that owns the cutter elements.
  motif.extension.v1.EntityReference sketch_container = 2;
  // Closed boundary in host-local UV when the cutter is stored as points
  // rather than live sketch elements.
  repeated motif.data.geometry.v1.Point2 boundary_uv = 3;
  // Void depth, in meters.
  double depth_m = 4;
  // Optional wall-host placement when the void is wall-embedded.
  WallOpeningHostPlacement wall_host_placement = 5;
  // Plane the void is interpreted in.
  OpeningVoidPlane opening_plane = 6;
}

// Marker for a parametric wall opening.
message WallOpening {
  option (motif.extension.v1.message).component = 149;
}

// Placement parameters for a parametric wall opening on its host wall.
message WallOpeningPlacement {
  option (motif.extension.v1.message).component = 150;

  // Position along the wall centerline, in meters from the wall start.
  double position_along_wall = 1;
  // Sill height above the wall base, in meters.
  double sill_height_m = 2;
  // Opening width, in meters.
  double width_m = 3;
  // Opening height, in meters.
  double height_m = 4;
}

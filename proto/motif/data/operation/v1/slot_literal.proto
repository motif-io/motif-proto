// these messages will continue to be supported.

syntax = "proto3";

package motif.data.operation.v1;

import "buf/validate/validate.proto";
import "motif/data/values/v1/value.proto";

// An ordered sequence of concrete values stored in a binding or input default.
//
// The enclosing slot declaration supplies the element type and cardinality:
// ONE requires one member, ZERO_OR_ONE permits zero or one, and MANY permits any
// number. An empty literal explicitly supplies zero members. When used as an
// input binding, it suppresses the declaration default; omitting the binding
// instead requests default resolution. Values are successful data, not errors
// or references.
message SlotLiteral {
  // Up to 1,000 members in source order, each matching the enclosing slot's
  // element type.
  repeated motif.data.values.v1.Value members = 1 [(buf.validate.field).repeated.max_items = 1000];
}

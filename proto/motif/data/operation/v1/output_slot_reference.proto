// The messages in this file are unstable APIs. Motif makes no guarantees that
// these messages will continue to be supported.

syntax = "proto3";

package motif.data.operation.v1;

import "buf/validate/validate.proto";
import "motif/extension/v1/reference.proto";

// A reference to a named output slot of a particular operation invocation.
//
// It selects the whole slot, including all members of a MANY value. It does not
// select fields within a message or individual collection members. References to
// local invocations stay live even when an invocation's definition is pinned to
// an external model version.
message OutputSlotReference {
  // Required entity carrying OperationInvocation, resolved using EntityReference
  // model-scoping rules.
  motif.extension.v1.EntityReference invocation = 1 [(buf.validate.field).required = true];
  // Key in the invoked OperationDefinition.outputs.slots map.
  string output_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
  }];
}

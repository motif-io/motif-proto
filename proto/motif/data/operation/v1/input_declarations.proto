// The messages in this file are unstable APIs. Motif makes no guarantees that
// these messages will continue to be supported.

syntax = "proto3";

package motif.data.operation.v1;

import "buf/validate/validate.proto";
import "motif/data/operation/v1/input_slot_declaration.proto";
import "motif/extension/v1/options.proto";

// The named input interface of an operation definition.
//
// Each map entry declares the type, cardinality, and optional default for one
// input. An invocation supplies values through InputBinding records that name
// these entries. The declarations belong to the definition; bindings belong to
// its invocations.
message InputDeclarations {
  option (motif.extension.v1.message).component = 238;

  // Up to 250 input contracts. Keys are nonempty, case-sensitive slot names
  // of at most 50 characters. Map order does not specify argument or display order.
  map<string, InputSlotDeclaration> slots = 1 [(buf.validate.field).map = {
    max_pairs: 250
    keys: {
      string: {
        min_len: 1
        max_len: 50
      }
    }
  }];
}

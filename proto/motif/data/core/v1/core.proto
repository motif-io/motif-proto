syntax = "proto3";

// Core component types relevant across most, if not all, Motif models.
package motif.data.core.v1;

import "buf/validate/validate.proto";
import "motif/data/geometry/v1/geometry.proto";
import "motif/data/graphics/v1/graphics.proto";
import "motif/extension/v1/options.proto";
import "motif/extension/v1/reference.proto";

// A user-visible name for an entity that is auto-generated by the system, for
// example "Workplane 1".
message DefaultName {
  option (motif.extension.v1.message).component = 1;

  // The generated name.
  string name = 1;
}

// A user-visible name for an entity that was explicitly set by a user.
message AssignedName {
  option (motif.extension.v1.message).component = 2;

  // The user-assigned name.
  string name = 1;
}

// A direct isometry: a rotation followed by a translation (a rigid-body motion).
//
// This is also known as an element of a Special Euclidean (SE) group. An
// `Isometry` can represent either a 2D or 3D isometry, composed of a translation
// part and a rotation part.
message Isometry {
  option (motif.extension.v1.message).component = 3;

  reserved 1;

  // The translation part of the isometry.
  motif.data.geometry.v1.Vector3 translation = 2;
  // The rotation part of the isometry.
  motif.data.geometry.v1.AxisAngle rotation = 3;
}

// Indicates that this entity requires the target entity to exist. It must not be
// possible to delete the target entity while this relationship exists.
message Requires {
  option (motif.extension.v1.message).component = 23;

  // The entity that must exist. Required.
  motif.extension.v1.EntityReference target = 1 [(buf.validate.field).required = true];
}

// Indicates that this entity is a member of the target entity (e.g. a group or
// collection).
message Member {
  option (motif.extension.v1.message).component = 24;

  // The entity this entity is a member of. Required.
  motif.extension.v1.EntityReference target = 1 [(buf.validate.field).required = true];
}

// Marks an entity as an instance of another entity.
message Instance {
  option (motif.extension.v1.message).component = 25;

  // The entity being instantiated. Required.
  motif.extension.v1.EntityReference entity = 1 [(buf.validate.field).required = true];

  // Optional. When set, the instantiated entity is resolved against this model
  // and version rather than the instance's own model.
  motif.extension.v1.ModelReference model = 2;
}

// Links a derived entity back to the source entity it was projected from.
//
// Used by the floor-plan HLR pipeline: each per-(source, view) derived entity
// carries a `DerivedFrom` pointing at the source geometry entity.
message DerivedFrom {
  option (motif.extension.v1.message).component = 59;

  // The source entity this entity was derived from. Required.
  motif.extension.v1.EntityReference source = 1 [(buf.validate.field).required = true];
}

// Links a placement entity to the definition entity it presents (renders).
//
// The view-scoped analog of how an `Instance` points at its definition: a
// `DrawingContent` (motif.data.view.v1) carries a `Presents` at the definition
// it draws. Mirrors `DerivedFrom`'s single-`source` shape.
message Presents {
  option (motif.extension.v1.message).component = 127;

  // The definition entity this entity presents. Required.
  motif.extension.v1.EntityReference source = 1 [(buf.validate.field).required = true];
}

// The media type of a representation.
enum MimeType {
  // Unspecified MIME type.
  MIME_TYPE_UNSPECIFIED = 0;
  // image/jpeg.
  MIME_TYPE_JPEG = 1;
  // image/png.
  MIME_TYPE_PNG = 2;
  // application/pdf.
  MIME_TYPE_PDF = 3;
  // image/svg+xml.
  MIME_TYPE_SVG = 4;
  // model/obj.
  MIME_TYPE_OBJ = 5;
  // model/gltf-binary.
  MIME_TYPE_GLB = 6;
  // font/ttf
  MIME_TYPE_TTF = 7;
  // application/json
  MIME_TYPE_JSON = 8;
  // Opaque/non-renderable payload (spreadsheets, documents, arbitrary blobs).
  MIME_TYPE_UNKNOWN = 9;
  // text/markdown.
  MIME_TYPE_MARKDOWN = 10;
}

// The representation of an asset. Entities carrying this component reference a
// blob in the representation service that clients may fetch, decode, and
// (depending on the MIME type) render into the scene.
message Representation {
  option (motif.extension.v1.message).component = 4;

  // Identifier used to fetch the representation. Required.
  motif.extension.v1.RepresentationReference id = 1 [(buf.validate.field).required = true];
  // The MIME type of the representation.
  MimeType mime_type = 2;

  // The extension string (ex: `.rtf`), populated when `mime_type` is
  // `MIME_TYPE_UNKNOWN`
  string extension = 3;
}

// Marker component indicating the entity represents some form of asset.
//
// This needs to be detailed further and potentially should specify some form of
// type.
message Asset {
  option (motif.extension.v1.message).component = 5;
}

// A user comment attached to an entity.
message Comment {
  option (motif.extension.v1.message).component = 31;

  // The comment content.
  CommentContent content = 1;

  // The body of a comment.
  message CommentContent {
    // The comment text. More fields (e.g. styling) are expected in the future.
    string text = 1;
  }
}

// Renderable mesh geometry for an entity.
message Mesh {
  option (motif.extension.v1.message).component = 35;

  // The mesh geometry buffers.
  repeated motif.data.graphics.v1.Geometry data = 1;
}

// A single scalar value of one of several primitive types.
message ScalarValue {
  // The scalar value.
  oneof value {
    // A boolean value.
    bool bool_value = 1;
    // A signed 64-bit integer value.
    int64 int_value = 2;
    // A double-precision floating-point value.
    double double_value = 3;
    // A string value.
    string string_value = 4;
    // A raw byte-string value.
    bytes bytes_value = 5;
  }
}

// Arbitrary externally-sourced properties carried on an entity.
message ForeignProperties {
  option (motif.extension.v1.message).component = 38;

  // The properties, keyed by name.
  map<string, ScalarValue> properties = 1;
}

// A thumbnail representation for an entity.
message ThumbnailRepresentation {
  option (motif.extension.v1.message).component = 40;

  // Identifier used to fetch the thumbnail. Required.
  motif.extension.v1.RepresentationReference id = 1 [(buf.validate.field).required = true];
}

// How a type's values relate to the entity it is bound to.
enum BindingMode {
  // Unspecified binding mode.
  BINDING_MODE_UNSPECIFIED = 0;
  // The type's values were copied to the entity as a snapshot. The entity and
  // type are independent afterward.
  BINDING_MODE_APPLIED = 1;
  // The type's values are authoritative and propagate on change.
  BINDING_MODE_ASSIGNED = 2;
}

// Links an entity to its type definition (e.g. a View to its ViewType).
//
// See `BindingMode` for how the type's values relate to the entity.
message IsOfType {
  option (motif.extension.v1.message).component = 50;

  // The type entity this entity is an instance of. Required.
  motif.extension.v1.EntityReference type = 1 [(buf.validate.field).required = true];
  // How the type's values relate to this entity.
  BindingMode binding_mode = 2;
}

// 2D placed extent of content on a plane — position, size, rotation.
// On the placing entity, not the shared asset.
message Placement2d {
  option (motif.extension.v1.message).component = 156;

  motif.data.geometry.v1.Box2d placement = 1;
}

// Whether a resizable placement preserves its aspect ratio when resized.
// Generic across placement kinds — images today, other resizable placed
// objects later. Pairs with `Placement2d` on the placing entity, not the
// shared asset.
//
// Stamped as `STATE_LOCKED` when an object is placed: proportion locking is on
// by default. Locking preserves the placement's aspect ratio as it stands when
// a resize begins.
message AspectLock {
  option (motif.extension.v1.message).component = 177;

  State state = 1;

  // Whether resizing preserves the placement's current aspect ratio.
  enum State {
    // Unspecified. Read as `STATE_LOCKED` so the default holds for placements
    // that predate this component.
    STATE_UNSPECIFIED = 0;
    // Resizing preserves the current aspect ratio.
    STATE_LOCKED = 1;
    // Width and height resize independently.
    STATE_UNLOCKED = 2;
  }
}

// A marker component indicating an entity should be hidden from default UI
// views.
//
// When present on a model's sentinel entity
// (00000000-0000-4000-8000-000000000000), clients hide the model from default
// model lists — like a Unix dotfile. The model stays fully accessible to
// anything addressing it directly; the marker only affects default browsing
// surfaces.
//
// This marker says only "do not show me in default model lists". Models that
// store agent artifacts are usually hidden, but whether their artifacts are
// surfaced in agent-artifact UI is a separate question, answered by
// `motif.data.ai.v1.AgentArtifactStore` rather than by this component.
message Hidden {
  option (motif.extension.v1.message).component = 140;
}

// A marker component indicating that a model is a demo.
//
// Presence on the reserved model sentinel entity means the model is a demo; absence
// means it is not.
message DemoModel {
  option (motif.extension.v1.message).component = 181;
}

// Recorded at the time of model deletion or undeletion for audit/history purposes.
// Only expected to ever be present on model sentinel entities.
message ModelDeletionRecord {
  option (motif.extension.v1.message).component = 185;

  // Whether this was a deletion action or undeletion action.
  bool is_deletion = 1;
}

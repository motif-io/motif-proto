syntax = "proto3";

// View-related components and relationships: views, cameras, projection,
// clipping, and scale.
package motif.data.view.v1;

import "buf/validate/validate.proto";
import "motif/data/external/v1/categories.proto";
import "motif/data/filter/v1/filter.proto";
import "motif/data/geometry/v1/geometry.proto";
import "motif/data/style/v1/style.proto";
import "motif/extension/v1/options.proto";
import "motif/extension/v1/reference.proto";

// The behavioral classification of a view. Each kind has distinct rendering /
// camera behavior; views with no meaningful behavioral distinction (e.g.
// interior vs. exterior elevations, or model-derived vs. standalone details)
// share a single kind rather than introducing a subtype layer.
enum ViewKind {
  // 3 was VIEW_KIND_SECTION: sectioning is now a capability (SectionBox on any
  // view), not a distinct view kind.
  reserved 3;
  reserved "VIEW_KIND_SECTION";

  // Unspecified view kind.
  VIEW_KIND_UNSPECIFIED = 0;
  // A 3D view.
  VIEW_KIND_3D = 1;
  // A plan view.
  VIEW_KIND_PLAN = 2;
  // An elevation view.
  VIEW_KIND_ELEVATION = 4;
  // A callout view.
  VIEW_KIND_CALLOUT = 5;
  // A drafting view.
  VIEW_KIND_DRAFTING = 6;
  // Reflected ceiling plan: an upward-looking plan-family view. Distinct from
  // PLAN because its camera direction and view-range semantics differ.
  VIEW_KIND_RCP = 7;
}

// Distinguishes the documentation role of an elevation-family view (a view
// whose `ViewKind` is `VIEW_KIND_ELEVATION`). Elevations and sections share a
// single `ViewKind` because their camera/rendering behavior is identical; this
// field records the authoring intent so the UI can label and default them
// differently. Left `UNSPECIFIED` for views that are not elevation-family.
enum ElevationRole {
  // Not an elevation-family view, or the role is unknown.
  ELEVATION_ROLE_UNSPECIFIED = 0;
  // An exterior/interior elevation.
  ELEVATION_ROLE_ELEVATION = 1;
  // A section: an elevation-family view taken through a cut plane.
  ELEVATION_ROLE_SECTION = 2;
}

// Marks an entity as a view.
message View {
  option (motif.extension.v1.message).component = 41;

  // The kind of view.
  ViewKind kind = 1;

  // For elevation-family views (`kind == VIEW_KIND_ELEVATION`), whether the
  // view is authored as an elevation or a section. `UNSPECIFIED` for all other
  // view kinds.
  ElevationRole elevation_role = 2;
}

// A type definition for views. Carries the `ViewKind` and default parameter
// values that serve as starting values when a new view is created from this type.
//
// Deprecated: view definitions are constructed at runtime, not copied from persisted
// data, do not use.
message ViewType {
  option (motif.extension.v1.message).component = 42;
  option deprecated = true;

  // The kind of view this type produces.
  ViewKind kind = 1;
}

// Marker component identifying an entity as a view's camera.
//
// A member of a view entity, carrying `Isometry` and `Projection` components.
message Camera {
  option (motif.extension.v1.message).component = 43;
}

// Projection parameters for a camera.
message Projection {
  option (motif.extension.v1.message).component = 44;

  // The near clipping distance.
  double near_clip = 1;
  // The far clipping distance.
  double far_clip = 2;

  // The projection model and its parameters.
  oneof projection_params {
    // Perspective projection parameters.
    PerspectiveParams perspective = 3;
    // Orthographic projection parameters.
    OrthographicParams orthographic = 4;
  }

  // Parameters for a perspective projection.
  message PerspectiveParams {
    // Vertical field of view, in radians.
    double fov = 1;
  }

  // Parameters for an orthographic projection.
  message OrthographicParams {
    // Height of the visible area, in model units.
    double scale = 1;
  }
}

// Persisted lighting configuration for a camera.
message Lighting {
  option (motif.extension.v1.message).component = 45;

  // Whether shadows are enabled.
  bool shadows = 1;
}

// Per-view display settings for model edges: the crease and boundary linework
// derived from the view's shaded model geometry. Lives on the view entity.
//
// Absent from a view means model edges render with their default appearance,
// which is enabled. This component covers every non-cut edge. Cut-plane
// linework is `CutGeometry` and is not governed here; it is styled by
// `ViewStyle`. Plan hidden-line fill is `ProjectedGeometry` and is a separate
// derived payload.
message ModelEdges {
  option (motif.extension.v1.message).component = 157;

  // Whether model edges are drawn in this view.
  bool enabled = 1;

  // Stroke width of model edges, in logical screen pixels. Unset means the
  // renderer's default width.
  optional double width = 2 [(buf.validate.field).double.gt = 0];

  // Whether model edges are anti-aliased. Unset means the renderer's default,
  // which is anti-aliased.
  optional bool antialiased = 3;

  // Whether model edges are suppressed while the camera is moving, trading
  // edge fidelity for frame rate when navigating large models. When false,
  // edges stay drawn during navigation.
  bool hide_during_navigation = 4;

  // Stroke color of model edges. Unset means the renderer's default color.
  // Independent of the cut linework's color, which comes from `ViewStyle`.
  motif.data.style.v1.Color color = 5;

  // Optional integer pen index (Revit-style). When set, the renderer resolves
  // the on-paper width in mm from the project's pen-width table for the
  // active view's scale and ignores `width`. Unset (or 0) keeps the
  // screen-space `width`. Same meaning as `LineStyle.pen_size`.
  optional uint32 pen_size = 6;
}

// Defines a view's clipping bounds: the level-anchored planes that bound a
// plan-family view's depth slice, plus the depth-clipping switch that applies to
// every view kind.
//
// The planes are meaningful only for views whose depth is anchored to levels
// (plan and reflected ceiling plan). Views that take their depth from the camera
// instead — 3D, elevation and section — leave every plane unset and carry this
// component only for `depth_clipping`.
message ViewRange {
  option (motif.extension.v1.message).component = 46;

  // Top plane. Geometry above this is hidden.
  LevelOffset top = 1;

  // Cut plane. Geometry intersecting this plane is cut.
  LevelOffset cut_plane = 2;

  // Bottom plane. Geometry below this is hidden.
  LevelOffset bottom = 3;

  // Extends visibility beyond the bottom plane with a lighter line style.
  LevelOffset view_depth = 4;

  // Whether the view hides geometry beyond its clip plane — the far face of the
  // view box, opposite the cut plane the view slices at. Which plane that is
  // depends on the kind: the plane above furthest from the camera for
  // plan-family views, the camera's `Projection.far_clip` otherwise.
  //
  // When false the clip plane is retained but ignored, so the view renders to
  // the full depth of the model; the cut plane is unaffected either way. Unset
  // means the clip plane applies, which is how views behaved before this field
  // existed.
  optional bool depth_clipping = 5;
}

// The work plane a view drives placement from when nothing else overrides it.
// Lives on the view entity.
//
// Opening or activating a view makes this the session's active work plane, and
// clearing a selection-driven override restores it. Distinct from
// `motif.data.model.v1.DefaultWorkplane`, which marks the model-wide default
// rather than a per-view one.
//
// Only levels can be referenced for now; this widens to arbitrary saved work
// planes once those exist.
message ViewDefaultWorkplane {
  option (motif.extension.v1.message).component = 158;

  // The level acting as the view's default work plane. Required.
  motif.extension.v1.EntityReference level = 1 [(buf.validate.field).required = true];
}

// A position relative to a level: the level entity plus a vertical offset.
message LevelOffset {
  // The level entity this plane is relative to. Required.
  motif.extension.v1.EntityReference level = 1 [(buf.validate.field).required = true];

  // Offset from the level's elevation, in model units.
  double offset = 2;
}

// The drawing scale for a view. Defines the ratio between paper-space and
// model-space: 1 paper unit = `ratio` model units.
message ViewScale {
  option (motif.extension.v1.message).component = 47;

  // The paper-to-model ratio. Must be positive.
  double ratio = 1 [(buf.validate.field).double.gt = 0];
}

// Paper-size multiplier for the level, section, and elevation tags drawn in a
// view. Distinct from `ViewScale`: the drawing scale still converts paper to
// model, and this only changes how large those tags are on paper.
//
// Lives on the view the tags are drawn in. Absent means scale 1, matching tags
// authored before this component existed.
//
// Deprecated: this functionality covered by other components, do not use.
message ViewTagGraphics {
  option (motif.extension.v1.message).component = 186;
  option deprecated = true;

  // Multiplier on the tags' paper size, including labels. Must be positive.
  // 1 is today's size; 0.6 draws heads, marks, arrows, tails, and numbers at
  // 0.6 of that size.
  double scale = 1 [(buf.validate.field).double.gt = 0];
}

// Model-space dimensions of a section tag's displayed extent. The tag's
// transform supplies its center; its target view supplies the cut direction.
// Shared by every view displaying the tag, independently of the view crop.
message SectionTagExtent {
  option (motif.extension.v1.message).component = 228;

  // Length of the section line in plan views, in model units.
  double width = 1 [(buf.validate.field).double.gt = 0];

  // Length of the section line in elevation views, in model units.
  double height = 2 [(buf.validate.field).double.gt = 0];
}

// Graphic break in a section view's cut-line marker. Lives on the section view
// whose marker is broken, so the cut and crop remain unchanged. Absent means a
// continuous line. The two visible runs start at the head and tail and extend
// inward, leaving one gap between them; the gap grows or shrinks with the crop.
message SectionLineBreak {
  option (motif.extension.v1.message).component = 187;

  // Length from the head end toward the middle, in meters on paper. The host
  // view's tag-size multiplier does not change the cut line or its stubs.
  double head_stub_paper_length = 1 [(buf.validate.field).double.gt = 0];

  // Length from the tail end toward the middle, with the same units.
  double tail_stub_paper_length = 2 [(buf.validate.field).double.gt = 0];
}

// Appearance overrides for level datums drawn in this elevation or section view.
// Missing entries and fields inherit the model's placement and displayed extent.
message LevelTagOverrides {
  option (motif.extension.v1.message).component = 195;

  option (buf.validate.message).cel = {
    id: "level_tag_overrides.unique_levels"
    message: "each level may have at most one override in a view"
    expression: "this.entries.map(entry, entry.level.entity_id).unique()"
  };

  // At most one entry per level. Empty entries are omitted.
  repeated LevelTagOverride entries = 1;
}

// Appearance of one level's datum in the owning view. Does not change the level.
message LevelTagOverride {
  // The level being annotated, in the same model as the host view.
  motif.extension.v1.EntityReference level = 1 [(buf.validate.field).required = true];

  // Which heads and labels are visible. The datum remains when neither is shown.
  // Unset inherits model placement; an explicitly unspecified value is invalid.
  optional Ends ends = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];

  // Distances inward from the inherited displayed endpoints, in model meters.
  // Left and right are defined by the host view's horizontal axis. Crop changes
  // recompute the inherited endpoints; these distances remain unchanged.
  // If the trims exceed the available span, display them proportionally reduced
  // to retain a drawable line, without changing these authored distances.
  optional double left_trim = 3 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  optional double right_trim = 4 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];

  // Visible ends of a level datum, as seen in the host view.
  enum Ends {
    ENDS_UNSPECIFIED = 0;
    ENDS_LEFT = 1;
    ENDS_RIGHT = 2;
    ENDS_BOTH = 3;
    ENDS_NONE = 4;
  }
}

// A 3D oriented bounding box that clips the view's visible volume.
message SectionBox {
  option (motif.extension.v1.message).component = 48;

  // The box center, in model coordinates.
  motif.data.geometry.v1.Vector3 center = 1;
  // Half-extents along the box's local axes.
  motif.data.geometry.v1.Vector3 half_extents = 2;
  // Orientation of the box. If absent, the box is axis-aligned.
  motif.data.geometry.v1.AxisAngle rotation = 3;
  // Whether the box actively clips the view. When false the box is retained
  // but the view renders at full extent, so toggling sectioning off and back
  // on restores the authored box rather than requiring it to be redrawn.
  //
  // Presence-tracked: a box written before this field existed leaves it unset
  // and is treated as clipping, matching the behaviour those boxes were
  // authored under.
  optional bool enabled = 4;
}

// A 2D rectangle that clips the projected view to a bounded region.
message CropRegion {
  option (motif.extension.v1.message).component = 49;

  // Center of the crop region in the view's projected 2D space, in model units.
  motif.data.geometry.v1.Point2 center = 1;
  // Width and height of the crop rectangle, in model units.
  motif.data.geometry.v1.Size2 size = 2;
  // Optional rotation of the crop rectangle, in radians. Phase 0 ignores this.
  optional double rotation = 3;
  // Whether cropping is active. When false the rectangle is retained but the
  // view renders/exports at full extent. Independent of boundary_visible.
  bool enabled = 4;
  // Whether the crop boundary line is drawn in the view. Independent of
  // enabled: the boundary can be shown without clipping, or hidden while
  // clipping.
  bool boundary_visible = 5;
}

// Per-view visibility rules: the ordered overrides that decide which elements
// the view draws. Lives on the view entity.
//
// This component is legacy: readers still apply it, and `ViewFilterRules` on
// the same entity override it.
//
// Absent from a view means every element is visible. Rules are evaluated in
// order against each element and the last matching rule wins, so a broad hide
// can be narrowed by a later rule that shows a subset. An element that no rule
// matches is visible.
message VisibilityRules {
  option (motif.extension.v1.message).component = 174;

  // The rules, in evaluation order. Later rules win over earlier ones.
  repeated VisibilityRule rules = 1;

  // The lowest reader version that can evaluate every rule in `rules`. Bumped
  // when a rule uses a predicate variant that older readers cannot evaluate.
  //
  // A reader whose supported version is below this value must render the view
  // read-only and must not write this component back: rewriting it would
  // silently discard the rules the reader could not decode. Unset (0) is the
  // baseline, where `category` is the only predicate.
  uint32 min_reader_version = 2;

  // One override: which elements it selects, and how they are drawn.
  message VisibilityRule {
    // Which elements this rule selects. A `oneof` from the start so that
    // predicates over other ECS components are additive — adding an arm to an
    // existing `oneof` is wire-compatible.
    //
    // Unset means a variant this reader does not know: skip the rule, never
    // treat it as matching. An unknown predicate treated as matching would
    // select every element and hide the whole view.
    oneof predicate {
      // The element's Revit category matches.
      CategoryPredicate category = 1;
    }

    // Whether the selected elements are hidden. False is an explicit "show"
    // that overrides an earlier rule's hide, and is what an element no rule
    // matches gets, so this field needs no presence.
    bool hidden = 3;

    // Field-number allocation (the `predicate` oneof and the top-level fields
    // share this message's number space): 1 = `category`; 2 = the next
    // predicate arm; 3 = `hidden`; 4-6 = the per-category graphic overrides
    // that follow (line weight, color, line pattern). Those numbers are left
    // free rather than `reserved` because `buf breaking` counts dropping a
    // reservation as a breaking change, which would block ever using them.
  }

  // Selects elements whose resolved category is this category.
  //
  // Resolution is the reader's, not a single component lookup. An element
  // carrying `motif.data.external.v1.RevitCategoryValue` resolves to that
  // value; an element without one is classified from its own type (a
  // natively authored wall resolves to `WALLS`) or from imported IFC/Revit
  // metadata. Keying on a category rather than on that component is the
  // whole point: a wall is a wall whether it was authored natively or
  // imported, and only the former carries the component.
  message CategoryPredicate {
    // The category to select. `UNSPECIFIED` selects nothing.
    motif.data.external.v1.RevitCategory category = 1;
  }
}

// Sparse graphic exceptions owned by one view. This component does not change
// model styles, source entities, visibility, or other views. A missing property
// inherits from the next applicable resolution layer; resetting an exception
// removes the property or entry instead of copying the inherited value.
//
// Element exceptions take precedence over styles selected by ViewFilterRules.
// Unset properties inherit from the first matching view filter rule that sets
// a style, then from the model graphic style and the applicable source, legacy
// view, and built-in fallbacks. Annotations skip legacy view defaults. Cap fill
// remains in its existing view and element components.
message ViewGraphicOverrides {
  option (motif.extension.v1.message).component = 254;

  // The lowest reader version that understands every field and variant in
  // this component, including nested messages. Writers raise it when using a
  // newer field or variant. A reader below it must not apply or rewrite this
  // component, including when copying a view. Version 0 covers this schema.
  uint32 min_reader_version = 1;

  // Field 2 was used for filter bindings in an earlier draft.
  reserved 2;
  reserved "bindings";

  // At most one entry per source entity. Writers remove empty deltas. Entries
  // refer to stable entity IDs; replacing an entity with a new ID does not
  // transfer its exception.
  repeated ViewGraphicElementOverride elements = 3;
}

// One source entity's view-local sparse graphic exception.
message ViewGraphicElementOverride {
  // Source entity in the model containing the view. Cross-model element
  // references require a separate identity and versioning contract.
  motif.extension.v1.EntityReference source = 1 [(buf.validate.field).required = true];

  // Properties set for this source in the containing view.
  ViewGraphicDelta delta = 2 [(buf.validate.field).required = true];
}

// Independent sparse stroke exceptions for cut and projection graphics.
// Material application and fill properties are outside this component's scope.
message ViewGraphicDelta {
  // Cut stroke. Unset leaves all cut properties to the next layer.
  ViewGraphicStroke cut = 1;

  // Projection stroke. Unset leaves all projection properties to the next layer.
  ViewGraphicStroke projection = 2;
}

// Independently optional stroke properties. An absent property inherits.
message ViewGraphicStroke {
  // Pen-table index; an unset pen inherits.
  optional uint32 pen_size = 1 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 16
  }];

  // Explicit color. Black is a value and is distinct from an unset color.
  motif.data.style.v1.Color color = 2;

  // An unset pattern inherits. The named pattern "Solid" and an inline empty
  // cycle both explicitly select a continuous stroke.
  oneof pattern {
    // Built-in or catalog-qualified line pattern name.
    string pattern_ref = 3 [(buf.validate.field).string.min_len = 1];

    // Inline line pattern, in printed-paper units.
    motif.data.style.v1.LinePattern pattern_def = 4;
  }
}

// Per-view filter rules: the overrides that decide which elements the view
// draws and how it draws them. Lives on the view entity.
//
// The rules are in priority order: the first rule has the highest priority.
// An element's visibility comes from the first matching rule that sets one.
// Its style comes from the first matching rule that sets a `style`, and later
// rules do not fill gaps in that style. A rule that sets no visibility leaves
// visibility to later rules, and one that sets no `style` leaves the style to
// later rules.
//
// These rules override `VisibilityRules`: an element whose visibility no rule
// here sets is hidden or shown as `VisibilityRules` decide, and is visible when
// they do not. Their styles are a layer of the order in
// `motif.data.style.v1.GraphicStyleAsset`, below the per-(source, view)
// overrides and above the model's `motif.data.style.v1.GraphicStyleBindings`,
// so each property that the deciding rule's style leaves unset, or every
// property when no rule sets a style, comes from the first matching model
// binding and the layers below it.
//
// A writer of this component puts every new visibility edit here, including a
// category edit as a rule whose expression selects the category, and adds no
// rules to `VisibilityRules`. An edit adds or changes only the rules it is
// about and copies no rules from `VisibilityRules`. A copy of a view may carry
// the view's `VisibilityRules` unchanged. A new view that starts from another
// view's visibility may instead have no `VisibilityRules` and start here with
// that view's rules, followed by rules that hide what that view's
// `VisibilityRules` hide.
//
// A field added to this message or to a rule must not change what any rule
// decides for a reader that does not know it. A reader that finds an unknown
// field on this message, outside the rules, must not rewrite the component
// but may copy its bytes unchanged.
message ViewFilterRules {
  option (motif.extension.v1.message).component = 243;

  repeated ViewFilterRule rules = 1 [(buf.validate.field).repeated.max_items = 1000];

  // One override. A new way to select is a new filter node, which makes the
  // rule unreadable to older readers. A rule the reader cannot read, or whose
  // expression fails, such as through a saved filter that is missing or
  // unreadable, is skipped: it never matches. A malformed `style` makes the
  // whole rule unreadable, visibility included. A reader that skips a rule, or
  // finds an unknown field in it, must not rewrite the rule but may keep its
  // bytes unchanged, move it, or remove it.
  message ViewFilterRule {
    option (buf.validate.message).cel = {
      id: "view_filter_rule.effect"
      message: "a rule must set a visibility or a style"
      expression: "this.visibility != 0 || has(this.style)"
    };

    // Which elements this rule selects, in the scope of the view. Targets
    // with `model` unset name entities of the model that holds the view. A
    // rule that follows a saved filter, and so its edits, has an expression
    // whose root is a `saved_filter` node naming a
    // `motif.data.filter.v1.SavedFilter` of that model. A rule whose
    // expression names another model's saved filter is reserved for a later
    // version; readers skip it.
    motif.data.filter.v1.FilterExpression expression = 1 [(buf.validate.field).required = true];

    // A value the reader does not know makes the rule unreadable.
    ViewFilterVisibility visibility = 3;

    // The `motif.data.style.v1.GraphicStyleAsset` that the selected elements
    // are drawn with; an unset `model` means the model that holds the view.
    motif.data.style.v1.PinnedStyleAssetReference style = 4;
  }
}

// What a `ViewFilterRules` rule does to the visibility of the elements it
// selects.
enum ViewFilterVisibility {
  // Sets no visibility.
  VIEW_FILTER_VISIBILITY_UNSPECIFIED = 0;
  VIEW_FILTER_VISIBILITY_HIDE = 1;
  VIEW_FILTER_VISIBILITY_SHOW = 2;
}

// The result of projecting a source entity's geometry through a view's
// hidden-line-removal pipeline. Lives on per-(source, view) derived entities
// created by change propagation.
//
// Coordinates inside the payload are model-space XY with the source entity's
// transform baked in by the projection pipeline. Distinct from `CutGeometry`,
// which is MultiLineString cut-plane linework in view-space.
message ProjectedGeometry {
  option (motif.extension.v1.message).component = 64;

  // The encoded 2D geometry. A `oneof` so the encoding is part of the schema
  // (rather than sniffed from a magic byte) and so additional encodings can
  // be added later without breaking existing readers.
  oneof payload {
    // OGC Well-Known Binary, little-endian (byte order 0x01), MultiPolygon
    // (geometry type 6), 2D, no Z/M, no SRID. See
    // https://libgeos.org/specifications/wkb/.
    bytes wkb = 1;
  }

  // TODO: add styling fields here as the floor-plan UX evolves (stroke
  // colors / weights, line patterns, hatching, etc.).
}

// Persisted cut-plane linework for a source entity in a view. Lives on a
// derived entity that carries `motif.data.core.v1.DerivedFrom` (the source)
// and is a `motif.data.core.v1.Member` of the view — the same spine as
// `ProjectedGeometry`.
//
// Do not persist this component on the source, a content-library asset, or a
// cross-model `Instance`.
//
// This is stroked polylines, not a fill. It is not `ProjectedGeometry`
// (MultiPolygon plan fill in model-space XY). Not
// `motif.data.temporary.v1.Geometry2d` or
// `motif.data.temporary.v1.CutGeometryBehavior`. Cap fills are a separate
// derived mesh, styled by `ViewStyle` / `CapFillStyle`; this message has no
// style fields.
//
// Coordinates are view-space 2D in meters. `p` is a point in the view-owning
// model's world, with the source's instance transform already applied
// (cross-model sources are converted into that model first). Then
// `u = p·right` and `v = p·up`, where `right` and `up` are the view's
// orthonormal axes (camera local +X and +Y; the camera looks along local -Z).
// The 2D origin is that world's origin projected into the frame. Holes are not
// a first-class shape. A closed cut must repeat its start vertex as the last;
// an open cut must not.
message CutGeometry {
  option (motif.extension.v1.message).component = 178;

  // The encoded 2D linework. A `oneof` so the encoding is part of the schema
  // (rather than sniffed from a magic byte) and so additional encodings can
  // be added later without breaking existing readers.
  //
  // An unset `payload` is not valid geometry — readers must treat it as
  // missing. An empty MultiLineString (geometry type 5, count 0) means
  // generation ran and produced no linework. A zero-length `wkb` is neither
  // of those and must not be written.
  oneof payload {
    // OGC Well-Known Binary, little-endian (byte order 0x01), MultiLineString
    // (geometry type 5), 2D, no Z/M, no SRID. Nested LineStrings. See
    // https://libgeos.org/specifications/wkb/.
    bytes wkb = 1;
  }
}

// Per-view "default" styling applied to the view's derived outline and
// cut-plane cap-fill geometry. Each field is the default appearance for all
// entities rendered in the view; per-(source, view) outline / cap-fill style
// overrides still win when present.
message ViewStyle {
  option (motif.extension.v1.message).component = 111;

  // Default outline stroke: on-paper width plus an optional Revit-style pen
  // index resolved against the view scale at render time.
  motif.data.style.v1.LineStyle line_style = 1;

  // Default outline color.
  motif.data.style.v1.Color line_color = 2;

  // Default cut-plane cap-fill color.
  motif.data.style.v1.Color fill_color = 3;
}

// Persisted fill style for a per-(source, view) cut-plane cap-fill group.
//
// The derived cap-fill geometry is ephemeral (like outlines), but its style is
// user data and persists. Lives on a group entity identified by the
// (source, view) pair; the presence of this component is what distinguishes a
// cap-fill style group from an outline-style group (which carries `Color` /
// `LineStyle` instead) sharing the same relationship space.
message CapFillStyle {
  option (motif.extension.v1.message).component = 112;

  // Fill color for the cut-plane cap geometry of this (source, view).
  motif.data.style.v1.Color color = 1;
}

// The home (default) view of a model.
message HomeView {
  option (motif.extension.v1.message).component = 60;

  // The view entity that is the model's home view. Required.
  motif.extension.v1.EntityReference view = 1 [(buf.validate.field).required = true];
}

// Marks an entity as a sheet: an infinite paper-space canvas that composes
// views for documentation and export.
message Sheet {
  option (motif.extension.v1.message).component = 118;
}

// User-assigned sheet number (e.g. "A-101"). Optional on sheet entities.
message SheetNumber {
  option (motif.extension.v1.message).component = 159;

  // The user-assigned sheet number.
  string number = 1;
}

// The number identifying one placed view within its sheet (e.g. "3"), the
// detail half of the detail-over-sheet pair a view tag displays. Optional on
// the placement entity that makes a view a viewport — the sheet member that
// `motif.data.core.v1.Presents` a view — so the same view placed on two sheets
// carries one number per placement.
//
// Applications assign the number at placement and a user may override it.
// Numbers are not unique: two placements on one sheet can carry the same
// number.
message DetailNumber {
  option (motif.extension.v1.message).component = 164;

  // The number of the placed view within its sheet.
  string number = 1;
}

// A view/sheet-scoped, BIM-inert placement of content into a view — the
// view-scoped analog of `Instance` (motif.data.core.v1). A marker: what it
// renders is resolved from the definition it points at via
// `motif.data.core.v1.Presents`, then child-linked into the scene exactly as an
// `Instance` renders its definition.
message DrawingContent {
  option (motif.extension.v1.message).component = 126;
}

// Which plane a `DrawingContent` placement anchors to within its view. World Z
// is resolved against the owning view's `ViewRange`.
message DrawLayer {
  option (motif.extension.v1.message).component = 128;

  // The plane this drawing content anchors to.
  Layer layer = 1;

  // A drawing-content anchor plane.
  enum Layer {
    // Unspecified draw layer.
    LAYER_UNSPECIFIED = 0;
    // Beneath the model, at the view's bottom-of-range.
    LAYER_BACKGROUND = 1;
    // Above the model, at the cut plane.
    LAYER_FOREGROUND = 2;
  }
}

syntax = "proto3";

// Component types for persisted UIs: the saved surface, where an instance of it
// is placed, and what its actions are wired to.
package motif.data.ai.v1;

import "buf/validate/validate.proto";
import "motif/extension/v1/options.proto";
import "motif/extension/v1/reference.proto";

// A persisted UI: a durable, replayable surface (A2UI) that a user saved for
// reuse, instead of letting it expire with the chat turn that produced it.
//
// The component is the UI kind's marker: what kind of artifact the entity is
// follows from this component's presence — there is no scalar kind field.
// Retrieve a catalog with a Query scoped to the library model id and
// where_all_components = [151], selecting `AssignedName` and `UI` — listing
// never requires fetching a body.
//
// The `Agent` prefix is deliberately absent. `motif.data.ai.v1` is a home, not a
// claim about authorship: an agent is one way to author a UI, and a
// human-authored one carries this same component. `AgentSkill` keeps its prefix
// because a skill has no meaning outside an agent.
//
// A canonical UI is stored as an entity in a dedicated, `Hidden`-marked library
// model (the same pattern as `AgentSkill`), conventionally composed with:
//   - `AssignedName` — the UI's display name,
//   - `Representation` — the UI body: a normalized, replayable A2UI message
//     bundle (`MIME_TYPE_JSON`), not the raw token stream.
// Readers should tolerate the absence of either. Editing a UI uploads a new
// representation and updates the pointer; existing revisions stay readable, and
// model-local instances remain pinned to the revision they reference.
//
// The runtime declares how the body is validated and rendered. Saved bodies must
// be self-contained: no conversation secrets, credentials, transient run
// identifiers, or references to other Motif assets.
message UI {
  option (motif.extension.v1.message).component = 151;

  // How the UI body in `Representation` is validated and rendered.
  UIRuntime runtime = 1 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];

  // The A2UI specification version the body conforms to (e.g. "0.9").
  // Set when `runtime` is `UI_RUNTIME_A2UI`.
  string a2ui_version = 2 [(buf.validate.field).string.max_len = 32];

  // What the UI shows and when it is useful, in one or two sentences. Shown in
  // UI catalogs; not parsed from the body.
  string description = 3 [(buf.validate.field).string.max_len = 1024];
}

// The runtime a persisted UI targets. Finer distinctions within a runtime (e.g.
// the A2UI version) are fields on `UI`, and the body's media type comes from
// `Representation` — the runtime is not a general artifact discriminator.
enum UIRuntime {
  // Unspecified runtime.
  UI_RUNTIME_UNSPECIFIED = 0;
  // A declarative, replayable A2UI message bundle rendered by the host.
  UI_RUNTIME_A2UI = 1;
  // Reserved for a future sandboxed-iframe HTML runtime. Defined so the enum is
  // stable, but not accepted by any writer until that runtime clears its own
  // security review and feature gate.
  UI_RUNTIME_IFRAME_HTML = 2;
}

// Where a UI instance is shown in the host, and how the user gets to it.
//
// Placed on a model-local entity that also carries `Instance`, pinning it to a
// canonical `UI` in a library model. Placement is authoritative for host
// placement: the host mints the runtime surface id from it, and any surface id
// authored inside the saved body is a document-local label that is rewritten at
// instantiation.
//
// Three independent axes, deliberately kept in separate fields. `enabled`
// answers "does this instance participate in the model at all", the host slot
// answers "which part of the host renders it", and the reveal triggers answer
// "how does it get on screen" — a single mode field would conflate them and
// could not carry per-trigger data.
//
// Revealing and dismissing a surface is a display toggle over a persistent
// surface, not a create/delete cycle, and reveal state is ephemeral client state
// that is never written back here.
message UIPlacement {
  option (motif.extension.v1.message).component = 152;

  // Hard gate. A disabled instance never renders, whatever its triggers say.
  bool enabled = 1;

  // Which host slot renders the surface.
  UIHost host = 2 [(buf.validate.field).enum.defined_only = true];

  // Overrides the canonical UI's display name for this instance. Optional.
  string title = 3 [(buf.validate.field).string.max_len = 256];

  // How the surface gets on screen. Repeated because an instance can plausibly
  // want more than one route to it, e.g. a toolbar launcher and an automatic
  // reveal. An empty list means the instance is placed but never revealed.
  repeated RevealTrigger reveal = 4;
}

// The host slot a UI instance renders in.
//
// There is no inline value: chat-panel surfaces are scoped to an agent thread,
// hence to a user, and are never instantiated in a model.
enum UIHost {
  // Unspecified slot.
  UI_HOST_UNSPECIFIED = 0;
  // Floats over the editor canvas.
  UI_HOST_FLOATING_PANEL = 1;
  // Reserved for a docked side panel.
  UI_HOST_DOCKED_PANEL = 2;
  // Reserved for a popover anchored to a host toolbar.
  UI_HOST_TOOLBAR_POPOVER = 3;
}

// One way a UI instance's surface gets on screen.
//
// A oneof rather than an enum because the kinds carry different data: a launcher
// needs an icon and a toolbar group, while a future selection trigger would need
// a predicate. New kinds are additive arms.
message RevealTrigger {
  // The trigger kind.
  oneof trigger {
    // Reveal as soon as the model is opened.
    OnModelOpen on_model_open = 1;
    // Reveal when the user activates an affordance in the host chrome.
    Launcher launcher = 2;
  }
}

// Reveal as soon as the model is opened. Deliberately empty: a message rather
// than `google.protobuf.Empty` so it can grow fields without a schema break.
message OnModelOpen {}

// An affordance in the host chrome that reveals the surface when activated.
//
// A launcher occupies shared chrome rather than being opted into by whoever
// opens it, so sharing an instance that carries one is a broader grant than
// sharing a floating panel.
message Launcher {
  // Icon name from the host's A2UI catalog vocabulary (the set `IconButton`
  // accepts). Validated against that catalog when the placement is written.
  string icon = 1 [(buf.validate.field).string.max_len = 64];

  // Text shown alongside or instead of the icon.
  string label = 2 [(buf.validate.field).string.max_len = 128];

  // Host toolbar group the affordance belongs to.
  string group = 3 [(buf.validate.field).string.max_len = 64];

  // Sort position within `group`. Lower sorts first; ties are host-defined.
  int32 order = 4;
}

// Wires one action declared by a UI to the entity that action targets.
//
// One binding per entity, not a map on the UI instance. That is forced by
// reference scoping: a component carries at most one `ModelReference` and it
// governs every entity reference within it, so a map with a pin per entry cannot
// exist. The unit that can carry a pin is the component, and the unit that can
// carry a component is the entity. Splitting bindings across entities is what
// lets each one pin its own target version, and lets one UI instance drive a
// model-local target from one action and a library target from another.
//
// A binding entity lives in the same model as the UI instance it belongs to, and
// hangs off it with `Member`. Discover an instance's bindings with a
// model-scoped query for entities carrying both `ActionBinding` and `Member`,
// filtering on the member target; no traversal query is required.
//
// Uniqueness of `action` within one UI instance is not structural here — a map
// key gave that for free, one-entity-per-binding does not — so it is enforced
// when bindings are written.
//
// The target is referenced, never instantiated: binding a workflow places
// nothing in the UI instance's model. Compare `Instance`, which is what marks an
// actual instantiation.
message ActionBinding {
  option (motif.extension.v1.message).component = 153;

  // The action name declared by the UI body that this binding fires on. Unique
  // among the bindings of one UI instance.
  string action = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];

  // The entity this action targets. Its kind is its composition: a workflow
  // target is an entity carrying `Workflow`. There is no discriminator here, so
  // a future target of another kind needs no schema change.
  motif.extension.v1.EntityReference target = 2 [(buf.validate.field).required = true];

  // Optional. When set, `target` resolves against this library model at this
  // pinned version, and the binding stays frozen until it is explicitly
  // re-pinned. When unset, `target` is an entity in this binding's own model and
  // moves with that model's history.
  motif.extension.v1.ModelReference model = 3;
}

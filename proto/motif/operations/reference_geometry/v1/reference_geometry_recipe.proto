// The messages in this file are unstable APIs. Motif makes no guarantees that
// these messages will continue to be supported.

syntax = "proto3";

package motif.operations.reference_geometry.v1;

import "buf/validate/validate.proto";
import "motif/operations/geometry/v1/plane_recipe.proto";

// A recipe for one plane reference, combining geometric expressions with an
// identifier and descriptive metadata.
//
// The ID distinguishes this reference within its definition. The optional name
// is a human-readable label; priority provides ranking metadata for consumers.
message ReferenceGeometryRecipe {
  // Reference identity, unique within the containing definition. Preserve it
  // across evaluations to retain the reference's identity.
  uint32 id = 1;
  // Optional human-readable label, at most 50 characters, separate from the
  // reference identity.
  optional string name = 2 [(buf.validate.field).string.max_len = 50];
  // Ranking metadata; its interpretation is determined by the consumer.
  int32 priority = 3;
  // Required expressions defining the reference plane.
  motif.operations.geometry.v1.PlaneRecipe plane = 4 [(buf.validate.field).required = true];
}

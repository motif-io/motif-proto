syntax = "proto3";

package motif.extension.v1;

import "google/protobuf/type.proto";

// Describes a protobuf value type and cardinality. Consumers define which
// combinations they support and validate those constraints locally.
//
// Kind and cardinality reuse the enums nested in the well-known
// `google.protobuf.Field` (google/protobuf/type.proto). These are the proto3
// (open) equivalents of `FieldDescriptorProto.Type`/`Label`, sharing the same
// numbering, so they can be referenced directly from this proto3 file.
message TypeSpec {
  // Field cardinality.
  google.protobuf.Field.Cardinality cardinality = 1;

  // Scalar kind, or TYPE_MESSAGE/TYPE_ENUM for complex types.
  google.protobuf.Field.Kind kind = 2;

  // Fully-qualified message or enum name when kind is TYPE_MESSAGE or TYPE_ENUM.
  string type_name = 3;
}

syntax = "proto3";

// This package provides the ability to extend the Motif platform by defining
// new component data types.
//
// 1309 is the public extension number assigned to Motif by the protobuf
// maintainers. See
// https://github.com/protocolbuffers/protobuf/blob/main/docs/options.md
package motif.extension.v1;

import "google/protobuf/descriptor.proto";
import "motif/extension/v1/type.proto";

// Motif message options.
extend google.protobuf.MessageOptions {
  optional MotifMessageOptions message = 1309;
}

// Motif field options.
extend google.protobuf.FieldOptions {
  optional MotifFieldOptions field = 1309;
}

// Motif options applied to a message, via `option (motif.extension.v1.message)`.
message MotifMessageOptions {
  // Marks a message as a component type and defines its component ID.
  int32 component = 1;
}

// Motif options applied to a field, via `option (motif.extension.v1.field)`.
message MotifFieldOptions {
  // Declares the expected type for a DataReference field. Should be set on all
  // DataReference fields.
  TypeSpec data_reference_expected_type = 1;
}

syntax = "proto3";

package motif.api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "motif/data/external/v1/categories.proto";

// The persistence service stores model state and changeset history.
//
// All RPCs require authorization. Missing or malformed bearer tokens return
// UNAUTHENTICATED. Denied access returns PERMISSION_DENIED. Model-scoped RPCs
// return NOT_FOUND when the model cannot be resolved (example: GetChanges
// and RevertToVersion), unless otherwise stated (example: ApplyChangeset
// and ApplyChangesetStream).
//
// Fields named *_id with type bytes are 16-byte UUIDs in RFC 4122 byte order.
// Model IDs additionally reserve byte 0; it must be 0x00.
//
// buf:lint:ignore SERVICE_SUFFIX
service Persistence {
  // Deletes a model and its entities. Returns the deleted model id.
  rpc DeleteModel(DeleteModelRequest) returns (DeleteModelResponse);

  // Undeletes a previously deleted model. Returns the restored model id.
  rpc UndeleteModel(UndeleteModelRequest) returns (UndeleteModelResponse);

  // Lists models in a project. Each model includes its current changeset
  // version, and any sentinel-entity components the request selected.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);

  // Streams entities in a model.
  //
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc Query(QueryRequest) returns (stream VersionedEntityResponse);

  // Applies an atomic changeset.
  //
  // Errors: FAILED_PRECONDITION, with ErrorInfo reason UNKNOWN_COMPONENT_TYPE
  // (domain persistence.motif.io), when a component value or marker has a
  // component ID the server's component schema does not define; ErrorInfo
  // metadata `component_ids` lists them as comma-separated decimals. Deleting a
  // component is always accepted. A newly published component type is accepted
  // once every server has loaded the schema that defines it. INVALID_ARGUMENT
  // when a value of a component type that holds references does not decode, or
  // holds a reference that cannot be resolved (an ID that is not 16 bytes, a
  // DataReference with no target, or a ModelReference with a malformed ID or a
  // non-positive version). UNAVAILABLE when the component schema cannot be
  // loaded; retry.
  //
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc ApplyChangeset(Changeset) returns (ChangesetResponse);

  // Applies auxiliary components at an existing model version.
  //
  // This is to be used to apply data which is auxiliary to the primary changeset
  // data and must never be used to capture source data authored by or on behalf of
  // a user.  Auxiliary data are entirely reproducible from existing history
  // bounded entities’ components.
  //
  // This is to append additional, supplmentary data to an existing model version.
  // This write does not allocate a changeset version and is not to capture
  // model semantics.
  //
  // A test for whether to use this or ApplyChangeset is to consider if the
  // data is able to be entire regenerated without input from the author
  // (e.g. view thumbnails, mesh rendered from source definitions,
  // derived artifacts of uploaded documents, etc.).
  rpc ApplyAuxiliary(ApplyAuxiliaryRequest) returns (ApplyAuxiliaryResponse);

  // Lists changeset metadata for a model.
  //
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  rpc ListChangesets(ListChangesetRequest) returns (ListChangesetsResponse);

  // Lists a model's history as a timeline: one group per calendar day, with
  // runs of similar consecutive changesets collapsed into groups that can be
  // expanded. Supports filters, either sort order, and jumping straight to a
  // version or milestone. See ListChangesetsIndexRequest.
  //
  // Requires view access to the model. Errors: INVALID_ARGUMENT for a
  // malformed request, including an unknown time_zone, or a page_token or
  // parent_group_key that came from a different query. NOT_FOUND when
  // around_version is not a version of the model, or when GetMilestone would
  // return NOT_FOUND for around_history_bookmark_id. FAILED_PRECONDITION when
  // the around_version or around_history_bookmark_id target exists but the
  // filter excludes it, or it is not inside parent_group_key.
  rpc ListChangesetsIndex(ListChangesetsIndexRequest) returns (ListChangesetsIndexResponse);

  // Creates a milestone: a named pointer to one version of a model. See
  // Milestone.
  //
  // Requires edit access to the model. Errors: INVALID_ARGUMENT for a
  // malformed request, including an invalid name or description.
  // ALREADY_EXISTS when the name is taken (see CreateMilestoneRequest.name).
  // FAILED_PRECONDITION when the model is deleted, or target_version is higher
  // than the model's current version.
  //
  // If the call fails without a response, such as with DEADLINE_EXCEEDED or
  // UNAVAILABLE, the milestone may still have been created. Check
  // ListMilestones before retrying; a retry that returns ALREADY_EXISTS may
  // mean the first attempt succeeded.
  rpc CreateMilestone(CreateMilestoneRequest) returns (CreateMilestoneResponse);

  // Gets a milestone's current state.
  //
  // Errors: NOT_FOUND when the milestone does not exist in the model, has been
  // removed, or the caller cannot read it, including when the caller has no
  // view access to the model (see MilestoneVisibility). These cases are
  // deliberately not distinguished.
  rpc GetMilestone(GetMilestoneRequest) returns (GetMilestoneResponse);

  // Lists the milestones in a model that the caller can read: every public
  // milestone, plus the caller's own private ones. Removed milestones are not
  // listed.
  //
  // Requires view access to the model. Errors: INVALID_ARGUMENT for an invalid
  // page_size or before.
  rpc ListMilestones(ListMilestonesRequest) returns (ListMilestonesResponse);

  // Changes a milestone's name, description or target version, recording a
  // new revision. Fields left unset keep their current values.
  //
  // Requires edit access to the model. Errors: NOT_FOUND as for GetMilestone;
  // PERMISSION_DENIED only when the caller can read the milestone but not
  // change it. ABORTED when expected_revision is not the milestone's current
  // revision, even when the request would change nothing; the revision is
  // checked before anything else in the request. INVALID_ARGUMENT,
  // ALREADY_EXISTS and FAILED_PRECONDITION as for CreateMilestone.
  //
  // If the call fails without a response, call GetMilestone to see whether the
  // change was applied before retrying.
  rpc UpdateMilestone(UpdateMilestoneRequest) returns (UpdateMilestoneResponse);

  // Removes a milestone. Its name becomes available for reuse, and its
  // revisions stay readable through ListMilestoneRevisions. Removing a
  // milestone that is already removed succeeds and returns it unchanged.
  //
  // Requires edit access to the model. Errors: NOT_FOUND when the milestone
  // does not exist in the model or the caller cannot read it; PERMISSION_DENIED
  // only when the caller can read it but not change it. FAILED_PRECONDITION
  // when the model is deleted.
  rpc RemoveMilestone(RemoveMilestoneRequest) returns (RemoveMilestoneResponse);

  // Lists every revision of a milestone, newest first, including the revisions
  // of a removed milestone.
  //
  // Errors: NOT_FOUND when the milestone does not exist in the model or the
  // caller cannot read it, as for GetMilestone. INVALID_ARGUMENT for an invalid
  // page_size or before_revision.
  rpc ListMilestoneRevisions(ListMilestoneRevisionsRequest) returns (ListMilestoneRevisionsResponse);

  // Streams the diff between two model-history cursor positions.
  //
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetChanges(GetChangesRequest) returns (stream VersionedEntityResponse);

  // Applies a streamed changeset atomically.
  //
  // Errors: as ApplyChangeset.
  //
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc ApplyChangesetStream(stream ChangesetStream) returns (ChangesetResponse);

  // Creates a new changeset that restores the model to a prior version.
  rpc RevertToVersion(RevertToVersionRequest) returns (RevertToVersionResponse);

  // Creates a changeset that reverses the client-authored effect of one
  // prior changeset version while preserving later non-conflicting changes.
  rpc RevertOneChange(RevertOneChangeRequest) returns (RevertOneChangeResponse);

  // Streams last-changed metadata for a collection of models.
  rpc ModelDetail(ModelDetailRequest) returns (stream ModelDetailResponse);

  // Streams last-changed metadata for a collection of entities in one model.
  rpc EntityDetail(EntityDetailRequest) returns (stream EntityDetailResponse);

  // Streams the entities reachable from a set of root entities by following
  // references: EntityReference, DataReference, and ModelReference fields
  // (motif/extension/v1/reference.proto). See TraverseReferencesRequest.
  rpc TraverseReferences(TraverseReferencesRequest) returns (stream TraverseReferencesResponse);
}

// A single component value attached to an entity.
message Component {
  // The Component ID (aka type tag).
  int32 type_tag = 1;

  // The value of the component (can be empty if it's a tag/marker component).
  // If present, the `deleted` field cannot be present. If neither field is
  // present, the component is considered a tag/marker component.
  optional bytes value = 2;

  // Marks the component as deleted. If present, the `value` field cannot be present.
  optional google.protobuf.Empty deleted = 3;
}

// An entity and the set of component changes that apply to it.
message Entity {
  // The Entity ID this change applies to (`UUIDv4`).
  // Entity IDs are only unique within a model; different models can use the same entity IDs.
  // If you need to attach components to a model itself (e.g. for the name of the model), use
  // 00000000-0000-4000-8000-000000000000
  bytes entity_id = 1;

  // The components for this entity.
  // If non-empty, the `deleted` field cannot be present.
  repeated Component components = 2;

  // Marks the entity as deleted on the write path. If present, the `components` field cannot
  // be non-empty. Not set on the read path - for example, GetChanges will not set this field,
  // even if all components on an entity were deleted between `from_version` and `to_version`.
  optional google.protobuf.Empty deleted = 3;
}

// Identifies the model to delete.
message DeleteModelRequest {
  // Target model id. Globally unique across projects.
  bytes model_id = 1;
}

// Confirms which model was deleted.
message DeleteModelResponse {
  // Deleted model id. Globally unique across projects.
  bytes model_id = 1;
}

// Identifies the model to undelete.
message UndeleteModelRequest {
  // Target model id. Globally unique across projects.
  bytes model_id = 1;
}

// Confirms which model was undeleted.
message UndeleteModelResponse {
  // Undeleted model id. Globally unique across projects.
  bytes model_id = 1;
}

// Requests a page of models in a project.
//
// By default, deleted models are excluded.
// If desired, they can be obtained by passing `deleted_only`.
//
// `where_` fields are combined with a logical AND. An empty list disables that filter
// rather than excluding every model. Note that it is possible to create filters that
// logically exclude all models, such as adding the same component ID to the `all` and
// `none` fields. Such requests are accepted but return no models.
//
// Filters are applied prior to pagination, so only matching models contribute to the
// page size. A page token encodes only a position, so the same filters must be sent
// on the request for each page. Changing them mid-listing applies the position to a
// different result set, silently skipping or repeating models.
//
// `select_components` is a projection rather than a filter: it is applied after
// pagination and changes only what each returned model carries, never which models
// match or where a page boundary falls.
message ListModelsRequest {
  // Target project id.
  bytes project_id = 1;
  // Maximum models to return. Server chooses a default.
  optional uint32 page_size = 2;
  // Token from a previous ListModelsResponse.
  optional string page_token = 3;
  // The model sentinel entity ID must have all provided components.
  repeated int32 where_all_components = 4;
  // The model sentinel entity ID must have at least one provided component.
  repeated int32 where_any_components = 5;
  // The model sentinel entity ID must have none of the provided components.
  repeated int32 where_none_components = 6;
  // Returned component projection, read from each model's sentinel entity.
  // Empty returns no components, unlike `QueryRequest.select_components`.
  // Components selected but absent on a model are omitted from that model's
  // `components`; absence is the signal. Unrecognized component IDs select
  // nothing rather than failing the request.
  repeated int32 select_components = 7;
  // Return only deleted models
  bool deleted_only = 8;
}

// A page of models in a project.
message ListModelsResponse {
  // Target project id.
  bytes project_id = 1;
  // Collection of listed models.
  repeated Model models = 2;
  // Present when another page is available.
  optional string next_page_token = 3;
}

// One model in a project, including any components the request selected.
message Model {
  // Model id. Globally unique across projects.
  bytes model_id = 1;
  // The model's current committed version.
  int32 changeset_version = 2;
  // Components read from this model's sentinel entity, if selected in the
  // request. Empty when none were requested or none of those requested are
  // present. The `deleted` field of `Component` is not set on this read path.
  repeated Component components = 3;
}

// Streams entities in a model at latest state or as of a version.
//
// Component filters may be applied to select matching entities.
// select_components controls the returned projection.
message QueryRequest {
  // Target model id. Globally unique across projects.
  bytes model_id = 1;

  // When set, query state as of that version; otherwise, latest.
  optional int32 as_of_changeset_version = 2;

  // Returned component projection. Empty returns all components.
  repeated int32 select_components = 3;
  // Entity must have all provided components.
  repeated int32 where_all_components = 4;
  // Entity must have at least one provided component.
  repeated int32 where_any_components = 5;
  // Entity-id filter applied after component filters. Empty matches all entities.
  repeated bytes where_entity_ids = 6;
}

// Applies atomic entity changes for one model.
//
// The first changeset for a model creates it and binds it to project_id; later
// changesets must use the same project. Changes contains client changes;
// derived_changes contains system changes within the same version.
//
// Each stage rejects duplicate (entity_id, component_id) writes and entity
// deletes that conflict with same-stage component writes. changes and
// derived_changes are validated as separate stages. Duplicate-key violations
// return INVALID_ARGUMENT.
message Changeset {
  // Project id.
  bytes project_id = 1;

  // Model id. Globally unique across projects.
  bytes model_id = 2;

  // Highest changeset version known when the client produced the changeset
  // locally.
  int32 max_known_version = 3;

  // Client-authored entity changes. Within this stage each (entity_id,
  // component_id) may appear at most once, and an entity delete conflicts with
  // any same-stage component write for that entity.
  repeated Entity changes = 7;
  // System changes applied after client changes in the assigned version. This
  // stage uses the same duplicate-key rules as changes but is validated separately.
  repeated Entity derived_changes = 8;
}

// Requests changeset history for a model. Default: newest first.
message ListChangesetRequest {
  // Controls whether model history is listed before or after from_version.
  //
  // buf:lint:ignore ENUM_VALUE_PREFIX
  // buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
  enum Direction {
    // Lists at or below from_version, newest first.
    BEFORE_VERSION_INCLUSIVE = 0;

    // Lists after from_version.
    AFTER_VERSION_EXCLUSIVE = 1;
  }

  // Target model id. Globally unique across projects.
  bytes model_id = 1;
  // Controls whether model history is listed before or after from_version.
  Direction direction = 2;
  // Version from which changesets are listed with respect to direction.
  optional int32 from_version = 3;
  // Number of elements to return in each page. Default behavior is
  // server-defined. Values must be 1..500, else returns INVALID_ARGUMENT.
  optional uint32 page_size = 4;

  // Include complete stored results; default false. Unavailable or unreadable
  // results are omitted without failing metadata. If an enriched response
  // exceeds the configured message-size limit, retry with
  // `include_semantic_history=false`.
  bool include_semantic_history = 5;
}

// Metadata for one changeset in model history.
message ChangesetListItem {
  option (buf.validate.message).cel = {
    id: "changeset_list_item.semantic_stage_applicability"
    message: "a semantic result must include DERIVED exactly when has_derived is true"
    expression: "!has(this.semantic_history) || this.semantic_history.stages.exists(result, result.stage == 69) == this.has_derived"
  };

  // buf:lint:ignore ENUM_VALUE_PREFIX
  // buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
  enum ChangesetRace {
    // The client had seen the immediately prior version.
    NO_RACE = 0;

    // A version gap exists, but no changed entity overlapped.
    RACE_POSSIBLE = 1;

    // A version gap exists, and at least one changed entity overlapped.
    RACE_ENTITY_COLLISION = 2;
  }

  // Server-assigned version associated with the changeset.
  int32 version = 1;

  // User id that authored the client changes associated with the changeset.
  bytes author_id = 2;
  // Timestamp assigned when the changeset was recorded.
  google.protobuf.Timestamp created_at = 3;
  // True when this changeset includes derived changes within its version.
  bool has_derived = 4;

  // Present when this changeset was produced by RevertToVersion. Value is the
  // requested target version.
  optional int32 reverted_to_version = 5;

  // Classifies whether the created changeset's and concurrent changes touched
  // the same entities. Certain race conditions will be rejected by the server.
  ChangesetRace race = 6;

  // Complete result when requested and available. Empty stages are authoritative;
  // omission preserves retained facts.
  SemanticHistory semantic_history = 7;
}

// Complete facts for the enclosing version; replaces retained subsets.
message SemanticHistory {
  // Complete stage facts.
  message StageResult {
    option (buf.validate.message).cel = {
      id: "semantic_history.unique_entities"
      message: "entity changes must be unique within a stage"
      expression: "this.entity_changes.map(entity, entity.entity_id).unique()"
    };

    // CLIENT or DERIVED.
    Stage stage = 1 [(buf.validate.field).enum = {
      in: [
        10,
        69
      ]
    }];

    // Empty means a completed no-op.
    repeated EntityChange entity_changes = 2;
  }

  // Entity lifecycle and classifications.
  message EntityChange {
    // Lifecycle change.
    enum Verb {
      // Invalid.
      VERB_UNSPECIFIED = 0;
      // Created.
      VERB_CREATE = 1;
      // Updated.
      VERB_UPDATE = 2;
      // Deleted.
      VERB_DELETE = 3;
    }

    // Entity UUID.
    bytes entity_id = 1 [(buf.validate.field).bytes.len = 16];
    Verb verb = 2 [(buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }];
    // Independent assignments; empty can mean unclassified.
    repeated Classification classifications = 3;
    // May coexist with assignments; preserves unknown nonzero values.
    optional ClassificationIssue classification_issue = 4 [(buf.validate.field).enum.not_in = 0];
  }

  // Typed source assignment.
  message Classification {
    oneof assignment {
      option (buf.validate.oneof).required = true;

      // Preserves unknown nonzero values.
      motif.data.external.v1.RevitCategory revit_category = 1 [(buf.validate.field).enum.not_in = 0];
      // Exact source string.
      string ifc_class = 2 [(buf.validate.field).string.min_len = 1];
    }
  }

  // Missing classification evidence.
  enum ClassificationIssue {
    // Omit instead.
    CLASSIFICATION_ISSUE_UNSPECIFIED = 0;
    // Evidence unavailable.
    CLASSIFICATION_ISSUE_UNAVAILABLE = 1;
  }

  option (buf.validate.message).cel = {
    id: "semantic_history.unique_stages"
    message: "each persisted stage must appear once"
    expression: "this.stages.map(result, result.stage).unique()"
  };
  option (buf.validate.message).cel = {
    id: "semantic_history.client_stage"
    message: "a semantic result must include CLIENT"
    expression: "this.stages.exists(result, result.stage == 10)"
  };

  // CLIENT, plus DERIVED exactly when has_derived.
  repeated StageResult stages = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 2
  }];
}

// Changeset history page for a model.
message ListChangesetsResponse {
  // Page entries, ordered from newest to oldest.
  repeated ChangesetListItem changesets = 1;

  // True when more results exist in the requested direction.
  bool has_more = 2;
}

// Position of a change (client changes or otherwise) within a changeset version.
//
// buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
enum Stage {
  // Start boundary for a version cursor.
  STAGE_VERSION_BEGIN = 0;

  // Stage for changes submitted by a client.
  STAGE_CLIENT = 10;

  // Stage for system-derived changes in the version.
  STAGE_DERIVED = 69;

  // End boundary for a version cursor.
  STAGE_VERSION_END = 127;
}

// Requests a diff between two model-history cursor positions.
//
// A cursor is a (version, stage) pair. The response contains changes between
// the two cursors; direction changes how values are selected.
//
// Both from and to are exclusive; the response contains the diff for changes
// strictly between the two cursor positions. VERSION_BEGIN and VERSION_END are
// cursor boundaries and do not contain data.
//
// If wait is true and the client is current, the server long-polls; timeout
// returns an OK empty stream.
//
// When to > from, returns latest values for each changed entity component.
// When to < from, returns values as of "to" for each changed entity component.
message GetChangesRequest {
  // Target model id. Globally unique across projects.
  bytes model_id = 1;

  // Start version.
  int32 from_version = 2;

  // End version. Omit to use the current version, or to long-poll when wait is
  // true.
  optional int32 to_version = 3;

  // When true and to_version is unset, wait for a later committed version.
  // Timeout returns an empty stream.
  bool wait = 4;

  // Start stage. Defaults to STAGE_VERSION_END.
  optional Stage from_stage = 5;

  // End stage. Requires to_version when set. Defaults to STAGE_VERSION_END.
  optional Stage to_stage = 6;

  // Only return changes to these components. Empty matches all components.
  repeated int32 where_any_components = 7;

  // Entity-id filter, combined with the component filter (set intersection). Empty matches all entities.
  repeated bytes where_entity_ids = 8;
}

// Stream item containing either an entity or a changeset version.
message VersionedEntityResponse {
  // Either an entity or a changeset version.
  oneof payload {
    // Entity containing only changed components.
    Entity entity = 1;

    // Model-history version used for the returned data.
    int32 changeset_version = 2;
  }
}

// Result of applying a changeset.
message ChangesetResponse {
  // Project id.
  bytes project_id = 1;

  // Model id. Globally unique across projects.
  bytes model_id = 2;

  // Either the committed version or an application-level rejection.
  oneof result {
    // Server-assigned version of the committed changeset.
    int32 changeset_version = 3;

    // Reason the changeset was not committed.
    Error error = 4;
  }

  // Details about a conflict that caused the write to be rejected.
  // Populated when ERROR_CONCURRENT_ENTITY_UPDATE is returned.
  ConflictDetails conflict_details = 5;

  message ConflictDetails {
    // Entity IDs that were modified by the client _and_ also written to the server after the client's max_known_version.
    repeated bytes entity_ids = 1;

    // Model version current on the server when the conflict was detected.
    int32 server_version = 2;
  }

  // Explains why a syntactically valid changeset was not committed.
  enum Error {
    // No rejection reason was specified.
    ERROR_UNSPECIFIED = 0;

    // The client's model is out of date because an entity in the changeset
    // changed after max_known_version. ConflictDetails provides more details.
    ERROR_CONCURRENT_ENTITY_UPDATE = 1;

    // The payload contains an auxiliary data component.  Auxiliary data must use
    // ApplyAuxiliary.
    ERROR_AUXILIARY_COMPONENT_IN_PAYLOAD = 2;
  }
}

// Message in an ApplyChangesetStream request. Streamed changeset part: header,
// batch, or footer.
//
// A Footer explicitly completes the changeset. Closing without receipt of a
// Footer results in an unpersisted changeset.
message ChangesetStream {
  // Header, batch, or footer payload.
  oneof payload {
    // First stream message; identifies the target changeset.
    Header header = 1;

    // Carries one batch of entity changes.
    Batch batch = 2;

    // Required final message before half-close.
    Footer footer = 3;
  }

  // Target model/project and concurrency metadata for the streamed changeset.
  message Header {
    // Target project id.
    bytes project_id = 1;

    // Target model id. Globally unique across projects.
    bytes model_id = 2;

    // Highest version known when the client produced the streamed changeset.
    int32 max_known_version = 3;
  }

  // One ordered batch in a streamed changeset.
  //
  // Duplicate-key validation spans all batches in the stream, with changes and
  // derived_changes tracked as separate stages. Duplicate-key violations return
  // INVALID_ARGUMENT.
  message Batch {
    // Client-authored entity changes in this batch.
    repeated Entity changes = 1;

    // System-produced entity changes in this batch.
    repeated Entity derived_changes = 2;
  }

  // Empty message that marks the streamed changeset complete.
  message Footer {}
}

// Stores auxiliary components at one existing model version.
message ApplyAuxiliaryRequest {
  // Model id which bounds the auxiliary components.
  bytes model_id = 1;

  // Existing model version at which these auxiliary components are stored.
  // The write does not allocate a new changeset version.
  int32 version = 2;

  // Entities carrying the auxiliary components to store at `version`. Setting
  // `Component.deleted` removes that auxiliary component. Setting
  // `Entity.deleted` is rejected.
  repeated Entity auxiliaries = 3;
}

// Result of storing auxiliary components without committing a changeset.
message ApplyAuxiliaryResponse {
  // Model id.  This echoes the request model id.
  bytes model_id = 1;

  // Either the updated auxiliary snapshot or an application-level rejection.
  oneof result {
    // Model version whose auxiliary components were updated. This echoes the
    // request version and is not a newly allocated changeset version.
    int32 version = 2;

    // Reason the auxiliary components were not stored.
    Error error = 3;
  }

  // Explains why a syntactically valid auxiliary payload was not stored.
  enum Error {
    // No rejection reason was specified.
    ERROR_UNSPECIFIED = 0;

    // Model must exist
    ERROR_MODEL_DOES_NOT_EXIST = 1;

    // Version must exist
    ERROR_VERSION_DOES_NOT_EXIST = 2;

    // Entity must exist
    ERROR_ENTITY_DOES_NOT_EXIST = 3;

    // Only auxiliary components can be added
    ERROR_NON_AUXILIARY_COMPONENT_IN_PAYLOAD = 4;
  }
}

// Requests a new changeset which restores the model state at "latest" to a prior
// model version.
//
// The target must satisfy 1 <= revert_to_version < latest_version.
message RevertToVersionRequest {
  // Target model id. Globally unique across projects.
  bytes model_id = 1;

  // Concurrency metadata; must reflect the version of the model
  // upon which client changes were made.
  int32 max_known_version = 2;

  // Version whose state will be restored. Must satisfy
  // 1 <= revert_to_version < latest_version.
  int32 revert_to_version = 3;
}

// Identifies the version created by a revert.
message RevertToVersionResponse {
  // Server-assigned version of the revert changeset.
  int32 changeset_version = 1;
}

// Requests reversal of one client-authored changeset version.
message RevertOneChangeRequest {
  // Project containing the target model.
  bytes project_id = 1;

  // Target model id. Globally unique across projects.
  bytes model_id = 2;

  // Highest model version known to the caller.
  int32 max_known_version = 3;

  // Single history version whose client-authored effect should be
  // reversed. Must be between 1 and max_known_version, inclusive.
  int32 version_to_revert = 4;

  // Changeset versions in the caller's local undo/redo lineage. The list
  // must include version_to_revert, contain no duplicates, and contain only
  // versions between 1 and max_known_version, inclusive. Listed versions are
  // excluded from intervening-change conflict detection.
  repeated int32 undo_redo_lineage_versions = 5;
}

// Result of attempting to reverse one changeset version.
message RevertOneChangeResponse {
  // Applied reversal or detected conflict.
  oneof result {
    // The reversal was committed.
    RevertOneChangeApplied applied = 1;

    // The reversal conflicted with an intervening change.
    RevertOneChangeConflict conflict = 2;
  }
}

// Identifies the version created by a selective reversal.
message RevertOneChangeApplied {
  // Server-assigned version of the reversing changeset.
  int32 changeset_version = 1;
}

// Indicates that no changes were committed because the reversal
// conflicted with an intervening change.
message RevertOneChangeConflict {}

// Requests last-changed metadata for a collection of models.
//
// Models are resolved independently. A model with no committed changeset is
// omitted from the response rather than reported; absence is the signal.
// Response items may arrive in any order.
message ModelDetailRequest {
  // Target model ids. Globally unique across projects.
  repeated bytes model_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      bytes: {len: 16}
    }
  }];
}

// Last-changed metadata for one model.
message ModelDetailResponse {
  // Model id. Globally unique across projects.
  bytes model_id = 1 [(buf.validate.field).bytes.len = 16];

  // Highest committed version across every entity component in the model.
  int32 last_changed_version = 2 [(buf.validate.field).int32.gt = 0];

  // User id that authored the client changes in last_changed_version.
  bytes last_changed_by = 3 [(buf.validate.field).bytes.len = 16];

  // Timestamp recorded for last_changed_version.
  google.protobuf.Timestamp last_changed_at = 4 [(buf.validate.field).required = true];
}

// Requests last-changed metadata for a collection of entities in one model.
//
// Entity IDs are only unique within a model, so the request carries the model
// that scopes them. References are not followed: details for an entity in a
// referenced model must be requested against that referenced model id.
//
// Entities are resolved independently. An entity with no committed changeset is
// omitted from the response rather than reported; absence is the signal.
// Response items may arrive in any order.
message EntityDetailRequest {
  // Target model id. Globally unique across projects.
  bytes model_id = 1 [(buf.validate.field).bytes.len = 16];

  // Target entity ids, scoped to model_id.
  repeated bytes entity_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      bytes: {len: 16}
    }
  }];
}

// Last-changed metadata for one entity.
message EntityDetailResponse {
  // Entity id, scoped to the requested model id.
  bytes entity_id = 1 [(buf.validate.field).bytes.len = 16];

  // Highest committed version across all of the entity's components.
  int32 last_changed_version = 2 [(buf.validate.field).int32.gt = 0];

  // User id that authored the client changes in last_changed_version.
  bytes last_changed_by = 3 [(buf.validate.field).bytes.len = 16];

  // Timestamp recorded for last_changed_version.
  google.protobuf.Timestamp last_changed_at = 4 [(buf.validate.field).required = true];
}

// A model at a specific committed version.
message ReferencedModelVersion {
  // Model ID. Globally unique across projects.
  bytes model_id = 1 [(buf.validate.field).bytes.len = 16];

  // Model version.
  int32 model_version = 2 [(buf.validate.field).int32.gt = 0];
}

// Requests the part of the reference graph around a set of root entities.
//
// The graph's nodes are entities at a model version. Its edges are the
// references persistence extracts from component values when they are written:
// an edge points from the source entity, whose component holds the reference,
// to the target entity it references.
//
// ENTITY edges come from EntityReference fields. DATA edges come from
// DataReference fields; a `this_entity` target is the source entity itself.
// MODEL edges come from a set ModelReference that no entity reference resolves
// against (see motif.extension.v1.ModelReference); their target is the
// referenced model's sentinel entity (00000000-0000-4000-8000-000000000000).
//
// An ENTITY edge's target resolves in the ModelReference that scopes the
// reference, if one is set; otherwise in the source's model. A DATA edge's
// target resolves in the DataReference's own `model`, if set; otherwise in the
// source's model. A ModelReference never scopes a DataReference.
//
// Steps run in order, and each step starts from every entity reached so far:
// the roots plus the entities reached by earlier steps, unless the step sets
// `expand_previous_step_only`. An INBOUND step finds referrers among the host
// model's edges only; it never reads edges stored in other models. An OUTBOUND
// step follows each entity's edges in that entity's own model and crosses into
// other models, each of which must be viewable by the caller, unless the step
// sets `host_model_only`.
//
// There is no fixed limit on how many entities or models a traversal reaches,
// and results are never truncated: a traversal returns every entity it
// reaches, or fails. The server reads the graph in pieces of bounded size,
// however many entities a traversal reaches or edges any one of them has, so
// no request is refused for its size. The server limits how long the graph
// walk runs (see WALK_TOO_LONG below).
//
// Errors returned instead of a stream: NOT_FOUND when the host model does not
// exist. A deleted (archived) host model is traversed like any other.
// INVALID_ARGUMENT when the request is malformed.
//
// Errors that end the stream after the version header: UNAVAILABLE when a
// graph read exceeds the server's time limit for one read; retry with backoff.
// RESOURCE_EXHAUSTED, with ErrorInfo reason WALK_TOO_LONG (domain persistence.motif.io), when the
// graph walk runs past the server's time limit for a whole walk, from its
// start until its entities are ready to send. How long a walk takes depends on
// how busy the server is as well as on the graph, so a retry can succeed; a
// traversal that keeps failing this way must be narrowed. Other failures, such
// as an access check on another model that cannot be completed, also end the
// stream with their status.
message TraverseReferencesRequest {
  // An entity the traversal starts from.
  message Root {
    // Entity ID, scoped to `model`.
    bytes entity_id = 1 [(buf.validate.field).bytes.len = 16];

    // The model and version the entity lives in. When unset, the host model at
    // the version being traversed.
    ReferencedModelVersion model = 2;
  }

  // One traversal step.
  message Step {
    // Which way a traversal step follows edges.
    enum Direction {
      // Invalid.
      DIRECTION_UNSPECIFIED = 0;
      // From an entity to the entities that reference it.
      DIRECTION_INBOUND = 1;
      // From an entity to the entities it references.
      DIRECTION_OUTBOUND = 2;
    }

    // Matches edges by kind, by the component that holds the reference and, for
    // DATA edges, by the component the reference points at.
    message EdgeMatch {
      // The kind of reference an edge was extracted from.
      enum Kind {
        // Invalid.
        KIND_UNSPECIFIED = 0;
        // An EntityReference field.
        KIND_ENTITY = 1;
        // A DataReference field.
        KIND_DATA = 2;
        // A ModelReference that no reference resolves against.
        KIND_MODEL = 3;
      }

      // Kind of reference.
      Kind kind = 1 [(buf.validate.field).enum = {
        defined_only: true
        not_in: [0]
      }];

      // Component IDs (type tags) of the source components to match. When
      // empty, edges from any source component match.
      repeated int32 source_component_ids = 2;

      // Component IDs (type tags) of the target components to match: the
      // DataReference's `component_id`. When empty, edges into any component
      // match. Only valid with KIND_DATA; entity and model references do not
      // point at a component. On an INBOUND step, this selects the entities
      // that read particular components of the entities reached so far.
      //
      // When both component lists are set, an edge must match both. Each
      // entry contributes one term per source and target component pair (one
      // per component when only one list is set, one when neither is), and a
      // step's entries may contribute at most 10,000 terms; more is
      // INVALID_ARGUMENT.
      repeated int32 target_component_ids = 3;
    }

    // Direction to follow edges in.
    Direction direction = 1 [(buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }];

    // Edges to follow. An edge is followed when it matches any entry. When
    // empty, every ENTITY and DATA edge is followed. MODEL edges, which link to
    // a whole model, are followed only when explicitly specified.
    repeated EdgeMatch edges = 2;

    // Maximum number of hops. Zero follows edges until no new entities are
    // reached (the transitive closure).
    uint32 max_depth = 3;

    // Components returned for every entity this step reaches, including
    // entities an earlier step also reached. Projections that apply to the
    // same entity are combined.
    ComponentProjection projection = 4;

    // Only follow edges whose target resolves in the host model at the version
    // being traversed. Edges into other models or versions are treated as not
    // matching, so their targets are not returned and those models are not
    // listed in `omitted_models`. Roots and entities reached by earlier steps
    // in other models are still expanded: their own models' edges are read,
    // and the edges from them back into the host are followed. INBOUND steps
    // only ever return host entities, so this has no effect on them.
    bool host_model_only = 5;

    // Start from only the entities the previous step reached first, those no
    // root or earlier step had reached, instead of every entity reached so
    // far. For the first step, those are the roots. This lets a step continue
    // from a filtered step's results without also expanding what the filtered
    // step started from: an unfiltered INBOUND closure after an INBOUND hop
    // matching `target_component_ids` expands only the referrers that hop
    // found, not the roots again. Within its depth, the step still follows
    // edges through every entity it reaches, including ones reached earlier.
    bool expand_previous_step_only = 6;
  }

  // Host model ID. Requires View access.
  bytes model_id = 1 [(buf.validate.field).bytes.len = 16];

  // When set, traverse the graph as of that version; otherwise, latest. A
  // version past the current one is clamped to the current one, as in Query.
  optional int32 as_of_changeset_version = 2 [(buf.validate.field).int32.gt = 0];

  // Entities the traversal starts from.
  repeated Root roots = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10000
  }];

  // Components returned for the roots. Roots in a model the caller cannot view
  // are not returned. `edge_targets` is ignored, since no edge reaches a root.
  ComponentProjection root_projection = 4;

  // Traversal steps, run in order. With no steps, only the roots are returned.
  repeated Step steps = 5 [(buf.validate.field).repeated.max_items = 4];

  // Deprecated: ignored. A traversal has no limit on the entities it reaches.
  uint32 max_nodes = 6 [deprecated = true];
}

// Which components to return for traversed entities.
message ComponentProjection {
  // A set of component IDs (type tags).
  message ComponentIds {
    // Component IDs (type tags).
    repeated int32 ids = 1 [(buf.validate.field).repeated.min_items = 1];
  }

  // Components to return. When unset, no components are returned, only entity
  // IDs.
  oneof selection {
    // Return every component.
    google.protobuf.Empty all = 1;

    // Return these components.
    ComponentIds component_ids = 2;
  }

  // For OUTBOUND steps, also return the target component of every DATA edge
  // the step follows to the entity. Ignored for INBOUND steps and for
  // `root_projection`.
  //
  // A target component is returned like any other selected component: it
  // appears in the entity's `entity` and `selected_components`, and nothing
  // marks it as an edge target or identifies the reference that led to it. The
  // whole component is returned, even when the DataReference's `path` narrows
  // to a field within it.
  bool edge_targets = 3;
}

// One message of a TraverseReferences stream: the version header first, then
// the traversed entities in any order, then the summary last. Progress
// messages can arrive anywhere between the header and the summary. Entities
// are sent once the graph walk is complete, so every field of a
// TraversedEntity is final when it arrives; they stream as the caller reads
// them.
//
// Callers must ignore payloads they do not recognize, so that new kinds of
// message can be added to the stream without breaking them.
message TraverseReferencesResponse {
  // An entity reached by a traversal.
  message TraversedEntity {
    // The model and version the entity lives in. Always unset for the host
    // model at the version in the stream header, even when a root names that
    // model and version explicitly; set for every other model or version.
    ReferencedModelVersion model = 1;

    // The entity. `entity_id` is always set. `components` holds the entity's
    // live components selected by the projections that apply to it, and is
    // empty when the entity has none of them, including when a reference
    // points at an entity that does not exist.
    Entity entity = 2 [(buf.validate.field).required = true];

    // Component IDs the server looked up for this entity. Any ID listed here
    // but missing from `entity` is absent at this version.
    repeated int32 selected_components = 3;

    // The step that first reached the entity: 0 for roots, i for steps[i - 1].
    uint32 first_step = 4;

    // Steps (1-based, as in `first_step`) that enumerated all of this entity's
    // neighbours matching the step's edges. An entity reached at a step's
    // `max_depth` is returned without being expanded by that step.
    repeated uint32 expanded_steps = 5;
  }

  // Summary sent after the last traversed entity.
  message Summary {
    // A model a traversal reached but could not fully traverse.
    message OmittedModel {
      // Why the model was omitted.
      enum Reason {
        // Invalid.
        REASON_UNSPECIFIED = 0;
        // The model does not exist, or the caller cannot view it. These cases
        // are deliberately not distinguished. A deleted model is not omitted:
        // deletion is soft, so other models can keep referencing it.
        REASON_UNAVAILABLE = 1;
        // Deprecated: never sent. Every version of every model has a
        // reference index.
        REASON_NOT_INDEXED = 2 [deprecated = true];
        // The reference pins a version the model has never reached. Writes do
        // not check pinned versions, so this indicates a reference written
        // with a wrong version.
        REASON_VERSION_AHEAD = 3;
      }

      // The model and pinned version.
      ReferencedModelVersion model = 1;

      // Why the model was omitted.
      Reason reason = 2;
    }

    // Models a root or an OUTBOUND step reached but that could not be fully
    // traversed.
    repeated OmittedModel omitted_models = 1;
  }

  // Reports that the traversal is still running. A walk over a large graph
  // can take a long time before any entity is ready. While the traversal is
  // queued or walking the graph, the server sends one of these at least every
  // 30 seconds; this also keeps the connection active through proxies that
  // close idle connections. Progress messages can arrive anywhere between the
  // header and the summary. Callers must tolerate them, and may otherwise
  // ignore them.
  message Progress {
    // What the traversal is doing.
    enum Phase {
      // Invalid.
      PHASE_UNSPECIFIED = 0;
      // Waiting to start while the server runs other traversals.
      PHASE_QUEUED = 1;
      // Walking the graph.
      PHASE_WALKING = 2;
    }

    // Entities the walk has reached so far, roots included. It never
    // decreases, and consecutive messages can repeat it: it is zero while the
    // traversal is queued, and it holds steady through a long graph read. It
    // counts entities that will not be returned, such as roots in a model the
    // caller cannot view, so it can exceed the number of entities returned.
    uint64 entities_reached = 1;

    // What the traversal is doing. A queued traversal has not started its
    // walk, so the walk's time limit has not started either. Callers must
    // tolerate phases they do not recognize.
    Phase phase = 2;
  }

  // The message payload.
  oneof payload {
    // Host model version the traversal read.
    int32 changeset_version = 1;

    // One traversed entity. An entity is identified by its model, model
    // version, and entity ID, and each appears once, however many roots or
    // steps reach it. The same entity ID can appear again in another model or
    // at another version of the same model; that is a different entity. An
    // entity ID alone is therefore not unique within a response: to tell
    // entities apart, compare both `model` and `entity.entity_id`.
    TraversedEntity entity = 2;

    // Traversal summary.
    Summary summary = 3;

    // Progress of the graph walk.
    Progress progress = 4;
  }
}

// Requests one page of a model's history index.
//
// The index has up to three levels:
//
// 1. Days. One group per calendar day in time_zone that has at least one
//    changeset matching the filter. Omit parent_group_key to list days.
// 2. A day's entries: its changesets and repeated-edit groups. Send the day's
//    group_key as parent_group_key.
// 3. A repeated-edit group's changesets. Send the group's group_key as
//    parent_group_key.
//
// Days are ordered by date, and the entries within a day by version, newest
// first unless oldest_first is set.
//
// A repeated-edit group is a run of two or more consecutive changesets on the
// same day by the same author that each make the same kind of change (action)
// to entities, such as Revit elements, with the same classification. A
// changeset is listed on its own, never in a run, when it makes more than one
// kind of change or changes entities with different classifications, has no
// known classification (including while its semantic history is not yet
// available), was made by RevertToVersion, or has a milestone the caller can
// read pointing to it. The server limits the length of a run; a longer run is
// split into consecutive groups.
//
// Runs are formed from the whole history and then filtered: a run keeps its
// boundaries when the filter hides some of its changesets, and is omitted when
// it hides all of them.
//
// To jump to a version or milestone, set around_version or
// around_history_bookmark_id instead of page_token:
//
// 1. Request the days. The response's focus_group_path lists the keys of the
//    groups containing the target, the day first, and the page contains that
//    day.
// 2. For each key in focus_group_path, request again with that key as
//    parent_group_key and around_version set to the first response's
//    focused_version. Each page contains the next group on the path; the last
//    page contains the target changeset.
// 3. Use the response's page tokens to page in either direction from there.
//
// Every request reads current data, so results can change between pages, for
// example when a milestone moves. Page tokens and group keys are valid only in
// requests from the same caller with the same model_id, time_zone,
// oldest_first and filter as the request that returned them; a page token
// also requires the same parent_group_key.
message ListChangesetsIndexRequest {
  // Target model id. Globally unique across projects.
  bytes model_id = 1 [(buf.validate.field).bytes.len = 16];

  // IANA time zone name, such as "America/New_York", used to divide history
  // into calendar days. Required.
  string time_zone = 2 [(buf.validate.field).string.min_len = 1];

  // List oldest first. By default, newest first.
  bool oldest_first = 3;

  // Which changesets to list. Unset lists every changeset.
  HistoryIndexFilter filter = 4;

  // The day or repeated-edit group to list the entries of. Omit to list days.
  optional bytes parent_group_key = 5 [(buf.validate.field).bytes.min_len = 1];

  // Maximum entries to return, 1 to 500. Server chooses a default. The server
  // may return fewer, for example to keep the response within its size limit;
  // only an empty next_page_token means there are no more.
  optional uint32 page_size = 6 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 500
  }];

  // Where the page starts. Unset starts at the beginning, in the requested
  // order.
  oneof start {
    // A next_page_token or previous_page_token from an earlier response.
    bytes page_token = 7 [(buf.validate.field).bytes.min_len = 1];

    // Start at the page containing this version.
    int32 around_version = 8 [(buf.validate.field).int32.gt = 0];

    // Start at the page containing the version this milestone currently
    // points to.
    bytes around_history_bookmark_id = 9 [(buf.validate.field).bytes.len = 16];
  }
}

// Narrows which changesets the history index lists. A changeset must match
// every condition that is set. Conditions left unset or empty match every
// changeset.
message HistoryIndexFilter {
  option (buf.validate.message).cel = {
    id: "history_index_filter.time_order"
    message: "from_inclusive must be earlier than to_exclusive"
    expression: "!has(this.from_inclusive) || !has(this.to_exclusive) || this.from_inclusive < this.to_exclusive"
  };

  // Changesets authored by any of these users.
  repeated bytes author_ids = 1 [(buf.validate.field).repeated = {
    unique: true
    items: {
      bytes: {len: 16}
    }
  }];

  // Changesets recorded at or after this time (ChangesetListItem.created_at).
  // This is an exact instant, not a calendar date: to start at the beginning of
  // a day, send the first instant of that day in the request's time_zone.
  google.protobuf.Timestamp from_inclusive = 2;

  // Changesets recorded before this time. To include all of a day, send the
  // first instant of the following day in the request's time_zone.
  google.protobuf.Timestamp to_exclusive = 3;

  // Changesets that changed this entity.
  optional bytes entity_id = 4 [(buf.validate.field).bytes.len = 16];

  // Only changesets that have at least one milestone the caller can read
  // pointing to them.
  bool milestones_only = 5;

  // Whether entity_id also matches changesets in which only system updates
  // touched the entity. System updates are a version's system changes
  // (Changeset.derived_changes), applied after the author's changes. Defaults
  // to true. When false, a changeset matches entity_id only if the author's
  // changes include the entity. Has no effect without entity_id.
  optional bool include_system_updates = 6;
}

// One page of a model's history index.
message ListChangesetsIndexResponse {
  // Days, or the entries of parent_group_key, in the requested order.
  repeated HistoryIndexEntry entries = 1;

  // Token for the next page in the requested order. Empty on the last page.
  bytes next_page_token = 2;

  // Token for the page before this one. Empty on the first page.
  bytes previous_page_token = 3;

  // The version that around_version or around_history_bookmark_id resolved
  // to. Set only when the request used one of them.
  optional int32 focused_version = 4 [(buf.validate.field).int32.gt = 0];

  // Keys of the groups that contain focused_version, the day first. Set only
  // when focused_version is set, and always the full path, whichever level was
  // requested.
  repeated bytes focus_group_path = 5 [(buf.validate.field).repeated.items.bytes.min_len = 1];
}

// One entry in the history index: a group, or a single changeset.
message HistoryIndexEntry {
  // The kind of entry.
  oneof kind {
    option (buf.validate.oneof).required = true;

    // A day or a repeated-edit group. List its entries by sending its
    // group_key as parent_group_key.
    HistoryIndexGroup group = 1;

    // A single changeset.
    HistoryIndexChangeset changeset = 2;
  }
}

// A group of changesets that can be expanded.
message HistoryIndexGroup {
  // Identifies the group as parent_group_key in a later request.
  bytes group_key = 1 [(buf.validate.field).bytes.min_len = 1];

  // Number of changesets in the group that match the filter.
  uint32 matching_changeset_count = 2 [(buf.validate.field).uint32.gt = 0];

  // The kind of group.
  oneof kind {
    option (buf.validate.oneof).required = true;

    // A calendar day.
    HistoryIndexDay day = 3;

    // A run of similar consecutive changesets within a day.
    HistoryIndexRepeatedEdits repeated_edits = 4;
  }
}

// A calendar day in the request's time_zone.
message HistoryIndexDay {
  // The date, as YYYY-MM-DD.
  string local_date = 1 [(buf.validate.field).string.pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"];

  // Authors of the day's matching changesets, those with the most changesets
  // first. The server limits how many are listed.
  repeated bytes top_author_ids = 2 [(buf.validate.field).repeated = {
    unique: true
    items: {
      bytes: {len: 16}
    }
  }];

  // Milestones the caller can read that point to the day's matching
  // changesets, in the requested version order. The server limits how many are
  // listed; when fewer than matching_milestone_count are listed, expand the day
  // to see the rest.
  repeated HistoryIndexMilestone milestone_preview = 3;

  // Number of milestones the caller can read that point to the day's matching
  // changesets.
  uint32 matching_milestone_count = 4;
}

// A run of consecutive changesets by one author that each make the same kind
// of change to elements with the same classification. See
// ListChangesetsIndexRequest for how runs are formed.
message HistoryIndexRepeatedEdits {
  // The author of every changeset in the run.
  bytes author_id = 1 [(buf.validate.field).bytes.len = 16];

  // The kind of change every changeset in the run makes: create, update or
  // delete.
  SemanticHistory.EntityChange.Verb action = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // The classification, a Revit category or an IFC class, of the entities
  // every changeset in the run changes.
  SemanticHistory.Classification classification = 3 [(buf.validate.field).required = true];

  // Version of the run's first changeset, including changesets the filter
  // excludes.
  int32 first_version = 4 [(buf.validate.field).int32.gt = 0];

  // Version of the run's last changeset, including changesets the filter
  // excludes.
  int32 last_version = 5 [(buf.validate.field).int32.gt = 0];

  // When the run's first changeset was recorded, including changesets the
  // filter excludes.
  google.protobuf.Timestamp first_edit_at = 6 [(buf.validate.field).required = true];

  // When the run's last changeset was recorded, including changesets the
  // filter excludes.
  google.protobuf.Timestamp last_edit_at = 7 [(buf.validate.field).required = true];

  // True when any matching changeset in the run also has system updates
  // (ChangesetListItem.has_derived).
  bool has_system_updates = 8;
}

// One changeset in the history index.
message HistoryIndexChangeset {
  // The changeset. semantic_history is included when it is available and
  // small enough to return; otherwise it is left out and the rest of the
  // changeset is still returned.
  ChangesetListItem changeset = 1 [(buf.validate.field).required = true];

  // Milestones the caller can read that point to this changeset.
  repeated HistoryIndexMilestone milestones = 2;

  // One entry for each time a milestone the caller can read was moved from
  // this changeset to another version.
  repeated HistoryIndexMilestoneMove milestone_moves = 3;
}

// A milestone as listed in the history index. Call GetMilestone for its
// description and other details.
message HistoryIndexMilestone {
  // The milestone's id.
  bytes history_bookmark_id = 1 [(buf.validate.field).bytes.len = 16];

  // The milestone's current revision.
  int32 revision = 2 [(buf.validate.field).int32.gt = 0];

  // The version the milestone points to.
  int32 target_version = 3 [(buf.validate.field).int32.gt = 0];

  // The milestone's name.
  string name = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 48
  }];

  // Whether the milestone is public or private.
  MilestoneVisibility visibility = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// One move of a milestone away from the changeset it is listed on.
message HistoryIndexMilestoneMove {
  // The milestone that was moved.
  bytes history_bookmark_id = 1 [(buf.validate.field).bytes.len = 16];

  // The milestone revision that made the move.
  int32 revision = 2 [(buf.validate.field).int32.gt = 0];

  // The version the milestone was moved to. Later moves do not change it.
  int32 new_target_version = 3 [(buf.validate.field).int32.gt = 0];

  // The user who moved the milestone.
  bytes actor_user_id = 4 [(buf.validate.field).bytes.len = 16];
}

// Who can see a milestone. Set when the milestone is created and never
// changes.
enum MilestoneVisibility {
  // Invalid.
  MILESTONE_VISIBILITY_UNSPECIFIED = 0;

  // Anyone with view access to the model can read the milestone, and anyone
  // with edit access can change or remove it.
  MILESTONE_VISIBILITY_PUBLIC = 1;

  // Only the user who created the milestone can read it. They need view access
  // to the model to read it, and edit access to change or remove it. No other
  // user can read it, including owners of the model or project, although its
  // id and revision number appear in MilestoneChanged events sent to every
  // subscriber to the model.
  MILESTONE_VISIBILITY_PRIVATE = 2;
}

// The call that produced a milestone revision.
enum MilestoneOperation {
  // Invalid.
  MILESTONE_OPERATION_UNSPECIFIED = 0;

  // CreateMilestone. Always revision 1.
  MILESTONE_OPERATION_CREATE = 1;

  // UpdateMilestone.
  MILESTONE_OPERATION_UPDATE = 2;

  // RemoveMilestone. Always the milestone's last revision.
  MILESTONE_OPERATION_REMOVE = 3;
}

// A milestone: a named pointer to one version of a model, such as "Issued for
// permit". Creating or moving a milestone does not change the model or its
// changesets.
//
// Every create, update and removal records a new revision of the milestone,
// numbered from 1. Earlier revisions are kept and can be read with
// ListMilestoneRevisions. The same message describes a milestone's current
// state and each of its past revisions.
//
// Milestones belong to their model. RevertToVersion does not move or change
// them. Deleting the model with DeleteModel keeps its milestones; they can
// still be read, but cannot be created, changed or removed until
// UndeleteModel restores the model. Copying a project or model does not copy
// its milestones.
message Milestone {
  // The model the milestone belongs to.
  bytes model_id = 1 [(buf.validate.field).bytes.len = 16];

  // The milestone's id. Never reused, and kept after the milestone is removed.
  bytes history_bookmark_id = 2 [(buf.validate.field).bytes.len = 16];

  // This revision's number: 1 when the milestone is created, then one higher
  // for each change. Counts changes to this milestone only; unrelated to model
  // versions.
  int32 revision = 3 [(buf.validate.field).int32.gt = 0];

  // The user who created the milestone. Never changes.
  bytes creator_user_id = 4 [(buf.validate.field).bytes.len = 16];

  // Whether the milestone is public or private. Never changes.
  MilestoneVisibility visibility = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // When the milestone was created. Never changes; for when it last changed,
  // use recorded_at.
  google.protobuf.Timestamp created_at = 6 [(buf.validate.field).required = true];

  // The milestone's name. See CreateMilestoneRequest.name.
  string name = 7 [(buf.validate.field).string = {
    min_len: 1
    max_len: 48
  }];

  // The milestone's description. Empty when it has none.
  string description = 8 [(buf.validate.field).string.max_len = 500];

  // The model version the milestone points to.
  int32 target_version = 9 [(buf.validate.field).int32.gt = 0];

  // True once the milestone has been removed. A removed milestone keeps its id
  // and revisions, but no longer appears in GetMilestone, ListMilestones or the
  // history index.
  bool removed = 10;

  // The user who made this revision. On the current revision, this is who last
  // changed the milestone.
  bytes actor_user_id = 11 [(buf.validate.field).bytes.len = 16];

  // Set when the request that made this revision was authenticated with a
  // Motif-issued access token; identifies the client application that used it.
  // Opaque; recorded for attribution only, and never used to grant access.
  optional string actor_client_id = 12 [(buf.validate.field).string.min_len = 1];

  // When this revision was made. On the current revision, this is when the
  // milestone last changed.
  google.protobuf.Timestamp recorded_at = 13 [(buf.validate.field).required = true];

  // The call that made this revision.
  MilestoneOperation operation = 14 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// Requests a new milestone. The caller becomes its creator.
message CreateMilestoneRequest {
  // The model to add the milestone to.
  bytes model_id = 1 [(buf.validate.field).bytes.len = 16];

  // The milestone's name. Whitespace at either end, including tabs and line
  // breaks, is removed and the text is normalized to Unicode NFC; the result
  // must be 1 to 48 characters, counted as Unicode code points.
  // Capitalization is kept for display, but names are compared ignoring
  // case. A public milestone's name must differ from every other public
  // milestone in the model, and a private milestone's name from the creator's
  // other private milestones in the model; public and private names never
  // conflict. Removed milestones do not count, so their names can be reused.
  // A taken name returns ALREADY_EXISTS.
  string name = 2 [(buf.validate.field).string.min_len = 1];

  // A longer description, up to 500 characters. Omit or leave empty for none.
  optional string description = 3 [(buf.validate.field).string.max_len = 500];

  // The model version to point to. Must not be higher than the model's current
  // version.
  int32 target_version = 4 [(buf.validate.field).int32.gt = 0];

  // Whether the milestone is public or private. Required; cannot be changed
  // later.
  MilestoneVisibility visibility = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// The created milestone.
message CreateMilestoneResponse {
  // The new milestone, at revision 1.
  Milestone milestone = 1 [(buf.validate.field).required = true];
}

// Requests one milestone.
message GetMilestoneRequest {
  // The model the milestone belongs to.
  bytes model_id = 1 [(buf.validate.field).bytes.len = 16];

  // The milestone's id.
  bytes history_bookmark_id = 2 [(buf.validate.field).bytes.len = 16];
}

// The requested milestone.
message GetMilestoneResponse {
  // The milestone's current revision.
  Milestone milestone = 1 [(buf.validate.field).required = true];
}

// A position in a model's milestone list, which is ordered by creation time,
// newest first.
message MilestoneCursor {
  // The creation time (Milestone.created_at) of the milestone at this
  // position.
  google.protobuf.Timestamp created_at = 1 [(buf.validate.field).required = true];

  // The id of the milestone at this position, which orders milestones created
  // at the same time.
  bytes history_bookmark_id = 2 [(buf.validate.field).bytes.len = 16];
}

// Requests a page of a model's milestones.
message ListMilestonesRequest {
  // Target model id. Globally unique across projects.
  bytes model_id = 1 [(buf.validate.field).bytes.len = 16];

  // Maximum milestones to return, 1 to 500. Defaults to 100.
  optional int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 500
  }];

  // Return the milestones after this position. Omit for the first page; for
  // later pages, send next_before from the previous response. Milestones
  // created after the first page was read are not returned on later pages.
  MilestoneCursor before = 3;
}

// A page of a model's milestones.
message ListMilestonesResponse {
  // The current revision of each milestone, most recently created first.
  repeated Milestone milestones = 1;

  // True when another page is available.
  bool has_more = 2;

  // The position of the last milestone on this page; send it as before to
  // get the next page. Set only when has_more is true.
  MilestoneCursor next_before = 3;
}

// Requests a change to a milestone. Set only the fields to change.
message UpdateMilestoneRequest {
  // The model the milestone belongs to.
  bytes model_id = 1 [(buf.validate.field).bytes.len = 16];

  // The milestone's id.
  bytes history_bookmark_id = 2 [(buf.validate.field).bytes.len = 16];

  // The revision the change is based on, normally the one last read. If the
  // milestone has changed since, the update is rejected with ABORTED: read it
  // again and retry. Required.
  int32 expected_revision = 3 [(buf.validate.field).int32.gt = 0];

  // A new name, under the rules of CreateMilestoneRequest.name. A name cannot
  // be cleared.
  optional string name = 4 [(buf.validate.field).string.min_len = 1];

  // A new description, up to 500 characters. An empty string clears it.
  optional string description = 5 [(buf.validate.field).string.max_len = 500];

  // A model version to move the milestone to. Must not be higher than the
  // model's current version.
  optional int32 target_version = 6 [(buf.validate.field).int32.gt = 0];
}

// The milestone after an update.
message UpdateMilestoneResponse {
  // The milestone's new revision. When the request changes nothing, no revision
  // is recorded and the current one is returned.
  Milestone milestone = 1 [(buf.validate.field).required = true];
}

// Requests removal of a milestone.
message RemoveMilestoneRequest {
  // The model the milestone belongs to.
  bytes model_id = 1 [(buf.validate.field).bytes.len = 16];

  // The milestone's id.
  bytes history_bookmark_id = 2 [(buf.validate.field).bytes.len = 16];
}

// The removed milestone.
message RemoveMilestoneResponse {
  // The milestone's final revision, with removed set.
  Milestone milestone = 1 [(buf.validate.field).required = true];
}

// Requests a page of a milestone's revisions.
message ListMilestoneRevisionsRequest {
  // The model the milestone belongs to.
  bytes model_id = 1 [(buf.validate.field).bytes.len = 16];

  // The milestone's id.
  bytes history_bookmark_id = 2 [(buf.validate.field).bytes.len = 16];

  // Maximum revisions to return, 1 to 500. Defaults to 100.
  optional int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 500
  }];

  // Return the revisions numbered below this one. Omit for the first page; for
  // later pages, send next_before_revision from the previous response.
  optional int32 before_revision = 4 [(buf.validate.field).int32.gt = 0];
}

// A page of a milestone's revisions.
message ListMilestoneRevisionsResponse {
  // Revisions, newest first. Compare consecutive revisions to see what each
  // change did, such as moving the milestone from one version to another.
  repeated Milestone revisions = 1;

  // True when another page is available.
  bool has_more = 2;

  // The number of the last revision on this page; send it as before_revision
  // to get the next page. Set only when has_more is true.
  optional int32 next_before_revision = 3 [(buf.validate.field).int32.gt = 0];
}

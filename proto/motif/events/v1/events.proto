  optional bytes actor_user_id = 3 [(buf.validate.field).bytes.len = 16];
}

// A user's platform-wide role was revoked.
message GlobalMemberRemoved {
  bytes subject_user_id = 1 [(buf.validate.field).bytes.len = 16];
  optional bytes actor_user_id = 2 [(buf.validate.field).bytes.len = 16];
}

// A user's platform-wide role changed.
message GlobalRoleChanged {
  bytes subject_user_id = 1 [(buf.validate.field).bytes.len = 16];
  GlobalRole new_role = 2 [(buf.validate.field).enum = {
    not_in: [0]
  }];
  optional GlobalRole previous_role = 3 [(buf.validate.field).enum = {
    not_in: [0]
  }];
  optional bytes actor_user_id = 4 [(buf.validate.field).bytes.len = 16];
}

// =============================================================================
// Content
// =============================================================================

// A change to project or model content, or to a single recipient's project or
// model list. An unset `action` signals an unspecified change within the scope.
message ContentNotification {
  reserved 1; // Was `organization` (orgMembers lifecycle broadcast).

  // The scope is the namespace for this event; a branch must be set.
  oneof scope {
    option (buf.validate.oneof).required = true;

    ProjectContent project = 2;
    UserProjects user_projects = 3;
    UserModels user_models = 4;
    ModelContent model = 5;
  }
}

// A change to the project itself, delivered on `projectMembers/{project_id}`.
// View access is checked at subscribe time.
message ProjectContent {
  // The project this event is about, a 16-byte UUID. Required.
  bytes project_id = 1 [(buf.validate.field).bytes.len = 16];

  oneof action {
    ProjectRenamed renamed = 10;
  }
}

// A change to one model, delivered on `modelContent/{model_id}`. Subscribing
// requires the same View access as reading that model's history; access is
// rechecked while the subscription is open.
message ModelContent {
  // The model this event is about, a 16-byte UUID. Required.
  bytes model_id = 1 [(buf.validate.field).bytes.len = 16];

  oneof action {
    HistoryEnrichmentFinished history_enrichment_finished = 10;
  }
}

// A change to the set of projects visible to one user within one organization,
// delivered on `user/{user_id}/projects/{organization_id}`. The producer
// enumerates the users with view access to the project before publishing.
//
// `ProjectAdded` and `ProjectRemoved` are list-visibility events from the
// recipient's point of view, not project create/delete events: a project
// appears or disappears either because the project itself was created/deleted
// or because the recipient's access to it changed.
message UserProjects {
  // The recipient of this envelope, a 16-byte UUID. Required.
  bytes user_id = 1 [(buf.validate.field).bytes.len = 16];

  // The organization whose project list changed, a 16-byte UUID. Required.
  bytes organization_id = 2 [(buf.validate.field).bytes.len = 16];

  oneof action {
    // The project newly appeared in this user's project list, either because
    // the project was just created/copied or because the user was granted
    // access (first project role).
    ProjectAdded project_added = 10;
    ProjectRenamed project_renamed = 11;
    // The project disappeared from this user's project list, either because the
    // project was deleted or because the user's last project role was revoked.
    ProjectRemoved project_removed = 12;
  }
}

// A change to the set of models visible to one user within one project,
// delivered on `user/{user_id}/models/{project_id}`. Subscribing requires an
// Owner, Editor, or Viewer role on the project, and the channel is closed once
// the recipient loses that access.
//
// An action names what changed, never what it became: `ModelComponentsChanged`
// carries the ids of the components that changed, not their new values.
// Delivery order is not guaranteed, so the value in the most recently received
// event is not necessarily the current one; recipients re-read the model
// through the `motif.api.v1.Persistence` service instead, using the RPC named
// on each action below. To avoid missing events while initializing, subscribe
// and buffer first, then call `ListModels` for the initial list.
//
// `ModelAdded` and `ModelRemoved` are list-visibility events from the
// recipient's point of view, not model create/delete events: a model appears or
// disappears either because the model itself was created or archived or because
// the recipient's access to it changed.
message UserModels {
  // The recipient of this envelope, a 16-byte UUID. Required.
  bytes user_id = 1 [(buf.validate.field).bytes.len = 16];

  // The project whose model list changed, a 16-byte UUID. Required.
  bytes project_id = 2 [(buf.validate.field).bytes.len = 16];

  oneof action {
    ModelAdded model_added = 10;
    ModelRemoved model_removed = 11;
    ModelComponentsChanged model_components_changed = 12;
  }
}

// ---------------------------------------------------------------------------
// Shared project lifecycle payloads
// ---------------------------------------------------------------------------

// A project became visible to the recipient: created, copied, or newly granted
// access.
message ProjectAdded {
  // The project newly visible to the recipient, a 16-byte UUID. Required.
  bytes project_id = 1 [(buf.validate.field).bytes.len = 16];

  // The user who triggered the event, when known.
  optional bytes actor_user_id = 2 [(buf.validate.field).bytes.len = 16];
}

// A project's name changed. Under `ProjectContent`, `project_id` MUST equal
// `ProjectContent.project_id`.
message ProjectRenamed {
  // The project that was renamed, a 16-byte UUID. Required.
  bytes project_id = 1 [(buf.validate.field).bytes.len = 16];

  // The user who triggered the event, when known.
  optional bytes actor_user_id = 2 [(buf.validate.field).bytes.len = 16];
}

// Semantic history enrichment for one committed model version reached a
// terminal state.
message HistoryEnrichmentFinished {
  // Semantic history for one persisted stage of a model version.
  message StageSummary {
    // Only persisted stages are summaries; version cursor boundaries are not.
    // Numbers match the corresponding persistence cursor stages.
    enum Stage {
      STAGE_UNSPECIFIED = 0;
      STAGE_CLIENT = 10;
      STAGE_DERIVED = 69;
    }

    Stage stage = 1;

    // FAILED have no count rows. COMPLETE may have no rows for a no-op
    // stage. Unknown future states must never be interpreted as COMPLETE.
    enum State {
      STATE_UNSPECIFIED = 0;
      STATE_COMPLETE = 2;
      STATE_FAILED = 3;
    }

    State state = 2;

    option (buf.validate.message).cel = {
      id: "stage_summary.state_requires_empty_counts"
      message: "change_counts must be empty unless state is STATE_COMPLETE"
      expression: "this.state == 2 || this.change_counts.size() == 0"
    };
    option (buf.validate.message).cel = {
      id: "stage_summary.unique_change_counts"
      message: "change_counts must be unique by verb and category"
      expression: "this.change_counts.map(row, string(row.verb) + ':' + (has(row.revit_category) ? 'r:' + string(row.revit_category) : 'f:' + string(row.category_fallback))).unique()"
    };

    // Rows are unique by (verb, category arm and value). Producers emit them by
    // verb number, then category field number, then category value. Consumers
    // treat this as a set of absolute counts, never additive increments.
    repeated StageChangeCount change_counts = 3;
  }

  // A count of distinct affected entities in one verb/category bucket.
  message StageChangeCount {
    enum Verb {
      VERB_UNSPECIFIED = 0;
      VERB_CREATE = 1;
      VERB_UPDATE = 2;
      VERB_DELETE = 3;
    }

    // OTHER means all required facts were available but no category resolved.
    // UNAVAILABLE means facts required for resolution could not be obtained.
    enum CategoryFallback {
      CATEGORY_FALLBACK_UNSPECIFIED = 0;
      CATEGORY_FALLBACK_OTHER = 1;
      CATEGORY_FALLBACK_UNAVAILABLE = 2;
    }

    Verb verb = 1;
    uint32 count = 2 [(buf.validate.field).uint32.gt = 0];
    oneof category {
      option (buf.validate.oneof).required = true;

      // Use the maintained category enum directly. Unknown nonzero values from
      // newer producers must survive forwarding, not become OTHER or UNAVAILABLE.
      motif.data.external.v1.RevitCategory revit_category = 3;
      CategoryFallback category_fallback = 4;
    }
  }

  // Must equal the enclosing ModelContent.model_id.
  bytes model_id = 1 [(buf.validate.field).bytes.len = 16];
  int32 version = 2 [(buf.validate.field).int32.gt = 0];

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_COMPLETE = 2;
    STATUS_FAILED = 3;
  }

  Status status = 4;

  // Present only for COMPLETE: one CLIENT summary, followed by DERIVED
  // exactly when the version has derived changes. Every included stage is
  // COMPLETE, even an empty/no-op stage. Producers copy the committed result;
  // they must not reclassify or truncate counts to fit transport limits.
  repeated StageSummary stage_summaries = 5 [(buf.validate.field).repeated.max_items = 2];
}

// A project stopped being visible to the recipient: deleted, or the recipient's
// last role on it was revoked.
message ProjectRemoved {
  // The project no longer visible to the recipient, a 16-byte UUID. Required.
  bytes project_id = 1 [(buf.validate.field).bytes.len = 16];

  // The user who triggered the event, when known.
  optional bytes actor_user_id = 2 [(buf.validate.field).bytes.len = 16];
}

// ---------------------------------------------------------------------------
// Model lifecycle payloads
// ---------------------------------------------------------------------------

// A model became visible to the recipient: created, copied, unarchived, or
// newly granted access. Recipients call `ListModels` for the project's current
// list, selecting the sentinel-entity components they need to display it.
message ModelAdded {
  // The model newly visible to the recipient, a 16-byte UUID. Required.
  bytes model_id = 1 [(buf.validate.field).bytes.len = 16];
}

// A model stopped being visible to the recipient: archived, or the recipient's
// access to it was revoked. Recipients call `ListModels` for the project's
// current list.
message ModelRemoved {
  // The model no longer visible to the recipient, a 16-byte UUID. Required.
  bytes model_id = 1 [(buf.validate.field).bytes.len = 16];
}

// Components describing the model itself changed: its name, its thumbnail, or
// anything else carried on the model's sentinel entity. `component_ids` says
// which, so a recipient can ignore a change it does not display and re-read
// only what it needs.
//
// Recipients pass the ids they care about to `ListModels` as
// `select_components`, or `Query` the model's sentinel entity ID directly when
// only this one model is of interest. One event covers every component a single
// changeset touched, so a rename and a new thumbnail applied together arrive as
// one event naming both.
message ModelComponentsChanged {
  // The model whose components changed, a 16-byte UUID. Required.
  bytes model_id = 1 [(buf.validate.field).bytes.len = 16];

  // The IDs of the components that changed on the model's sentinel entity, for
  // example `motif.data.core.v1.AssignedName` or `ThumbnailRepresentation`.
  // At least one, each listed once.
  repeated int32 component_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
  }];
}

// =============================================================================
// Role enums
// =============================================================================

// Roles a user can hold on a project. `PROJECT_ROLE_UNSPECIFIED` is never
// published on the wire.
enum ProjectRole {
  PROJECT_ROLE_UNSPECIFIED = 0;
  PROJECT_ROLE_OWNER = 1;
  PROJECT_ROLE_EDITOR = 2;
  PROJECT_ROLE_REVIEWER = 3;
  PROJECT_ROLE_VIEWER = 4;
  PROJECT_ROLE_ORGANIZATION = 5;
}

// Roles a user can hold in an organization. `ORGANIZATION_ROLE_UNSPECIFIED` is
// never published on the wire.
enum OrganizationRole {
  ORGANIZATION_ROLE_UNSPECIFIED = 0;
  ORGANIZATION_ROLE_ADMIN = 1;
  ORGANIZATION_ROLE_MEMBER = 2;
  ORGANIZATION_ROLE_GUEST = 3;
}

// Roles a user can hold on a model. `MODEL_ROLE_UNSPECIFIED` is never published
// on the wire.
//
// A distinct role ladder from `ProjectRole`, intentionally narrower (no
// REVIEWER/ORGANIZATION) so changes to project semantics cannot accidentally
// widen what is valid on a model.
enum ModelRole {
  MODEL_ROLE_UNSPECIFIED = 0;
  MODEL_ROLE_OWNER = 1;
  MODEL_ROLE_EDITOR = 2;
  MODEL_ROLE_VIEWER = 3;
}

// Platform-wide roles, held independently of any organization, project, or
// model. `GLOBAL_ROLE_UNSPECIFIED` is never published on the wire.

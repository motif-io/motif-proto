syntax = "proto3";

// Notification event message types published by the Motif platform. Events are
// delivered to subscribers over WebSocket channels.
package motif.events.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "motif/data/external/v1/categories.proto";

// =============================================================================
// Envelope
// =============================================================================

// One message on the notification queue. `payload` selects the stream the event
// belongs to; exactly one branch is set on a published event.
message NotificationEnvelope {
  // A unique identifier for this event.
  string event_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];

  // When the change described by `payload` took effect. Required.
  google.protobuf.Timestamp occurred_at = 2 [(buf.validate.field).required = true];

  // The stream this event belongs to.
  oneof payload {
    option (buf.validate.oneof).required = true;

    AccessControlNotification access_control = 10;
    ContentNotification content = 11;
  }
}

// =============================================================================
// Access control
// =============================================================================

// A membership, role, or invitation change in exactly one scope. Subscribers
// receive only the scope their channel is bound to — a `projectMembers`
// subscription sees only the `project` branch.
message AccessControlNotification {
  // The scope is the namespace for this event; a branch must be set.
  oneof scope {
    option (buf.validate.oneof).required = true;

    OrganizationAccessControl organization = 1;
    ProjectAccessControl project = 2;
    ModelAccessControl model = 3;
    GlobalAccessControl global = 4;
  }
}

// ---------------------------------------------------------------------------
// Organization scope
// ---------------------------------------------------------------------------

// An organization membership, role, or invitation change, delivered on
// `orgMembers/{org_id}`.
//
// Subscribers to this channel hold organization-level view access, which does
// not imply access to any individual project. Organization-scoped events
// therefore carry no project- or model-identifying fields: action variants MUST
// NOT include `project_id`, `model_id`, or any similar field. Project lifecycle
// ships on `ContentNotification`, which is authorized per project.
//
// An unset `action` signals an unspecified change to this organization.
message OrganizationAccessControl {
  // The organization this event is about, a 16-byte UUID. Required.
  bytes organization_id = 1 [(buf.validate.field).bytes.len = 16];

  oneof action {
    OrganizationMemberAdded member_added = 10;
    OrganizationMemberRemoved member_removed = 11;
    OrganizationRoleChanged role_changed = 12;

    OrganizationInvitationSent invitation_sent = 20;
    OrganizationInvitationAccepted invitation_accepted = 21;
    OrganizationInvitationRevoked invitation_revoked = 22;
    OrganizationInvitationExpired invitation_expired = 23;
    OrganizationInvitationDeclined invitation_declined = 24;
  }
}

// A user became a member of the organization, holding `role`.
message OrganizationMemberAdded {
  bytes subject_user_id = 1 [(buf.validate.field).bytes.len = 16];
  OrganizationRole role = 2 [(buf.validate.field).enum = {
    not_in: [0]
  }];
  optional bytes actor_user_id = 3 [(buf.validate.field).bytes.len = 16];
}

// A user is no longer a member of the organization.
message OrganizationMemberRemoved {
  bytes subject_user_id = 1 [(buf.validate.field).bytes.len = 16];
  optional bytes actor_user_id = 2 [(buf.validate.field).bytes.len = 16];
}

// An existing member's organization role changed.
message OrganizationRoleChanged {
  bytes subject_user_id = 1 [(buf.validate.field).bytes.len = 16];
  OrganizationRole new_role = 2 [(buf.validate.field).enum = {
    not_in: [0]
  }];
  optional OrganizationRole previous_role = 3 [(buf.validate.field).enum = {
    not_in: [0]
  }];
  optional bytes actor_user_id = 4 [(buf.validate.field).bytes.len = 16];
}

// An invitation to join the organization was created. Carries no invitee
// contact details; `invitation_id` identifies the invitation record.
message OrganizationInvitationSent {
  string invitation_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  OrganizationRole proposed_role = 2 [(buf.validate.field).enum = {
    not_in: [0]
  }];
  optional bytes subject_user_id = 3 [(buf.validate.field).bytes.len = 16];
  optional bytes actor_user_id = 4 [(buf.validate.field).bytes.len = 16];
}

// An invitee accepted an organization invitation. A separate envelope carries
// the corresponding `OrganizationMemberAdded`.
message OrganizationInvitationAccepted {
  string invitation_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  bytes subject_user_id = 2 [(buf.validate.field).bytes.len = 16];
  // The active role; usually equal to the invitation's proposed role.
  OrganizationRole role = 3 [(buf.validate.field).enum = {
    not_in: [0]
  }];
}

// An organization invitation was withdrawn before being accepted.
message OrganizationInvitationRevoked {
  string invitation_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional bytes subject_user_id = 2 [(buf.validate.field).bytes.len = 16];
  optional bytes actor_user_id = 3 [(buf.validate.field).bytes.len = 16];
}

// An organization invitation lapsed without being accepted.
message OrganizationInvitationExpired {
  string invitation_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional bytes subject_user_id = 2 [(buf.validate.field).bytes.len = 16];
}

// An invitee declined an organization invitation.
message OrganizationInvitationDeclined {
  string invitation_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional bytes subject_user_id = 2 [(buf.validate.field).bytes.len = 16];
  optional bytes actor_user_id = 3 [(buf.validate.field).bytes.len = 16];
}


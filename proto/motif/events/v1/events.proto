    ProjectMemberRemoved member_removed = 11;
    ProjectRoleChanged role_changed = 12;

    ProjectInvitationSent invitation_sent = 20;
    ProjectInvitationAccepted invitation_accepted = 21;
    ProjectInvitationRevoked invitation_revoked = 22;
    ProjectInvitationExpired invitation_expired = 23;
    ProjectInvitationDeclined invitation_declined = 24;
  }
}


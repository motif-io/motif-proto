// ---------------------------------------------------------------------------
// Global scope
// ---------------------------------------------------------------------------

// A change to a user's platform-wide role. Carries no organization, project, or
// model identifier, because the role is not scoped to any of them.
message GlobalAccessControl {
  oneof action {
    GlobalMemberAdded member_added = 10;
    GlobalMemberRemoved member_removed = 11;
    GlobalRoleChanged role_changed = 12;
  }
}

// A user was granted a platform-wide role.
message GlobalMemberAdded {
  bytes subject_user_id = 1 [(buf.validate.field).bytes.len = 16];
  GlobalRole role = 2 [(buf.validate.field).enum = {

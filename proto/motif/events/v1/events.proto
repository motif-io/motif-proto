  // Denormalized for routing. The primary scope is `model_id`.
  optional bytes project_id_context = 2 [(buf.validate.field).bytes.len = 16];

  oneof action {
    ModelMemberAdded member_added = 10;
    ModelMemberRemoved member_removed = 11;
    ModelRoleChanged role_changed = 12;

    ModelInvitationSent invitation_sent = 20;
    ModelInvitationAccepted invitation_accepted = 21;
    ModelInvitationRevoked invitation_revoked = 22;
    ModelInvitationExpired invitation_expired = 23;
    ModelInvitationDeclined invitation_declined = 24;
